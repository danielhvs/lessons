<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GWC disk quota</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1d1f; --muted: #6b6b70; --line: #d8d6d0; --panel: #f0eee8;
    --a: #e8590c; --b: #1c7ed6; --c: #2b8a3e; --d: #9c36b5; --r: #d6336c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141417; --fg: #ececf0; --muted: #9a9aa3; --line: #34343b; --panel: #1f1f24;
      --a: #ff922b; --b: #4dabf7; --c: #51cf66; --d: #da77f2; --r: #f06595;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: 6px; gap: 6px; }
  #top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  #links { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-self: start; }
  #top a { color: var(--b); font-size: 16px; }
  #where { text-align: center; font-size: 22px; font-weight: 700; }
  #stage { flex: 1; min-height: 0; width: 100%; display: block; touch-action: manipulation; }
  #stage text { white-space: pre; fill: var(--fg); }
  #talk { min-height: 104px; }
  #caption, #ask { font-size: 20px; line-height: 1.35; padding: 6px 10px; border-radius: 4px;
    background: var(--panel); min-height: 104px; }
  #caption { border-left: 4px solid var(--d); }
  #caption b { color: var(--d); }
  #ask { border-left: 4px solid var(--a); display: none; }
  #ask .q b { color: var(--a); }
  #ask .ctl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  #ask button, #ask input { font: inherit; font-size: 20px; padding: 4px 12px; border-radius: 6px;
    border: 2px solid var(--line); background: var(--bg); color: var(--fg); }
  #ask button { cursor: pointer; }
  #ask input { width: 90px; text-align: center; }
  #ask .ok { border-color: var(--c); color: var(--c); }
  #ask .bad { border-color: var(--r); color: var(--r); }
  #ask .show { color: var(--muted); }
  #hint { color: var(--r); font-size: 18px; margin-top: 4px; }
  #terms { font-size: 16px; line-height: 1.4; min-height: 4.2em; padding: 2px 10px; color: var(--muted); }
  #terms b { color: var(--fg); }
  #bar { display: flex; align-items: center; gap: 6px; font-size: 16px; flex-wrap: wrap; }
  #bar button { font: inherit; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #bar button:not(.spd) { width: 60px; padding: 4px 0; text-align: center; letter-spacing: -3px; }
  #bar button[data-k]::after { content: attr(data-k); margin-left: 6px; font-size: 13px; letter-spacing: 0; opacity: .7; }
  #bar button:disabled { opacity: .4; cursor: default; }
  #bar button.on { border-color: var(--d); color: var(--d); }
  #timeline { flex: 1; min-width: 160px; height: 22px; display: flex; gap: 3px; cursor: pointer; }
  #timeline .seg { position: relative; background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; overflow: hidden; }
  #timeline .fill { position: absolute; inset: 0; width: 0; background: var(--d); opacity: .55; }
  #m { position: absolute; width: 0; height: 0; visibility: hidden; }
  #m text { white-space: pre; }
</style>
</head>
<body>
<div id="top"><nav id="links"><a href="../">← all lessons</a></nav><div id="where"></div><span></span></div>
<svg id="stage" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>
<div id="talk">
  <div id="caption"></div>
  <div id="ask"><div class="q"></div><div class="ctl"></div><div id="hint"></div></div>
</div>
<div id="terms"></div>
<div id="bar">
  <button id="restart" data-k="H" title="restart (H)">⏮</button>
  <button id="prev" data-k="h" title="previous scene (h, ←)">◀◀</button>
  <button id="play" data-k="SPC" title="play / pause (space)">▶</button>
  <button id="next" data-k="l" title="next scene (l, →)">▶▶</button>
  <button id="replay" data-k="r" title="replay this scene (r)">↻</button>
  <button class="spd" data-s="0.5" data-k="1" title="0.5x (1)">0.5x</button>
  <button class="spd on" data-s="1" data-k="2" title="1x (2)">1x</button>
  <button class="spd" data-s="2" data-k="3" title="2x (3)">2x</button>
  <div id="timeline"></div>
</div>
<svg id="m"><text id="mt"></text></svg>
<script>
const COL = { a: "var(--a)", b: "var(--b)", c: "var(--c)", d: "var(--d)", r: "var(--r)",
  m: "var(--muted)", l: "var(--line)", f: "var(--fg)", p: "var(--panel)" };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => (t = clamp(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const P = (t, a, b) => ease((t - a) / (b - a));
const L = (a, b, p) => a + (b - a) * p;

let out = [];
const add = s => out.push(s);
const span = ([s, c, w]) => `<tspan${c ? ` fill="${COL[c]}"` : ""}${w ? ' font-weight="700"' : ""}>${s}</tspan>`;
const mt = document.getElementById("mt"), wcache = {};
function width(tokens, size) {
  const k = size + "|" + JSON.stringify(tokens);
  if (!(k in wcache)) {
    mt.setAttribute("font-size", size);
    mt.innerHTML = tokens.map(span).join("");
    wcache[k] = mt.getComputedTextLength();
  }
  return wcache[k];
}
function text(x, y, tokens, size, o = {}) {
  if (typeof tokens === "string") tokens = [[tokens, o.c]];
  const op = o.op ?? 1;
  if (op <= 0.001) return;
  add(`<text x="${x}" y="${y}" font-size="${size}" text-anchor="${o.anchor || "start"}" opacity="${op}">${tokens.map(span).join("")}</text>`);
}
// lays tokens out left to right centered on cx, returns each token's center x
function row(cx, y, tokens, size, o = {}) {
  const ws = tokens.map(t => width([t], size));
  let x = cx - ws.reduce((a, b) => a + b, 0) / 2;
  const centers = [];
  tokens.forEach((t, i) => {
    const op = Array.isArray(o.op) ? o.op[i] : o.op ?? 1;
    text(x, y, [t], size, { op });
    centers.push(x + ws[i] / 2);
    x += ws[i];
  });
  return centers;
}
const line = (x1, y1, x2, y2, color, w = 3, op = 1, dash = "") => op > 0 && add(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${COL[color]}" stroke-width="${w}" stroke-dasharray="${dash}" stroke-linecap="round" opacity="${op}"/>`);
function frac(cx, cy, n, d, size, c, op = 1) {
  if (op <= 0.001) return;
  const w = Math.max(width([[n]], size), width([[d]], size)) + 20;
  if (n !== null) text(cx, cy - size * 0.3, [[n, c, 1]], size, { anchor: "middle", op });
  line(cx - w / 2, cy, cx + w / 2, cy, "f", 3, op);
  text(cx, cy + size, [[d, c, 1]], size, { anchor: "middle", op });
}
// one whole as a bar cut into n equal pieces; the first k shaded; a strong line every `glue` pieces
function fbar(x, y, w, h, n, k, color, op = 1, glue = 1) {
  if (op <= 0) return;
  const pw = w / n;
  for (let i = 0; i < n; i++) {
    const s = clamp(k - i);
    add(`<rect x="${x + i * pw}" y="${y}" width="${pw}" height="${h}" fill="${s > 0 ? COL[color] : COL.p}" fill-opacity="${s > 0 ? .25 + .45 * s : 1}" opacity="${op}"/>`);
  }
  for (let i = 1; i < n; i++) {
    const strong = i % glue === 0;
    line(x + i * pw, y, x + i * pw, y + h, "f", strong ? 3 : 1.5, op * (strong ? 1 : .35));
  }
  add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${COL.f}" stroke-width="3" opacity="${op}"/>`);
}
const piece = (x, y, w, h, color) => add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${COL[color]}" fill-opacity=".6"/>`);

// ---------- checkpoint answers drawn in the stage
let cur = 0;
const ans = [];
// the user's answer flies from the "your turn" box to (x, y) at ck.show; a wrong one stays above, struck out
function answerAt(x, y, size, t, c = "c") {
  const ck = SCENES[cur].ck, a = ans[cur], show = ck.show ?? ck.at;
  if (!a || t < show) return text(x, y, [["?", "m", 1]], size, { anchor: "middle" });
  const right = "" + ck.answer, mine = a.val == null ? null : "" + a.val, p = P(t, show, show + .9);
  if (mine !== null && p < 1) {
    return text(L(500, x, p), L(690, y, p) - Math.sin(p * Math.PI) * 80, [[mine, a.ok ? c : "r", 1]], size, { anchor: "middle" });
  }
  text(x, y, [[right, c, 1]], size, { anchor: "middle", op: mine === null ? P(t, show, show + .6) : 1 });
  if (!a.ok && mine !== null) {
    const s = Math.max(34, size * .6), w = width([["you: " + mine]], s), yy = y - size * 1.05;
    text(x, yy, [["you: " + mine, "r"]], s, { anchor: "middle" });
    line(x - w / 2, yy - s * .32, x + w / 2, yy - s * .32, "r", 3);
  }
}

const GLOSS = {
  "GWC": "GeoWebCache, the tile cache built into GeoServer",
  "tile": "a small square image of the map (usually 256 x 256 px) at one zoom level",
  "zoom level": "one layer of the tile pyramid; each level has 4 times the tiles of the one above",
  "seed": "a GWC task that renders and stores every tile of an area ahead of time",
  "disk quota": "GWC's limit on how many bytes of tiles it keeps on disk",
  "LFU": "Least Frequently Used: delete the tiles requested the fewest times",
  "LRU": "Least Recently Used: delete the tiles that went the longest without a request",
  "MiB": "mebibyte, 1024 x 1024 bytes (about 1.05 MB)",
  "GiB": "gibibyte, 1024 MiB (about 1.07 GB)",
  "TiB": "tebibyte, 1024 GiB (about 1.10 TB)",
  "page": "a block of neighbouring tiles at one zoom level; GWC counts usage per page, not per tile",
  "tile set": "all tiles of one layer, grid, format and style; GWC keeps one byte total per tile set",
  "quota store": "the database that holds the page counters and byte totals: in-process H2 or HSQL by default, or an external PostgreSQL or Oracle",
  "global quota": "the limit for the whole cache, across all layers",
  "layer quota": "a limit for one layer, carved out of the global quota",
  "cache miss": "the tile is not on disk, so GeoServer renders it from the data and stores it",
  "direct WMS integration": "GeoServer answers plain WMS tile requests from the GWC cache, so tiles get cached as users pan",
};

const box = (x, y, w, h, label, c, op = 1, sub = "", size = 28) => {
  if (op <= 0.001) return;
  add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="${COL[c]}" fill-opacity=".16" stroke="${COL[c]}" stroke-width="3" opacity="${op}"/>`);
  text(x + w / 2, y + h / 2 + (sub ? -4 : size * .35), [[label, c, 1]], size, { anchor: "middle", op });
  if (sub) text(x + w / 2, y + h / 2 + 30, [[sub, "m"]], 22, { anchor: "middle", op });
};
function arrow(x1, y1, x2, y2, c = "m", p = 1) {
  if (p <= 0) return;
  const x = L(x1, x2, p), y = L(y1, y2, p), a = Math.atan2(y2 - y1, x2 - x1), s = 16;
  line(x1, y1, x, y, c, 4);
  add(`<polygon points="${x},${y} ${x - s * Math.cos(a - .45)},${y - s * Math.sin(a - .45)} ${x - s * Math.cos(a + .45)},${y - s * Math.sin(a + .45)}" fill="${COL[c]}"/>`);
}
function chip(x, y, label, c, size = 26, op = 1) {
  if (op <= 0.001) return;
  const w = width([[label]], size) + 30, h = size * 1.6;
  add(`<rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="10" fill="${COL.p}" stroke="${COL[c]}" stroke-width="3" opacity="${op}"/>`);
  text(x, y + size * .35, [[label, c, 1]], size, { anchor: "middle", op });
}
// a horizontal disk bar: used part filled, quota as a red line
function disk(x, y, w, h, frac, c, op = 1) {
  if (op <= 0.001) return;
  add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${COL.p}" stroke="${COL.f}" stroke-width="3" opacity="${op}"/>`);
  add(`<rect x="${x}" y="${y}" width="${w * clamp(frac)}" height="${h}" rx="8" fill="${COL[c]}" fill-opacity=".5" opacity="${op}"/>`);
}
const fmt = n => Math.round(n).toLocaleString("en-US");

// the four pages of the LFU and LRU scenes: size MiB, hits, last request
const PAGES = [["page A", 200, 900, "7 days ago"], ["page B", 120, 40, "2 min ago"],
               ["page C", 150, 300, "1 h ago"], ["page D", 50, 3, "30 s ago"]];
function pages(t, gone, mark) {
  PAGES.forEach(([n, mib, hits, last], i) => {
    const x = 20 + i * 245, out = gone === i ? P(t, 5, 6.5) : 0, y = 90 + out * 40;
    const c = mark === "hits" && gone === i ? "r" : mark === "last" && gone === i ? "r" : "b";
    box(x, y, 225, 190, "", c, (1 - out * .85) * P(t, 0, .8));
    text(x + 112, y + 45, [[n, c, 1]], 28, { anchor: "middle", op: (1 - out * .85) * P(t, 0, .8) });
    text(x + 112, y + 95, [[mib + " MiB", "f", 1]], 26, { anchor: "middle", op: (1 - out * .85) * P(t, 0, .8) });
    text(x + 112, y + 135, [[hits + " hits", mark === "hits" ? "a" : "m", mark === "hits"]], 24, { anchor: "middle", op: (1 - out * .85) * P(t, .5, 1.2) });
    text(x + 112, y + 170, [[last, mark === "last" ? "a" : "m", mark === "last"]], 24, { anchor: "middle", op: (1 - out * .85) * P(t, .5, 1.2) });
    if (gone === i) text(x + 112, y + 240, [["deleted", "r", 1]], 28, { anchor: "middle", op: P(t, 6, 6.6) });
  });
  const used = 520 - (gone === null ? 0 : PAGES[gone][1] * P(t, 5, 6.5));
  // bar: 0..600 MiB over 900 px
  disk(50, 470, 900, 60, used / 600, used > 500 ? "r" : "c");
  line(50 + 900 * 500 / 600, 450, 50 + 900 * 500 / 600, 550, "r", 4);
  text(50 + 900 * 500 / 600, 585, [["quota 500 MiB", "r", 1]], 24, { anchor: "middle" });
  text(50, 445, [["used: " + fmt(used) + " MiB", used > 500 ? "r" : "c", 1]], 28);
}

const SCENES = [
{ title: "Tiles multiply", dur: 9, terms: ["GWC", "tile", "zoom level"],
  cap: [[0, "<b>GWC</b> saves every tile GeoServer renders, so the next request for it is read from disk instead of drawn again."],
        [4, "Each zoom level splits every tile in 4: 1, 4, 16, 64 tiles for the whole world."]],
  draw(t) {
    [0, 1, 2, 3].forEach(z => {
      const n = 2 ** z, x = 30 + z * 245, y = 140, s = 210, op = P(t, z * 1.3, z * 1.3 + 1);
      if (op <= 0) return;
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++)
        add(`<rect x="${x + j * s / n}" y="${y + i * s / n}" width="${s / n}" height="${s / n}" fill="${COL.b}" fill-opacity=".3" stroke="${COL.b}" stroke-width="${z < 3 ? 2 : 1}" opacity="${op}"/>`);
      text(x + s / 2, y + s + 50, [["zoom " + z, "m"]], 26, { anchor: "middle", op });
      text(x + s / 2, y + s + 95, [[(n * n) + (n * n === 1 ? " tile" : " tiles"), "b", 1]], 30, { anchor: "middle", op });
    });
    chip(500, 620, "x4 per zoom level", "a", 28, P(t, 5.5, 6.3));
  } },

{ title: "Without a quota the cache only grows", dur: 11, terms: ["disk quota", "seed", "GiB", "TiB"],
  cap: [[0, "Disk quota is <b>off by default</b>: GWC never deletes a tile on its own."],
        [3.5, "Say each tile is 20 KiB. Zoom 0 to 12 is 22,369,621 tiles: about 427 GiB for one layer."],
        [7.5, "Go to zoom 18 and it is about 1,707 TiB. One <b>seed</b> task or a lot of panning can fill the disk."]],
  draw(t) {
    const rows = [["zoom 0", 1], ["zoom 4", 256], ["zoom 8", 65536], ["zoom 12", 16777216]];
    rows.forEach(([z, n], i) => {
      const op = P(t, .5 + i * .6, 1.1 + i * .6), y = 90 + i * 60;
      text(330, y, [[z, "m"]], 28, { anchor: "end", op });
      text(370, y, [[fmt(n) + (n === 1 ? " tile" : " tiles"), "b", 1]], 28, { op });
    });
    const p = P(t, 3.5, 6.5);
    text(330, 360, [["zoom 0 to 12", "f", 1]], 28, { anchor: "end", op: P(t, 3.5, 4) });
    text(370, 360, [[fmt(22369621 * p) + " tiles x 20 KiB = " + Math.round(427 * p) + " GiB", "a", 1]], 28, { op: P(t, 3.5, 4) });
    disk(50, 420, 900, 60, P(t, 3.5, 6.5) * .55 + P(t, 7.5, 9.5) * .45, P(t, 7.5, 9.5) > .9 ? "r" : "a");
    text(500, 540, [["disk", "m"]], 26, { anchor: "middle" });
    chip(500, 620, "zoom 0 to 18: about 1,707 TiB", "r", 28, P(t, 8, 8.8));
  } },

{ title: "Set a limit", dur: 10, terms: ["disk quota", "MiB", "LFU"],
  cap: [[0, "Turn it on in GeoServer under Tile Caching, Disk Quota, or in <b>geowebcache-diskquota.xml</b> in the cache folder."],
        [5, "Defaults once enabled: <b>500 MiB</b> max, a check every <b>10 s</b>, and the LFU removal policy."]],
  draw(t) {
    const lines = [["<gwcQuotaConfiguration>", "m"], ["  <enabled>true</enabled>", "c"],
      ["  <cacheCleanUpFrequency>10</cacheCleanUpFrequency>", "a"], ["  <cacheCleanUpUnits>SECONDS</cacheCleanUpUnits>", "a"],
      ["  <globalQuota><value>500</value><units>MiB</units></globalQuota>", "r"],
      ["  <globalExpirationPolicyName>LFU</globalExpirationPolicyName>", "b"], ["</gwcQuotaConfiguration>", "m"]];
    lines.forEach(([s, c], i) => text(40, 70 + i * 46, [[s.replace(/</g, "&lt;").replace(/>/g, "&gt;"), c, c !== "m"]], 24, { op: P(t, .5 + i * .5, 1 + i * .5) }));
    disk(50, 470, 900, 60, .6, "c", P(t, 5, 5.6));
    const qx = 50 + 900 * .8;
    line(qx, 450, qx, 550, "r", 5, P(t, 5.5, 6.2));
    text(qx, 585, [["max 500 MiB", "r", 1]], 26, { anchor: "middle", op: P(t, 5.5, 6.2) });
    text(50, 585, [["tiles on disk", "c", 1]], 26, { op: P(t, 5, 5.6) });
  } },

{ title: "Bookkeeping on every tile", dur: 11, terms: ["page", "tile set", "quota store"],
  cap: [[0, "GWC groups neighbouring tiles of one zoom level into <b>pages</b>."],
        [3, "Every request for a tile adds 1 to its page's hit count and stamps the time of last access."],
        [7, "Every tile stored or deleted changes the byte total of its tile set. Both live in the <b>quota store</b>."]],
  draw(t) {
    const x0 = 60, y0 = 80, s = 50;
    for (let i = 0; i < 6; i++) for (let j = 0; j < 8; j++) {
      const pg = (i < 3 ? 0 : 2) + (j < 4 ? 0 : 1);
      add(`<rect x="${x0 + j * s}" y="${y0 + i * s}" width="${s}" height="${s}" fill="${COL[["b", "a", "c", "d"][pg]]}" fill-opacity="${.15 + .25 * P(t, .5, 2)}" stroke="${COL.l}" stroke-width="1.5"/>`);
    }
    ["A", "B", "C", "D"].forEach((n, k) => text(x0 + (k % 2 ? 6 : 2) * s, y0 + (k < 2 ? 1.6 : 4.6) * s, [["page " + n, "f", 1]], 24, { anchor: "middle", op: P(t, 1, 2) }));
    // a request lands on one tile of page A
    const hit = P(t, 3, 4.2);
    if (hit > 0) {
      arrow(620, 60, L(620, x0 + 2.5 * s, hit), L(60, y0 + .5 * s, hit), "a", 1);
      text(640, 70, [["GET tile", "a", 1]], 26);
    }
    const hits = 899 + (t > 4.2 ? 1 : 0);
    box(560, 160, 400, 120, "page A", "b", P(t, 3, 3.6), "hits " + hits + ", last: " + (t > 4.2 ? "now" : "7 days ago"), 26);
    const bytes = 480 + (t > 8.5 ? 20 * P(t, 8.5, 9.5) : 0);
    box(560, 330, 400, 120, "tile set: roads, PNG", "c", P(t, 7, 7.6), "total " + fmt(bytes) + " MiB", 26);
    chip(250, 470, "new tiles stored: +20 MiB", "c", 24, P(t, 8, 8.6));
    box(220, 560, 560, 110, "quota store", "m", P(t, 9.5, 10.2), "H2 / HSQL in process, or PostgreSQL / Oracle", 28);
  } },

{ title: "The check every 10 s", dur: 11, terms: ["disk quota"],
  cap: [[0, "GWC does not act the moment the limit is crossed: it looks at the totals every 10 s."],
        [4, "Between two checks the cache can go over. At the next check: 520 MiB used, 500 allowed, so cleanup starts."]],
  draw(t) {
    const ang = P(t, 0, 10) * 4 * Math.PI - Math.PI / 2;
    add(`<circle cx="160" cy="180" r="100" fill="${COL.p}" stroke="${COL.a}" stroke-width="4"/>`);
    line(160, 180, 160 + 80 * Math.cos(ang), 180 + 80 * Math.sin(ang), "a", 6);
    text(160, 325, [["every 10 s", "a", 1]], 28, { anchor: "middle" });
    const used = 470 + 50 * P(t, 2, 6);
    text(420, 120, [["used: " + fmt(used) + " MiB", used > 500 ? "r" : "c", 1]], 30, { op: 1 });
    text(420, 175, [["check 1: " + (t > 1 ? "470 &lt;= 500, nothing to do" : "..."), "m"]], 26, { op: P(t, .5, 1.2) });
    text(420, 225, [["check 2: 520 &gt; 500, over by 20 MiB", "r", 1]], 26, { op: P(t, 6.5, 7.2) });
    disk(50, 420, 900, 60, used / 600, used > 500 ? "r" : "c");
    line(800, 400, 800, 500, "r", 4);
    text(800, 535, [["quota 500 MiB", "r", 1]], 24, { anchor: "middle" });
    chip(500, 625, "cleanup: delete pages until used <= 500 MiB".replace("<", "&lt;"), "r", 26, P(t, 8, 8.8));
  } },

{ title: "LFU: delete the least used", dur: 10, terms: ["LFU", "page"],
  cap: [[0, "Four pages, 520 MiB in all, 20 MiB over the quota."],
        [3, "<b>LFU</b> looks at the hit counts: page D was asked for only 3 times, so it goes first."],
        [6.5, "One page freed 50 MiB: 470 MiB is under 500, so cleanup stops. The busy pages stay."]],
  draw(t) { pages(t, 3, "hits"); } },

{ title: "LRU: delete the oldest", dur: 10, terms: ["LRU", "page"],
  cap: [[0, "The same four pages, now with <b>LRU</b>."],
        [3, "LRU looks at the last request: page A was the busiest, but nobody asked for it in 7 days."],
        [6.5, "A goes: 320 MiB. LRU fits a map where interest moves: last week's area makes room for today's."]],
  draw(t) { pages(t, 0, "last"); } },

{ title: "Global and layer quotas", dur: 11, terms: ["global quota", "layer quota", "GiB"],
  cap: [[0, "The <b>global quota</b> caps the whole cache. Here 512 GiB, as in the GWC docs example."],
        [3.5, "A <b>layer quota</b> gives one layer its own share: topp:states gets 100 GiB, with its own policy."],
        [7, "The other 412 GiB is shared by every layer without its own quota. Layer quotas are enforced first, then the global one."]],
  draw(t) {
    const x = 50, w = 900, y = 200, h = 90;
    add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${COL.p}" stroke="${COL.f}" stroke-width="3" opacity="${P(t, 0, .8)}"/>`);
    text(500, 170, [["global quota: 512 GiB", "f", 1]], 30, { anchor: "middle", op: P(t, 0, .8) });
    const lw = w * 100 / 512 * P(t, 3.5, 5);
    add(`<rect x="${x}" y="${y}" width="${lw}" height="${h}" rx="8" fill="${COL.a}" fill-opacity=".5"/>`);
    text(x + w * 100 / 512 / 2, y + h + 50, [["topp:states", "a", 1]], 26, { anchor: "middle", op: P(t, 4.5, 5.2) });
    text(x + w * 100 / 512 / 2, y + h + 85, [["100 GiB, LRU", "a"]], 24, { anchor: "middle", op: P(t, 4.5, 5.2) });
    const sx = x + w * 100 / 512;
    add(`<rect x="${sx}" y="${y}" width="${(w - w * 100 / 512) * P(t, 7, 8.5)}" height="${h}" rx="8" fill="${COL.b}" fill-opacity=".35"/>`);
    text(sx + (w - w * 100 / 512) / 2, y + h + 50, [["every other layer, shared", "b", 1]], 26, { anchor: "middle", op: P(t, 8, 8.7) });
    text(sx + (w - w * 100 / 512) / 2, y + h + 85, [["412 GiB, global policy", "b"]], 24, { anchor: "middle", op: P(t, 8, 8.7) });
    chip(500, 560, "1. layer quotas   2. global quota", "m", 28, P(t, 9, 9.8));
  } },

{ title: "The price of a deleted tile", dur: 11, terms: ["cache miss"],
  cap: [[0, "A tile still on disk is read and sent: fast, no work for GeoServer."],
        [4, "A deleted tile is a <b>cache miss</b>: GeoServer reads the data and draws it again, then stores it, and it counts toward the quota again."],
        [8.5, "So the quota trades disk for render time, and the policy decides which tiles pay that price."]],
  draw(t) {
    box(30, 70, 220, 110, "request", "f", P(t, 0, .6));
    box(390, 70, 220, 110, "GWC cache", "c", P(t, 0, .6), "tile on disk");
    box(750, 70, 220, 110, "user", "b", P(t, 0, .6));
    arrow(254, 125, 386, 125, "c", P(t, .8, 1.8));
    arrow(614, 125, 746, 125, "c", P(t, 1.8, 2.8));
    chip(500, 230, "hit: read from disk", "c", 26, P(t, 2.5, 3.2));
    box(30, 350, 220, 110, "request", "f", P(t, 4, 4.6));
    box(390, 350, 220, 110, "GWC cache", "r", P(t, 4, 4.6), "tile deleted");
    box(390, 540, 220, 110, "GeoServer", "a", P(t, 5, 5.6), "render from data");
    box(750, 350, 220, 110, "user", "b", P(t, 4, 4.6));
    arrow(254, 405, 386, 405, "r", P(t, 4.6, 5.4));
    arrow(500, 464, 500, 536, "a", P(t, 5.4, 6.2));
    arrow(614, 595, 746, 430, "a", P(t, 6.4, 7.4));
    chip(800, 520, "stored again", "a", 24, P(t, 7.4, 8));
  } },

{ title: "When it pays off", dur: 12, terms: ["direct WMS integration", "seed"],
  cap: [[0, "Worth it when the cache can outgrow the disk: deep zoom levels, many layers on one disk, tiles cached on demand through <b>direct WMS integration</b>."],
        [6, "Little to gain when the whole cache fits on the disk with room to spare, or when a fully <b>seeded</b> cache must stay complete: the quota would delete seeded tiles."]],
  draw(t) {
    text(250, 80, [["use it", "c", 1]], 34, { anchor: "middle", op: P(t, 0, .6) });
    text(750, 80, [["skip it", "m", 1]], 34, { anchor: "middle", op: P(t, 6, 6.6) });
    line(500, 50, 500, 650, "l", 2);
    [["disk can fill up", 1], ["deep zoom levels", 1.8], ["many layers, one disk", 2.6], ["tiles cached as users pan", 3.4], ["keeps the busy tiles", 4.2]]
      .forEach(([s, a], i) => chip(250, 170 + i * 95, s, "c", 26, P(t, a, a + .6)));
    [["cache fits with room to spare", 6.6], ["seeded cache must stay whole", 7.4], ["bookkeeping on every request", 8.2]]
      .forEach(([s, a], i) => chip(750, 170 + i * 95, s, "m", 24, P(t, a, a + .6)));
  } },
];

// ---------- player
const HEADLESS = /HeadlessChrome/.test(navigator.userAgent);
const PRACTICE = false;
const $ = id => document.getElementById(id);
const starts = []; let total = 0;
SCENES.forEach(s => { starts.push(total); total += s.dur; });
const svg = $("stage"), cap = $("caption"), ask = $("ask"), terms = $("terms");
let T = 0, playing = false, speed = 1, lastTs = null, lastKey = "", tries = 0, tapWrong = null, lastWrong = null;
const sceneAt = T => { let i = 0; while (i + 1 < SCENES.length && T >= starts[i + 1]) i++; return i; };
const sceneEnd = i => starts[i] + SCENES[i].dur - 1e-3;
const ckTime = i => starts[i] + SCENES[i].ck.at;
const ckOpen = () => { const i = sceneAt(T), ck = SCENES[i].ck; return !!ck && !ans[i] && T >= ckTime(i) - 1e-6; };

const tl = $("timeline");
SCENES.forEach((s, i) => {
  const seg = document.createElement("div");
  seg.className = "seg"; seg.style.flex = s.dur; seg.title = `${i + 1}. ${s.title}`;
  seg.innerHTML = '<div class="fill"></div>';
  tl.appendChild(seg);
});
const fills = [...tl.querySelectorAll(".fill")];

function buildAsk(i) {
  const ck = SCENES[i].ck;
  tries = 0; tapWrong = null; lastWrong = null;
  ask.querySelector(".q").innerHTML = `<b>Your turn:</b> ${ck.q}`;
  $("hint").textContent = "";
  const ctl = ask.querySelector(".ctl");
  ctl.innerHTML = "";
  if (ck.kind === "num") {
    ctl.innerHTML = '<input id="in" type="text" inputmode="numeric" autocomplete="off"><button id="check">Check</button>';
    const inp = $("in");
    inp.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") submit(inp.value.trim(), inp); });
    $("check").onclick = () => submit(inp.value.trim(), inp);
  } else if (ck.kind === "opt") {
    ck.opts.forEach(o => {
      const b = document.createElement("button");
      b.textContent = o; b.onclick = () => submit(o, b);
      ctl.appendChild(b);
    });
  } else {
    ctl.insertAdjacentHTML("beforeend", '<span>Tap the drawing.</span>');
  }
  const show = document.createElement("button");
  show.className = "show"; show.textContent = "Show answer";
  show.onclick = () => resolve(lastWrong, false);
  ctl.appendChild(show);
}
function submit(val, el) {
  if (val === "") return;
  const i = sceneAt(T), ck = SCENES[i].ck;
  if (String(val) === String(ck.answer)) {
    if (el) el.classList.add("ok");
    return setTimeout(() => resolve(val, true), 450);
  }
  tries++; lastWrong = val;
  if (el) el.classList.add("bad");
  if (ck.kind === "tap") { tapWrong = val; lastKey = ""; }
  if (tries >= 2) return setTimeout(() => resolve(val, false), 450);
  $("hint").textContent = "Not quite. Hint: " + ck.hint;
}
function resolve(val, ok) {
  const i = sceneAt(T);
  if (ans[i]) return;
  ans[i] = { val, ok };
  lastKey = "";
  setPlaying(true);
}

let askFor = -1;
function render() {
  const i = sceneAt(T), s = SCENES[i], t = Math.min(T - starts[i], s.dur), open = ckOpen();
  if (open && askFor !== i) { buildAsk(i); askFor = i; }
  if (!open) askFor = -1;
  ask.style.display = open ? "block" : "none";
  cap.style.display = open ? "none" : "block";
  const key = i + ":" + t.toFixed(3) + ":" + open + ":" + tapWrong;
  if (key === lastKey) return;
  lastKey = key; out = []; cur = i;
  s.draw(t);
  if (s.ck && s.ck.kind === "tap" && t >= s.ck.at - 1e-6) {
    const z = s.ck.zones, a = ans[i];
    const ring = (k, c, dash = "") => add(`<rect x="${z[k][0] + 4}" y="${z[k][1] + 4}" width="${z[k][2] - 8}" height="${z[k][3] - 8}" rx="8" fill="none" stroke="${COL[c]}" stroke-width="5" stroke-dasharray="${dash}"/>`);
    if (open) { z.forEach((_, k) => ring(k, "m", "8 8")); if (tapWrong !== null) ring(tapWrong, "r"); }
    else if (a) { ring(s.ck.answer, "c"); if (!a.ok && a.val !== null && a.val !== s.ck.answer) ring(a.val, "r"); }
  }
  svg.innerHTML = out.join("");
  const c = s.cap.filter(([a]) => a <= t + 1e-6).pop();
  if (cap.innerHTML !== c[1]) cap.innerHTML = c[1];
  const tm = s.terms.map(k => `<b>${k}</b>: ${GLOSS[k]}`).join(" · ");
  if (terms.innerHTML !== tm) terms.innerHTML = tm;
  fills.forEach((f, k) => f.style.width = (k < i ? 100 : k > i ? 0 : 100 * (T - starts[i]) / s.dur) + "%");
  $("where").textContent = s.title;
  $("prev").disabled = i === 0;
  const last = i === SCENES.length - 1;
  $("next").disabled = last ? !(HEADLESS && open) : (!HEADLESS && open);
  $("play").disabled = open;
}
function loop(ts) {
  if (playing && lastTs !== null) {
    const i = sceneAt(T), s = SCENES[i];
    const stop = s.ck && !ans[i] && T < ckTime(i) ? ckTime(i) : sceneEnd(i);
    T += (ts - lastTs) / 1000 * speed;
    if (T >= stop) { T = stop; setPlaying(false); }
  }
  lastTs = ts;
  render();
  requestAnimationFrame(loop);
}
function setPlaying(v) { playing = v; $("play").textContent = v ? "⏸" : "▶"; }
// headless (fit-check): stop on each checkpoint with the box open, then on the revealed last frame
function go(i) {
  i = clamp(i, 0, SCENES.length - 1);
  ans[i] = undefined; askFor = -1;
  if (HEADLESS) T = SCENES[i].ck ? ckTime(i) : sceneEnd(i);
  else { T = starts[i]; setPlaying(true); }
  render();
}
$("play").onclick = () => {
  const i = sceneAt(T);
  if (ckOpen()) return;
  if (playing) return setPlaying(false);
  if (T >= sceneEnd(i)) return go(i === SCENES.length - 1 ? 0 : i + 1);
  setPlaying(true);
};
$("replay").onclick = () => go(sceneAt(T));
$("restart").onclick = () => go(0);
$("prev").onclick = () => go(sceneAt(T) - 1);
$("next").onclick = () => {
  const i = sceneAt(T);
  if (ckOpen()) {
    if (!HEADLESS) return;
    ans[i] = { val: SCENES[i].ck.answer, ok: true };
    T = sceneEnd(i);
    return render();
  }
  go(i + 1);
};
document.querySelectorAll(".spd").forEach(b => b.onclick = () => {
  speed = +b.dataset.s;
  document.querySelectorAll(".spd").forEach(x => x.classList.toggle("on", x === b));
});
function scrub(e) {
  const r = tl.getBoundingClientRect();
  T = clamp((e.clientX - r.left) / r.width) * total * 0.9999;
  const i = sceneAt(T);
  if (SCENES[i].ck && !ans[i] && T > ckTime(i)) T = ckTime(i);
  setPlaying(false);
  render();
}
tl.addEventListener("pointerdown", e => { scrub(e); tl.setPointerCapture(e.pointerId); tl.onpointermove = scrub; });
tl.addEventListener("pointerup", () => tl.onpointermove = null);
svg.addEventListener("pointerdown", e => {
  const i = sceneAt(T), ck = SCENES[i].ck;
  if (!ckOpen() || ck.kind !== "tap") return;
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  const k = ck.zones.findIndex(([x, y, w, h]) => p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h);
  if (k >= 0) submit(k, null);
});
const KEYS = { " ": "#play", l: "#next", ArrowRight: "#next", h: "#prev", ArrowLeft: "#prev", H: "#restart", r: "#replay",
  1: ".spd[data-s='0.5']", 2: ".spd[data-s='1']", 3: ".spd[data-s='2']" };
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.ctrlKey || e.altKey || e.metaKey || !KEYS[e.key]) return;
  e.preventDefault();
  document.querySelector(KEYS[e.key]).click();
});
if (HEADLESS) go(0);
requestAnimationFrame(loop);
</script>
</body>
