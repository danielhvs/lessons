<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>apt vs apt-get, practice</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1d1f; --muted: #6b6b70; --line: #d8d6d0; --panel: #f0eee8;
    --a: #e8590c; --b: #1c7ed6; --c: #2b8a3e; --d: #9c36b5; --r: #d6336c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141417; --fg: #ececf0; --muted: #9a9aa3; --line: #34343b; --panel: #1f1f24;
      --a: #ff922b; --b: #4dabf7; --c: #51cf66; --d: #da77f2; --r: #f06595;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: 6px; gap: 6px; }
  #top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  #links { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-self: start; }
  #top a { color: var(--b); font-size: 16px; }
  #where { text-align: center; font-size: 22px; font-weight: 700; }
  #stage { flex: 1; min-height: 0; width: 100%; display: block; touch-action: manipulation; }
  #stage text { white-space: pre; fill: var(--fg); }
  #talk { min-height: 104px; }
  #caption, #ask { font-size: 20px; line-height: 1.35; padding: 6px 10px; border-radius: 4px;
    background: var(--panel); min-height: 104px; }
  #caption { border-left: 4px solid var(--d); }
  #caption b { color: var(--d); }
  #ask { border-left: 4px solid var(--a); display: none; }
  #ask .q b { color: var(--a); }
  #ask .ctl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  #ask button, #ask input { font: inherit; font-size: 20px; padding: 4px 12px; border-radius: 6px;
    border: 2px solid var(--line); background: var(--bg); color: var(--fg); }
  #ask button { cursor: pointer; }
  #ask input { width: 90px; text-align: center; }
  #ask .ok { border-color: var(--c); color: var(--c); }
  #ask .bad { border-color: var(--r); color: var(--r); }
  #ask .show { color: var(--muted); }
  #hint { color: var(--r); font-size: 18px; margin-top: 4px; }
  #terms { font-size: 16px; line-height: 1.4; min-height: 4.2em; padding: 2px 10px; color: var(--muted); }
  #terms b { color: var(--fg); }
  #bar { display: flex; align-items: center; gap: 6px; font-size: 16px; flex-wrap: wrap; }
  #bar button { font: inherit; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #bar button:not(.spd) { width: 60px; padding: 4px 0; text-align: center; letter-spacing: -3px; }
  #bar button[data-k]::after { content: attr(data-k); margin-left: 6px; font-size: 13px; letter-spacing: 0; opacity: .7; }
  #bar button:disabled { opacity: .4; cursor: default; }
  #bar button.on { border-color: var(--d); color: var(--d); }
  #timeline { flex: 1; min-width: 160px; height: 22px; display: flex; gap: 3px; cursor: pointer; }
  #timeline .seg { position: relative; background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; overflow: hidden; }
  #timeline .fill { position: absolute; inset: 0; width: 0; background: var(--d); opacity: .55; }
  #m { position: absolute; width: 0; height: 0; visibility: hidden; }
  #m text { white-space: pre; }
</style>
</head>
<body>
<div id="top"><nav id="links"><a href="../">← all lessons</a><a href="index.html">lesson</a><a href="animate.html">animation</a></nav><div id="where"></div><span></span></div>
<svg id="stage" viewBox="0 0 1000 860" preserveAspectRatio="xMidYMid meet"></svg>
<div id="talk">
  <div id="caption"></div>
  <div id="ask"><div class="q"></div><div class="ctl"></div><div id="hint"></div></div>
</div>
<div id="terms"></div>
<div id="bar">
  <button id="restart" data-k="H" title="restart (H)">⏮</button>
  <button id="prev" data-k="h" title="previous scene (h, ←)">◀◀</button>
  <button id="play" data-k="SPC" title="play / pause (space)">▶</button>
  <button id="next" data-k="l" title="next scene (l, →)">▶▶</button>
  <button id="replay" data-k="r" title="replay this scene (r)">↻</button>
  <button class="spd" data-s="0.5" data-k="1" title="0.5x (1)">0.5x</button>
  <button class="spd on" data-s="1" data-k="2" title="1x (2)">1x</button>
  <button class="spd" data-s="2" data-k="3" title="2x (3)">2x</button>
  <div id="timeline"></div>
</div>
<svg id="m"><text id="mt"></text></svg>
<script>
const COL = { a: "var(--a)", b: "var(--b)", c: "var(--c)", d: "var(--d)", r: "var(--r)",
  m: "var(--muted)", l: "var(--line)", f: "var(--fg)", p: "var(--panel)" };
const MONO = "ui-monospace, Menlo, monospace";
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => (t = clamp(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const P = (t, a, b) => ease((t - a) / (b - a));
const L = (a, b, p) => a + (b - a) * p;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

let out = [];
const add = s => out.push(s);
const span = ([s, c, w]) => `<tspan${c ? ` fill="${COL[c]}"` : ""}${w ? ' font-weight="700"' : ""}>${esc(s)}</tspan>`;
const mt = document.getElementById("mt"), wcache = {};
function width(tokens, size, mono = false) {
  const k = size + "|" + mono + "|" + JSON.stringify(tokens);
  if (!(k in wcache)) {
    mt.setAttribute("font-size", size);
    mt.setAttribute("font-family", mono ? MONO : "system-ui, sans-serif");
    mt.innerHTML = tokens.map(span).join("");
    wcache[k] = mt.getComputedTextLength();
  }
  return wcache[k];
}
function text(x, y, tokens, size, o = {}) {
  if (typeof tokens === "string") tokens = [[tokens, o.c, o.w]];
  const op = o.op ?? 1;
  if (op <= 0.001) return;
  add(`<text x="${x}" y="${y}" font-size="${size}" text-anchor="${o.anchor || "start"}" opacity="${op}"${o.mono ? ` font-family="${MONO}"` : ""}>${tokens.map(span).join("")}</text>`);
}
const mono = (x, y, s, size, c = "f", op = 1, anchor = "start", w = 0) => text(x, y, [[s, c, w]], size, { op, anchor, mono: 1 });
const line = (x1, y1, x2, y2, color, w = 3, op = 1, dash = "") => op > 0 && add(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${COL[color]}" stroke-width="${w}" stroke-dasharray="${dash}" stroke-linecap="round" opacity="${op}"/>`);
function box(x, y, w, h, color, op = 1, fillOp = .15) {
  if (op <= 0) return;
  add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="${COL[color]}" fill-opacity="${fillOp}" stroke="${COL[color]}" stroke-width="3" opacity="${op}"/>`);
}
function arrow(x1, y1, x2, y2, color, p = 1, w = 4) {
  if (p <= 0) return;
  const x = L(x1, x2, p), y = L(y1, y2, p), a = Math.atan2(y - y1, x - x1), s = 16;
  line(x1, y1, x, y, color, w);
  add(`<polygon points="${x},${y} ${x - s * Math.cos(a - .45)},${y - s * Math.sin(a - .45)} ${x - s * Math.cos(a + .45)},${y - s * Math.sin(a + .45)}" fill="${COL[color]}"/>`);
}
// a terminal: each line is [appear at, text, color]; long lines wrap like a narrow terminal does
const LH = 1.3;
function term(x, y, w, lines, t, size = 36) {
  const per = Math.floor((w - 36) / (size * 0.61)), rows = [];
  lines.forEach(([a, s, c]) => { for (let k = 0; k < Math.max(1, s.length); k += per) rows.push([a, s.slice(k, k + per), c]); });
  const h = 24 + rows.length * size * LH;
  add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${COL.p}" stroke="${COL.l}" stroke-width="2"/>`);
  rows.forEach(([a, s, c], k) => mono(x + 18, y + 12 + size + k * size * LH, s, size, c || "f", P(t, a, a + .4)));
  return y + h;
}

// ---------- checkpoint answers drawn in the stage
const H = 860;
let cur = 0;
const ans = [];
// the user's answer flies from the "your turn" box to (x, y) at ck.show; a wrong one stays above, struck out
function answerAt(x, y, size, t, c = "c") {
  const ck = SCENES[cur].ck, a = ans[cur], show = ck.show ?? ck.at;
  if (!a || t < show) return text(x, y, [["?", "m", 1]], size, { anchor: "middle" });
  const right = "" + ck.answer, mine = a.val == null ? null : "" + a.val, p = P(t, show, show + .9);
  if (mine !== null && p < 1) {
    return text(L(500, x, p), L(H - 10, y, p) - Math.sin(p * Math.PI) * 80, [[mine, a.ok ? c : "r", 1]], size, { anchor: "middle" });
  }
  text(x, y, [[right, c, 1]], size, { anchor: "middle", op: mine === null ? P(t, show, show + .6) : 1 });
  if (!a.ok && mine !== null) {
    const s = Math.max(34, size * .6), w = width([["you: " + mine]], s), yy = y - size * 1.05;
    text(x, yy, [["you: " + mine, "r"]], s, { anchor: "middle" });
    line(x - w / 2, yy - s * .32, x + w / 2, yy - s * .32, "r", 3);
  }
}

const GLOSS = {
  "libapt-pkg": "the shared library that does the real work: reads the package index, solves dependencies, downloads, runs dpkg",
  "Binary::apt scope": "config keys under binary::apt:: apply only when the program is named apt; apt-get and apt-cache ignore them",
  "apt-config dump": "prints every apt setting in effect, defaults included",
  "escape codes": "hidden bytes like ^[[32m that tell a terminal to change color; a program reading the text gets them as junk",
  "script / cat -v": "script runs a command inside a fake terminal; cat -v prints invisible bytes as visible text (^[ is the ESC byte, ^M a carriage return)",
  "pipe": "| sends one program's output into another program, like cat or grep",
  "stderr": "the error stream: shown on screen but not passed down a pipe",
  "stable CLI": "an output format that does not change between versions, so scripts that parse it keep working",
  "-s": "simulate: print what would happen without doing it, no root needed",
  "upgrade": "install newer versions of the packages you have",
  "held back": "an upgrade skipped because it needs a package that is not installed yet (apt-get prints \"kept back\")",
  "-o": "set one config option for this run only, e.g. -o APT::Get::Upgrade-Allow-New=0",
  "--with-new-pkgs": "apt-get upgrade option that allows new packages, like apt upgrade does",
  "checksums": "MD5 / SHA hashes of the .deb file, used to check the download is not corrupted",
  "kB": "kilobyte, 1000 bytes",
  ".deb": "a package file; downloads land in /var/cache/apt/archives",
  "dpkg lock": "only one program can install packages at a time; unattended-upgrades often holds the lock right after boot",
  "Dockerfile": "the recipe docker runs to build an image; each RUN line is a shell command run with no person at the keyboard",
  "CI": "continuous integration: servers that build and test code automatically on every push",
};

const SCENES = [
{ title: "One engine, two front panels", dur: 10, terms: ["libapt-pkg", "Binary::apt scope", "apt-config dump"],
  cap: [[0, "apt, apt-get and apt-cache are three small programs over one shared library, <b>libapt-pkg</b>."],
        [5, "apt only flips defaults: keys in the <b>Binary::apt scope</b> apply when the program is named apt."]],
  draw(t) {
    [[170, "apt", "b"], [500, "apt-get", "a"], [830, "apt-cache", "a"]].forEach(([x, n, c], k) => {
      const op = P(t, k * .5, .6 + k * .5);
      box(x - 145, 30, 290, 100, c, op, .18);
      mono(x, 95, n, 40, c, op, "middle", 1);
      arrow(x, 135, L(x, 500, .45), 222, "m", P(t, 2 + k * .3, 2.8 + k * .3), 3);
    });
    box(200, 228, 600, 100, "m", P(t, 1.8, 2.6), .12);
    mono(500, 292, "libapt-pkg", 40, "f", P(t, 1.8, 2.6), "middle", 1);
    if (t >= 5) term(20, 370, 960, [[5, "$ apt-config dump | grep -i binary::apt"],
      [5.6, 'binary::apt::APT::Color "1";', "b"], [6, 'binary::apt::DPkg::Progress-Fancy "1";', "b"],
      [6.4, 'binary::apt::DPkg::Lock::Timeout "120";', "b"], [7, "... (30 lines in all)", "m"]], t);
  } },

{ title: "On a terminal: color and progress", dur: 11, terms: ["escape codes", "script / cat -v"],
  cap: [[0, "Typed at a terminal, apt shows a progress counter and colors the package name green."],
        [2.5, "<b>script</b> fakes a terminal and <b>cat -v</b> prints the hidden bytes as text."],
        [6.5, "^[[32m switches to green, ^[[0m resets: <b>escape codes</b>. A script reading this text gets those bytes too."]],
  ck: { at: 4.5, show: 5, kind: "tap", answer: 0, zones: [],
        q: "Tap the hidden bytes that turn <b>cowsay</b> green.",
        hint: "The color switch comes before the name; the reset comes after it." },
  draw(t) {
    term(20, 20, 960, [[0, "$ apt list cowsay"], [.6, "Listing... Done"], [1, "cowsay/noble,noble 3.03+dfsg2-8 all"]], t);
    if (t >= 1.4) mono(38, 32 + 36 + 2 * 36 * LH, "cowsay", 36, "c", P(t, 1.4, 2));
    term(20, 220, 960, [[2.5, "$ script -qc 'apt list cowsay' /dev/null | cat -v"],
      [3, "^MListing... 0%^M^MListing... 0%^M^MListing... 0%^M^MListing... Done^M^M", "m"],
      [3.5, "^[[32mcowsay^[[0m/noble,noble 3.03+dfsg2-8 all^M"]], t);
    const op = P(t, 3.8, 4.4);
    if (op <= 0) return;
    text(500, 620, [["zoom on the last line", "m"]], 34, { anchor: "middle", op });
    const toks = ["^[[32m", "cowsay", "^[[0m", "/noble,noble"], size = 46;
    const ws = toks.map(s => width([[s]], size, true));
    let x = 500 - ws.reduce((a, b) => a + b, 0) / 2;
    const ck = this.ck, rev = ans[cur] ? P(t, ck.show, ck.show + 1) : 0, zones = [];
    toks.forEach((s, k) => {
      const c = k === 1 && rev > 0 ? "c" : (k === 0 || k === 2) && rev > 0 ? "d" : "f";
      mono(x, 720, s, size, c, op, "start", k === 1 && rev > 0);
      zones.push([x - 6, 670, ws[k] + 12, 70]);
      x += ws[k];
    });
    ck.zones = zones.slice(0, 3);
    text(zones[0][0] + zones[0][2] / 2, 790, [["green on", "d"]], 34, { anchor: "middle", op: P(t, 6.5, 7.2) });
    text(zones[2][0] + zones[2][2] / 2, 790, [["reset", "d"]], 34, { anchor: "middle", op: P(t, 6.5, 7.2) });
  } },

{ title: "Piped into a script", dur: 10, terms: ["pipe", "stderr", "stable CLI"],
  cap: [[0, "Same search, two programs, both piped into cat."],
        [1.5, "apt warns on <b>stderr</b> when its output is not a terminal. apt-cache stays silent: its output format is kept stable for scripts."]],
  ck: { at: 1, show: 1.5, kind: "opt", answer: "apt search", opts: ["apt search", "apt-cache search", "both", "neither"],
        q: "Both commands look up cowsay and pipe into cat. Which one prints a WARNING?",
        hint: "One of them is built for people at a terminal and wants them to know its output can change." },
  draw(t) {
    const s = this.ck.show;
    term(20, 20, 960, [[0, "$ apt search ^cowsay$ | cat"],
      [s + .8, "WARNING: apt does not have a stable CLI interface. Use with caution in scripts.", "r"],
      [s + 1.4, "Sorting..."], [s + 1.6, "Full Text Search..."], [s + 1.8, "cowsay/noble,noble 3.03+dfsg2-8 all"], [s + 1.9, "  configurable talking cow"]], t);
    term(20, 430, 960, [[.3, "$ apt-cache search ^cowsay$ | cat"], [s + 2.4, "cowsay - configurable talking cow"]], t);
    text(480, 700, [["warns:", "m"]], 48, { anchor: "end" });
    answerAt(640, 700, 48, t, "r");
  } },

{ title: "upgrade: the difference that matters", dur: 13, terms: ["-s", "upgrade", "held back"],
  cap: [[0, "Same machine, same package index. <b>-s</b> simulates: no root needed, nothing changes."],
        [1.5, "apt-get upgrade never installs a new package, so it holds back the 6 upgrades that need one: kernel packages like linux-generic."],
        [5.5, "apt upgrade installs the 11 new packages they need and upgrades all 94. Neither one removes anything."]],
  ck: { at: 4, show: 5.5, kind: "num", answer: 94,
        q: "apt-get upgrade: 88 upgraded, 6 <b>held back</b> because each needs a new package. apt upgrade may install new packages. How many does apt upgrade upgrade?",
        hint: "Nothing blocks the 6 held-back ones any more: add them to the 88." },
  draw(t) {
    const sc = 8, X = 60, show = this.ck.show;
    const rows = [["apt-get -s upgrade", "a", 88, 0, 6, 0], ["apt -s upgrade", "b", 94, 11, 0, show]];
    rows.forEach(([cmd, c, up, nw, held, a], r) => {
      const y = 90 + r * 360, op = r === 0 ? P(t, 0, .6) : P(t, 3, 3.6), p = r === 0 ? P(t, .6, 2.4) : P(t, a, a + 2);
      mono(X, y, "$ " + cmd, 40, c, op, "start", 1);
      if (op <= 0) return;
      let x = X;
      [[up, "c", "upgraded"], [nw, "d", "new"], [held, "r", "held back"]].forEach(([v, col, lab], j) => {
        const w = v * sc * p;
        if (v > 0 && w > 0) add(`<rect x="${x}" y="${y + 30}" width="${w}" height="90" fill="${COL[col]}" fill-opacity=".55"/>`);
        const lx = x + v * sc / 2, ly = y + 170 + (j === 2 ? 50 : 0);
        if (r === 1 && j === 0) { answerAt(lx, ly, 44, t, "c"); text(lx, ly + 44, [[lab, col]], 36, { anchor: "middle" }); }
        else if (v > 0) text(lx, ly, [[v + " " + lab, col, 1]], 36, { anchor: "middle", op: r === 0 ? P(t, 1.5, 2.2) : P(t, a + 1.5, a + 2.2) });
        x += v * sc;
      });
    });
    if (t < show) add(`<rect x="${X}" y="${450 + 30}" width="${752}" height="90" fill="none" stroke="${COL.m}" stroke-width="3" stroke-dasharray="10 8" opacity="${P(t, 3, 3.6)}"/>`);
  } },

{ title: "Prove it: flip one switch", dur: 11, terms: ["-o", "--with-new-pkgs"],
  cap: [[0, "The difference is one key, <b>APT::Get::Upgrade-Allow-New</b>. apt sets it to 1; <b>-o</b> sets it for one run."],
        [3, "Off for apt: apt-get's numbers. <b>--with-new-pkgs</b> turns it on for apt-get: apt's numbers."]],
  ck: { at: 2, show: 3, kind: "opt", answer: "apt-get's numbers", opts: ["apt-get's numbers", "apt's numbers"],
        q: "Run apt with Upgrade-Allow-New=0. Which numbers come out: apt-get's (88 upgraded, 6 held back) or apt's (94 upgraded, 0 held back)?",
        hint: "That key is the only upgrade setting apt changes. Turn it off and nothing is left that differs." },
  draw(t) {
    const s = this.ck.show;
    term(20, 20, 960, [[0, "$ apt -s -o APT::Get::Upgrade-Allow-New=0 upgrade | grep upgraded,"],
      [s + .8, "88 upgraded, 0 newly installed, 0 to remove and 6 not upgraded.", "a"],
      [s + 3, "$ apt-get -s --with-new-pkgs upgrade | grep upgraded,"],
      [s + 3.8, "94 upgraded, 11 newly installed, 0 to remove and 0 not upgraded.", "b"]], t);
    text(500, 600, [["apt with the switch off gives", "m"]], 38, { anchor: "middle" });
    answerAt(500, 690, 50, t, "a");
  } },

{ title: "show: for people vs for scripts", dur: 11, terms: ["checksums", "kB"],
  cap: [[0, "Same package, two views. apt-cache show prints every field of the index: 27 lines."],
        [2, "apt show drops the <b>checksums</b> and the file path: 21 lines."],
        [5.5, "It adds what a person checks before installing: Download-Size, 18572 bytes shown as 18.6 kB, and APT-Sources, where it comes from."]],
  ck: { at: 4, show: 5.5, kind: "num", answer: "18.6", accept: ["18,6"], mode: "decimal",
        q: "apt-cache show says <b>Size: 18572</b> (bytes). apt show prints it in kB, 1 kB = 1000 bytes, one decimal. What Download-Size does it print?",
        hint: "18572 ÷ 1000, rounded to one decimal place." },
  draw(t) {
    box(20, 20, 470, 760, "b", P(t, 2, 2.6), .07);
    mono(255, 80, "apt show", 40, "b", P(t, 2, 2.6), "middle", 1);
    text(255, 125, [["21 lines", "m"]], 34, { anchor: "middle", op: P(t, 2, 2.6) });
    box(510, 20, 470, 760, "a", P(t, 0, .6), .07);
    mono(745, 80, "apt-cache show", 40, "a", P(t, 0, .6), "middle", 1);
    text(745, 125, [["27 lines", "m"]], 34, { anchor: "middle", op: P(t, 0, .6) });
    const right = [["Package: cowsay", "f"], ["Architecture: all", "a"], ["Filename: pool/...", "a"], ["Size: 18572", "a"],
      ["MD5sum", "a"], ["SHA1", "a"], ["SHA256", "a"], ["SHA512", "a"], ["Description-en", "a"], ["Description-md5", "a"]];
    right.forEach(([s, c], k) => mono(535, 195 + k * 56, s, 36, c, P(t, .4 + k * .1, .9 + k * .1), "start", s.startsWith("Size")));
    const o = P(t, 2.4, 3);
    mono(45, 195, "Package: cowsay", 36, "f", o);
    mono(45, 251, "Download-Size:", 36, "b", o, "start", 1);
    if (o > 0) { answerAt(140, 315, 40, t, "b"); mono(210, 315, "kB", 36, "b", o, "start", 1); }
    mono(45, 371, "APT-Sources: ...", 36, "b", P(t, 6, 6.6), "start", 1);
    mono(45, 427, "Description", 36, "f", o);
  } },

{ title: "Two quiet ones: cache and lock", dur: 10, terms: [".deb", "dpkg lock"],
  cap: [[0, "Two more keys exist only in the Binary::apt scope."],
        [1.5, "After a successful install apt deletes the downloaded <b>.deb</b> files; apt-get leaves them in /var/cache/apt/archives."],
        [4, "When another install holds the <b>dpkg lock</b>, apt waits up to 120 s. apt-get has no wait set, so it stops with an error at once."]],
  ck: { at: 3, show: 4, kind: "opt", answer: "fails at once", opts: ["waits up to 120 s", "fails at once"],
        q: "Another install holds the dpkg lock. The 120 s wait is a Binary::apt key. What does <b>apt-get install</b> do?",
        hint: "apt-get ignores every key under binary::apt::." },
  draw(t) {
    term(20, 20, 960, [[0, 'binary::apt::APT::Keep-Downloaded-Packages "0";', "b"], [.4, 'binary::apt::DPkg::Lock::Timeout "120";', "b"]], t);
    mono(270, 300, "apt", 44, "b", P(t, 1, 1.6), "middle", 1);
    mono(730, 300, "apt-get", 44, "a", P(t, 1, 1.6), "middle", 1);
    text(500, 380, [["after a successful install", "m"]], 34, { anchor: "middle", op: P(t, 1.5, 2) });
    text(270, 440, [["deletes the .debs", "f", 1]], 38, { anchor: "middle", op: P(t, 1.8, 2.4) });
    text(730, 440, [["keeps the .debs", "f", 1]], 38, { anchor: "middle", op: P(t, 2.1, 2.7) });
    text(500, 560, [["another install holds the dpkg lock", "m"]], 34, { anchor: "middle", op: P(t, 2.5, 3) });
    text(270, 640, [["waits up to 120 s", "f", 1]], 38, { anchor: "middle", op: P(t, 2.6, 3) });
    if (t >= 2.6) answerAt(730, 640, 38, t, "r");
  } },

{ title: "New example: a Dockerfile", dur: 10, terms: ["Dockerfile", "CI", "stable CLI"],
  cap: [[0, "At the prompt, type apt. In scripts, Dockerfiles and <b>CI</b>, write apt-get and apt-cache."],
        [3, "No person watches a docker build: a progress bar is noise, and the output must not change between versions."]],
  ck: { at: 2, show: 3, kind: "opt", answer: "apt-get", opts: ["apt", "apt-get"],
        q: "A <b>Dockerfile</b> installs curl. Nobody watches the build, and it must keep working on the next Ubuntu. Which program goes in the RUN line?",
        hint: "Which one has an output format kept stable for scripts?" },
  draw(t) {
    const o = i => P(t, i * .2, i * .2 + .5);
    mono(20, 60, "# at the prompt", 36, "b", o(0), "start", 1);
    ["apt update", "apt install cowsay", "apt upgrade", "apt show cowsay"].forEach((s, k) => mono(20, 115 + k * 50, s, 36, "f", o(1 + k)));
    mono(505, 60, "# in scripts", 36, "a", o(2), "start", 1);
    ["apt-get update", "apt-get install cowsay", "apt-get upgrade \\", "  --with-new-pkgs", "apt-cache show cowsay"].forEach((s, k) => mono(505, 115 + k * 50, s, 36, "f", o(3 + k)));
    box(20, 420, 960, 300, "d", P(t, 1.5, 2), .08);
    mono(45, 480, "# Dockerfile", 36, "d", P(t, 1.5, 2), "start", 1);
    mono(45, 545, "FROM ubuntu:24.04", 36, "f", P(t, 1.5, 2));
    mono(45, 615, "RUN", 36, "f", P(t, 1.5, 2));
    if (t >= 1.5) answerAt(205, 615, 40, t, "d");
    mono(290, 615, "update \\", 36, "f", P(t, 1.5, 2));
    const r = ans[cur] ? P(t, this.ck.show + .9, this.ck.show + 1.5) : 0;
    mono(45, 685, "&& apt-get install -y curl", 36, "f", r);

];

// ---------- player
const HEADLESS = /HeadlessChrome/.test(navigator.userAgent);
const $ = id => document.getElementById(id);
const starts = []; let total = 0;
SCENES.forEach(s => { starts.push(total); total += s.dur; });
const svg = $("stage"), cap = $("caption"), ask = $("ask"), terms = $("terms");
let T = 0, playing = false, speed = 1, lastTs = null, lastKey = "", tries = 0, tapWrong = null, lastWrong = null;
const sceneAt = T => { let i = 0; while (i + 1 < SCENES.length && T >= starts[i + 1]) i++; return i; };
const sceneEnd = i => starts[i] + SCENES[i].dur - 1e-3;
const ckTime = i => starts[i] + SCENES[i].ck.at;
const ckOpen = () => { const i = sceneAt(T), ck = SCENES[i].ck; return !!ck && !ans[i] && T >= ckTime(i) - 1e-6; };

const tl = $("timeline");
SCENES.forEach((s, i) => {
  const seg = document.createElement("div");
  seg.className = "seg"; seg.style.flex = s.dur; seg.title = `${i + 1}. ${s.title}`;
  seg.innerHTML = '<div class="fill"></div>';
  tl.appendChild(seg);
});
const fills = [...tl.querySelectorAll(".fill")];

function buildAsk(i) {
  const ck = SCENES[i].ck;
  tries = 0; tapWrong = null; lastWrong = null;
  ask.querySelector(".q").innerHTML = `<b>Your turn:</b> ${ck.q}`;
  $("hint").textContent = "";
  const ctl = ask.querySelector(".ctl");
  ctl.innerHTML = "";
  if (ck.kind === "num") {
    ctl.innerHTML = `<input id="in" type="text" inputmode="${ck.mode || "numeric"}" autocomplete="off"><button id="check">Check</button>`;
    const inp = $("in");
    inp.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") submit(inp.value.trim(), inp); });
    $("check").onclick = () => submit(inp.value.trim(), inp);
  } else if (ck.kind === "opt") {
    ck.opts.forEach(o => {
      const b = document.createElement("button");
      b.textContent = o; b.onclick = () => submit(o, b);
      ctl.appendChild(b);
    });
  } else {
    ctl.insertAdjacentHTML("beforeend", '<span>Tap the drawing.</span>');
  }
  const show = document.createElement("button");
  show.className = "show"; show.textContent = "Show answer";
  show.onclick = () => resolve(lastWrong, false);
  ctl.appendChild(show);
}
function submit(val, el) {
  if (val === "") return;
  const i = sceneAt(T), ck = SCENES[i].ck;
  if ([ck.answer, ...(ck.accept || [])].map(String).includes(String(val))) {
    if (el) el.classList.add("ok");
    return setTimeout(() => resolve(val, true), 450);
  }
  tries++; lastWrong = val;
  if (el) el.classList.add("bad");
  if (ck.kind === "tap") { tapWrong = val; lastKey = ""; }
  if (tries >= 2) return setTimeout(() => resolve(val, false), 450);
  $("hint").textContent = "Not quite. Hint: " + ck.hint;
}
function resolve(val, ok) {
  const i = sceneAt(T);
  if (ans[i]) return;
  ans[i] = { val, ok };
  lastKey = "";
  setPlaying(true);
}

let askFor = -1;
function render() {
  const i = sceneAt(T), s = SCENES[i], t = Math.min(T - starts[i], s.dur), open = ckOpen();
  if (open && askFor !== i) { buildAsk(i); askFor = i; }
  if (!open) askFor = -1;
  ask.style.display = open ? "block" : "none";
  cap.style.display = open ? "none" : "block";
  const key = i + ":" + t.toFixed(3) + ":" + open + ":" + tapWrong;
  if (key === lastKey) return;
  lastKey = key; out = []; cur = i;
  s.draw(t);
  if (s.ck && s.ck.kind === "tap" && t >= s.ck.at - 1e-6) {
    const z = s.ck.zones, a = ans[i];
    const ring = (k, c, dash = "") => add(`<rect x="${z[k][0] + 2}" y="${z[k][1] + 2}" width="${z[k][2] - 4}" height="${z[k][3] - 4}" rx="8" fill="none" stroke="${COL[c]}" stroke-width="4" stroke-dasharray="${dash}"/>`);
    if (open) { z.forEach((_, k) => ring(k, "m", "8 8")); if (tapWrong !== null) ring(tapWrong, "r"); }
    else if (a) { ring(s.ck.answer, "c"); if (!a.ok && a.val !== null && a.val !== s.ck.answer) ring(a.val, "r"); }
  }
  svg.innerHTML = out.join("");
  const c = s.cap.filter(([a]) => a <= t + 1e-6).pop();
  if (cap.innerHTML !== c[1]) cap.innerHTML = c[1];
  const tm = s.terms.map(k => `<b>${k}</b>: ${GLOSS[k]}`).join(" · ");
  if (terms.innerHTML !== tm) terms.innerHTML = tm;
  fills.forEach((f, k) => f.style.width = (k < i ? 100 : k > i ? 0 : 100 * (T - starts[i]) / s.dur) + "%");
  $("where").textContent = s.title;
  $("prev").disabled = i === 0;
  const last = i === SCENES.length - 1;
  $("next").disabled = last ? !(HEADLESS && open) : (!HEADLESS && open);
  $("play").disabled = open;
}
function loop(ts) {
  if (playing && lastTs !== null) {
    const i = sceneAt(T), s = SCENES[i];
    const stop = s.ck && !ans[i] && T < ckTime(i) ? ckTime(i) : sceneEnd(i);
    T += (ts - lastTs) / 1000 * speed;
    if (T >= stop) { T = stop; setPlaying(false); }
  }
  lastTs = ts;
  render();
  requestAnimationFrame(loop);
}
function setPlaying(v) { playing = v; $("play").textContent = v ? "⏸" : "▶"; }
// headless (fit-check): stop on each checkpoint with the box open, then on the revealed last frame
function go(i) {
  i = clamp(i, 0, SCENES.length - 1);
  ans[i] = undefined; askFor = -1;
  if (HEADLESS) T = SCENES[i].ck ? ckTime(i) : sceneEnd(i);
  else { T = starts[i]; setPlaying(true); }
  render();
}
$("play").onclick = () => {
  const i = sceneAt(T);
  if (ckOpen()) return;
  if (playing) return setPlaying(false);
  if (T >= sceneEnd(i)) return go(i === SCENES.length - 1 ? 0 : i + 1);
  setPlaying(true);
};
$("replay").onclick = () => go(sceneAt(T));
$("restart").onclick = () => go(0);
$("prev").onclick = () => go(sceneAt(T) - 1);
$("next").onclick = () => {
  const i = sceneAt(T);
  if (ckOpen()) {
    if (!HEADLESS) return;
    ans[i] = { val: SCENES[i].ck.answer, ok: true };
    T = sceneEnd(i);
    return render();
  }
  go(i + 1);
};
document.querySelectorAll(".spd").forEach(b => b.onclick = () => {
  speed = +b.dataset.s;
  document.querySelectorAll(".spd").forEach(x => x.classList.toggle("on", x === b));
});
function scrub(e) {
  const r = tl.getBoundingClientRect();
  T = clamp((e.clientX - r.left) / r.width) * total * 0.9999;
  const i = sceneAt(T);
  if (SCENES[i].ck && !ans[i] && T > ckTime(i)) T = ckTime(i);
  setPlaying(false);
  render();
}
tl.addEventListener("pointerdown", e => { scrub(e); tl.setPointerCapture(e.pointerId); tl.onpointermove = scrub; });
tl.addEventListener("pointerup", () => tl.onpointermove = null);
svg.addEventListener("pointerdown", e => {
  const i = sceneAt(T), ck = SCENES[i].ck;
  if (!ckOpen() || ck.kind !== "tap") return;
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  const k = ck.zones.findIndex(([x, y, w, h]) => p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h);
  if (k >= 0) submit(k, null);
});
const KEYS = { " ": "#play", l: "#next", ArrowRight: "#next", h: "#prev", ArrowLeft: "#prev", H: "#restart", r: "#replay",
  1: ".spd[data-s='0.5']", 2: ".spd[data-s='1']", 3: ".spd[data-s='2']" };
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.ctrlKey || e.altKey || e.metaKey || !KEYS[e.key]) return;
  e.preventDefault();
  document.querySelector(KEYS[e.key]).click();
});
if (HEADLESS) go(0);
requestAnimationFrame(loop);
</script>
</body>
