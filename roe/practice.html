<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROE, interação</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1d1f; --muted: #6b6b70; --line: #d8d6d0; --panel: #f0eee8;
    --a: #e8590c; --b: #1c7ed6; --c: #2b8a3e; --d: #9c36b5; --r: #d6336c; --e: #0c8599;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141417; --fg: #ececf0; --muted: #9a9aa3; --line: #34343b; --panel: #1f1f24;
      --a: #ff922b; --b: #4dabf7; --c: #51cf66; --d: #da77f2; --r: #f06595; --e: #3bc9db;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: 6px; gap: 6px; }
  #top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  #links { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 16px; }
  #links a { color: var(--b); }
  #where { text-align: center; font-size: 22px; font-weight: 700; }
  #stage { flex: 1; min-height: 0; width: 100%; display: block; touch-action: manipulation; }
  #stage text { white-space: pre; fill: var(--fg); }
  #talk { min-height: 104px; }
  #caption, #ask { font-size: 20px; line-height: 1.35; padding: 6px 10px; border-radius: 4px;
    background: var(--panel); min-height: 104px; }
  #caption { border-left: 4px solid var(--d); }
  #caption b { color: var(--d); }
  #ask { border-left: 4px solid var(--a); display: none; }
  #ask .q b { color: var(--a); }
  #ask .ctl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  #ask button, #ask input { font: inherit; font-size: 20px; padding: 4px 12px; border-radius: 6px;
    border: 2px solid var(--line); background: var(--bg); color: var(--fg); }
  #ask button { cursor: pointer; }
  #ask input { width: 100px; text-align: center; }
  #ask .ok { border-color: var(--c); color: var(--c); }
  #ask .bad { border-color: var(--r); color: var(--r); }
  #ask .show { color: var(--muted); }
  #hint { color: var(--r); font-size: 18px; margin-top: 4px; }
  #terms { font-size: 16px; line-height: 1.4; min-height: 4.2em; padding: 2px 10px; color: var(--muted); }
  #terms b { color: var(--fg); }
  #bar { display: flex; align-items: center; gap: 6px; font-size: 16px; flex-wrap: wrap; }
  #bar button { font: inherit; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #bar button:not(.spd) { width: 46px; padding: 4px 0; text-align: center; letter-spacing: -3px; }
  #bar button:disabled { opacity: .4; cursor: default; }
  #bar button.on { border-color: var(--d); color: var(--d); }
  #timeline { flex: 1; min-width: 160px; height: 22px; display: flex; gap: 3px; cursor: pointer; }
  #timeline .seg { position: relative; background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; overflow: hidden; }
  #timeline .fill { position: absolute; inset: 0; width: 0; background: var(--d); opacity: .55; }
  #m { position: absolute; width: 0; height: 0; visibility: hidden; }
  #m text { white-space: pre; }
  /* phone: the stage takes the full width at its own height and the page scrolls */
  @media (max-width: 700px) {
    html, body { height: auto; }
    #top { grid-template-columns: 1fr; }
    #where { text-align: left; }
    #stage { flex: none; height: auto; }
  }
</style>
</head>
<body>
<div id="top"><div id="links"><a href="../">← todas as aulas</a><a href="index.html">lição</a><a href="animate.html">animação</a></div><div id="where"></div><span></span></div>
<svg id="stage" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet"></svg>
<div id="talk">
  <div id="caption"></div>
  <div id="ask"><div class="q"></div><div class="ctl"></div><div id="hint"></div></div>
</div>
<div id="terms"></div>
<div id="bar">
  <button id="restart" title="recomeçar">⏮</button>
  <button id="prev" title="cena anterior (←)">◀◀</button>
  <button id="play" title="tocar / pausar (espaço)">▶</button>
  <button id="next" title="próxima cena (→)">▶▶</button>
  <button id="replay" title="repetir esta cena">↻</button>
  <button class="spd" data-s="0.5">0.5x</button>
  <button class="spd on" data-s="1">1x</button>
  <button class="spd" data-s="2">2x</button>
  <div id="timeline"></div>
</div>
<svg id="m"><text id="mt"></text></svg>
<script>
const COL = { a: "var(--a)", b: "var(--b)", c: "var(--c)", d: "var(--d)", r: "var(--r)", e: "var(--e)",
  m: "var(--muted)", l: "var(--line)", f: "var(--fg)", p: "var(--panel)" };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => (t = clamp(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const P = (t, a, b) => ease((t - a) / (b - a));
const L = (a, b, p) => a + (b - a) * p;

let out = [];
const add = s => out.push(s);
const span = ([s, c, w]) => `<tspan${c ? ` fill="${COL[c]}"` : ""}${w ? ' font-weight="700"' : ""}>${s}</tspan>`;
const mt = document.getElementById("mt"), wcache = {};
function width(tokens, size) {
  const k = size + "|" + JSON.stringify(tokens);
  if (!(k in wcache)) {
    mt.setAttribute("font-size", size);
    mt.innerHTML = tokens.map(span).join("");
    wcache[k] = mt.getComputedTextLength();
  }
  return wcache[k];
}
function text(x, y, tokens, size, o = {}) {
  if (typeof tokens === "string") tokens = [[tokens, o.c]];
  const op = o.op ?? 1;
  if (op <= 0.001) return;
  add(`<text x="${x}" y="${y}" font-size="${size}" text-anchor="${o.anchor || "start"}" opacity="${op}">${tokens.map(span).join("")}</text>`);
}
const line = (x1, y1, x2, y2, color, w = 3, op = 1, dash = "") => op > 0 && add(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${COL[color]}" stroke-width="${w}" stroke-dasharray="${dash}" stroke-linecap="round" opacity="${op}"/>`);
function frac(cx, cy, numT, denT, size, op = 1, lead = "") {
  const w = Math.max(width(numT, size), width(denT, size)) + 20;
  if (op <= 0.001) return;
  if (lead) text(cx - w / 2 - 12, cy + size * 0.35, [[lead]], size, { anchor: "end", op });
  text(cx, cy - size * 0.3, numT, size, { anchor: "middle", op });
  line(cx - w / 2, cy, cx + w / 2, cy, "f", 3, op);
  text(cx, cy + size, denT, size, { anchor: "middle", op });
}
function chip(x, y, label, color, size, op = 1) {
  if (op <= 0.001) return;
  const w = width([[label, color, 1]], size) + 34, h = size * 1.6;
  add(`<rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="12" fill="${COL.p}" stroke="${COL[color]}" stroke-width="3" opacity="${op}"/>`);
  text(x, y + size * 0.35, [[label, color, 1]], size, { anchor: "middle", op });
}
const fly = (x0, y0, x1, y1, p, label, color, size) => {
  if (p <= 0 || p >= 1) return;
  text(L(x0, x1, p), L(y0, y1, p) - Math.sin(p * Math.PI) * 60, [[label, color, 1]], size, { anchor: "middle" });
};
const dot = (x, y, color, r = 11, op = 1) => op > 0 && add(`<circle cx="${x}" cy="${y}" r="${r}" fill="${COL[color]}" opacity="${op}"/>`);
function box(x, y, w, h, color, op = 1, fillOp = .18, rx = 14) {
  if (op <= 0) return;
  add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${COL[color]}" fill-opacity="${fillOp}" stroke="${COL[color]}" stroke-width="3" opacity="${op}"/>`);
}
function arrow(x1, y1, x2, y2, color, p = 1, w = 4) {
  if (p <= 0) return;
  const x = L(x1, x2, p), y = L(y1, y2, p), a = Math.atan2(y - y1, x - x1), s = 16;
  line(x1, y1, x, y, color, w);
  add(`<polygon points="${x},${y} ${x - s * Math.cos(a - .45)},${y - s * Math.sin(a - .45)} ${x - s * Math.cos(a + .45)},${y - s * Math.sin(a + .45)}" fill="${COL[color]}"/>`);
}
// pt-BR numbers: 118.81 -> "118,81", 109 -> "109", -0.08 -> "−8%"
const brn = v => (v < 0 ? "−" : "") + (Math.round(Math.abs(v) * 100) / 100).toString().replace(".", ",");
const pctBR = v => brn(Math.round(v * 1000) / 10) + "%";

// ---------- checkpoint answers drawn in the stage
let cur = 0;
const ans = [];
const shown = (ck, v) => (ck.pre || "") + v + (ck.unit || "");
// the user's answer flies from the "Sua vez" box to (x, y) at ck.show; a wrong one stays above, struck out
function answerAt(x, y, size, t, c = "c") {
  const ck = SCENES[cur].ck, a = ans[cur], show = ck.show ?? ck.at;
  if (!a || t < show) return text(x, y, [["?", "m", 1]], size, { anchor: "middle" });
  const right = shown(ck, ck.kind === "num" ? brn(ck.answer) : ck.answer);
  const mine = a.val == null ? null : shown(ck, a.val), p = P(t, show, show + .9);
  if (mine !== null && p < 1) {
    return text(L(500, x, p), L(740, y, p) - Math.sin(p * Math.PI) * 80, [[mine, a.ok ? c : "r", 1]], size, { anchor: "middle" });
  }
  text(x, y, [[right, c, 1]], size, { anchor: "middle", op: mine === null ? P(t, show, show + .6) : 1 });
  if (!a.ok && mine !== null) {
    const s = Math.max(36, size * .6), w = width([["você: " + mine, "r"]], s), yy = y - size * 1.05;
    text(x, yy, [["você: " + mine, "r"]], s, { anchor: "middle" });
    line(x - w / 2, yy - s * .32, x + w / 2, yy - s * .32, "r", 3);
  }
}

const GLOSS = {
  "ROE": "Return on Equity, retorno sobre o patrimônio: lucro líquido ÷ patrimônio líquido. Quanto lucro sai de cada R$ 1 dos sócios",
  "PL": "patrimônio líquido: ativos menos dívidas. O dinheiro que é dos sócios dentro da empresa; sai do balanço",
  "lucro líquido": "o que sobra no ano depois de custos, despesas, juros e impostos; sai da DRE (demonstração do resultado)",
  "payout": "% do lucro pago aos acionistas como dividendos e JCP; o resto fica na empresa",
  "dividendos": "parte do lucro que a empresa reparte entre os acionistas",
  "JCP": "juros sobre capital próprio: outra forma de repartir o lucro, com imposto retido na fonte",
  "DuPont": "análise que quebra o ROE em margem × giro × alavancagem; nasceu na empresa DuPont no começo do século 20",
  "margem": "lucro ÷ receita: quanto de cada R$ 1 vendido vira lucro",
  "giro": "receita ÷ ativo: quantos reais a empresa vende por R$ 1 de ativo",
  "alavancagem": "ativo ÷ PL: quanto do ativo é bancado com dívida em vez do dinheiro dos sócios",
  "ativo": "tudo que a empresa tem: caixa, imóveis, máquinas, estoque, créditos",
  "ROA": "Return on Assets: lucro líquido ÷ ativo total. Lucro sobre tudo que a empresa tem, venha de sócio ou de dívida",
  "dívida": "dinheiro emprestado que a empresa tem de devolver com juros",
  "P/VP": "preço ÷ valor patrimonial: quanto a bolsa paga por R$ 1 de PL. P/VP 3 = paga R$ 3 por R$ 1",
  "P/L": "preço ÷ lucro por ação: quantos anos de lucro o preço da ação paga",
  "renda fixa": "investimentos com regra de rendimento definida na compra (Tesouro, CDB...)",
};

const SCENES = [
{ title: "A conta", dur: 11, terms: ["ROE", "PL", "lucro líquido"],
  cap: [[0, "Os sócios colocaram <b>R$ 100</b> na empresa. Esse dinheiro dos sócios é o <b>patrimônio líquido</b> (PL)."],
        [3.5, "No ano, a empresa trabalhou com esse dinheiro e sobrou <b>R$ 15</b> de lucro líquido."],
        [6.5, "<b>ROE</b> = lucro ÷ PL = 15 ÷ 100 = <b>15%</b>. Cada R$ 1 dos sócios rendeu R$ 0,15 no ano."]],
  draw(t) {
    const p = P(t, 0, 1.2), base = 600;
    box(60, base - 360 * p, 240, 360 * p, "b", p > 0 ? 1 : 0, .25);
    text(180, 400, [["PL", "b", 1]], 48, { anchor: "middle", op: P(t, .8, 1.4) });
    text(180, 460, [["R$ 100", "b", 1]], 44, { anchor: "middle", op: P(t, .8, 1.4) });
    text(180, 650, [["dinheiro dos sócios", "m"]], 36, { anchor: "middle", op: p });
    const q = P(t, 3.5, 4.5);
    box(360, base - 60 * q, 100, 60 * q, "c", q > 0 ? 1 : 0, .35);
    text(410, 520, [["lucro R$ 15", "c", 1]], 36, { anchor: "middle", op: P(t, 4.2, 4.8) });
    frac(780, 200, [["lucro líquido", "c", 1]], [["PL", "b", 1]], 44, P(t, 6.5, 7.3), "ROE =");
    frac(700, 440, [["15", "c", 1]], [["100", "b", 1]], 56, P(t, 7.6, 7.9), "ROE =");
    fly(410, 505, 700, 420, clamp((t - 7.9) / 1), "15", "c", 44);
    fly(180, 445, 700, 496, clamp((t - 8.4) / 1), "100", "b", 44);
    text(780, 462, [["= 15%", "d", 1]], 64, { op: P(t, 9.4, 10.2) });
  } },

{ title: "O lucro que fica vira patrimônio", dur: 14, terms: ["payout", "dividendos", "JCP"],
  cap: [[0, "A empresa paga <b>40%</b> do lucro aos acionistas (o <b>payout</b>) e guarda o resto."],
        [2.8, "R$ 6 vão para os acionistas e <b>R$ 9</b> ficam na empresa."],
        [4, "Os R$ 9 guardados somam ao PL: R$ 109. No ano seguinte o mesmo ROE de 15% trabalha sobre mais dinheiro."],
        [8.5, "O PL cresce <b>ROE × (1 − payout) = 15% × 0,6 = 9% ao ano</b>. Em 5 anos, R$ 100 viram R$ 153,86."],
        [12, "Isso supõe ROE constante e nenhuma ação nova emitida."]],
  ck: { at: 2.6, show: 2.8, kind: "num", answer: 9, pre: "R$ ",
        q: "O lucro do ano foi R$ 15 e a empresa paga 40% dele aos acionistas. Quantos reais ficam no PL?",
        hint: "40% de R$ 15 é R$ 6. O que sobra dos R$ 15?" },
  draw(t) {
    const pls = [100]; for (let k = 0; k < 5; k++) pls.push(pls[k] * 1.09);
    const base = 690, sc = 2.3, x0 = 60, sw = 150;
    line(x0 - 10, base, x0 + sw * 6, base, "m", 3);
    pls.forEach((v, k) => {
      const g = k === 0 ? 1 : P(t, 4 + (k - 1) * .9, 4.8 + (k - 1) * .9);
      const cx = x0 + sw * (k + .5), h = v * sc * g;
      if (g > 0) {
        add(`<rect x="${cx - 50}" y="${base - h}" width="100" height="${h}" rx="6" fill="${COL.b}" fill-opacity=".6"/>`);
        if (k > 0) add(`<rect x="${cx - 50}" y="${base - h}" width="100" height="${Math.max(0, h - pls[k - 1] * sc)}" rx="6" fill="${COL.c}" fill-opacity=".8"/>`);
        text(cx, base - h - 14, [[brn(v), "b", 1]], 36, { anchor: "middle", op: g });
      }
      text(cx, base + 42, [["ano " + k, "m"]], 36, { anchor: "middle" });
    });
    const s = P(t, .5, 1.5), show = this.ck.show;
    box(300, 20, 400, 70, "c", s, .25); text(500, 67, [["lucro do ano: R$ 15", "c", 1]], 36, { anchor: "middle", op: s });
    arrow(420, 95, 300, 150, "a", P(t, 1.8, 2.6)); arrow(580, 95, 700, 150, "b", P(t, 1.8, 2.6));
    text(300, 195, [[t < show ? "40%" : "40% = R$ 6", "a", 1]], 40, { anchor: "middle", op: P(t, 2, 2.6) });
    text(300, 245, [["vai para o bolso", "m"]], 36, { anchor: "middle", op: P(t, 2, 2.6) });
    text(700, 195, [["60% fica no PL", "c", 1]], 40, { anchor: "middle", op: P(t, 2, 2.6) });
    if (t >= 2) answerAt(700, 250, 44, t, "c");
    text(60, 310, [["15% × (1 − 0,4)"]], 40, { op: P(t, 8.5, 9.2) });
    text(60, 365, [["= 9% ao ano", "d", 1]], 44, { op: P(t, 9.2, 10) });
  } },

{ title: "As três alavancas", dur: 14, terms: ["DuPont", "margem", "giro", "alavancagem"],
  cap: [[0, "A análise <b>DuPont</b> quebra o ROE em três números. A mesma empresa: receita R$ 200, ativo R$ 150, PL R$ 100, lucro R$ 15."],
        [4, "<b>Margem</b> = lucro ÷ receita = 15 ÷ 200 = 7,5%. <b>Giro</b> = receita ÷ ativo = 200 ÷ 150 ≈ 1,33. <b>Alavancagem</b> = ativo ÷ PL = 150 ÷ 100 = 1,5."],
        [9.8, "Multiplique: receita e ativo se cancelam e sobra lucro ÷ PL. 7,5% × (200 ÷ 150) × 1,5 = <b>15%</b>, o mesmo ROE."]],
  ck: { at: 9.5, show: 9.8, kind: "opt", answer: "15%", opts: ["7,5%", "10%", "15%", "22,5%"],
        q: "Multiplique as três: 7,5% × 1,33 × 1,5. Qual ROE sai?",
        hint: "giro × alavancagem = (200 ÷ 150) × (150 ÷ 100) = 2. Quanto é 7,5% × 2?" },
  draw(t) {
    [["receita R$ 200", "a", 270, 55], ["ativo R$ 150", "e", 730, 55], ["PL R$ 100", "b", 270, 125], ["lucro R$ 15", "c", 730, 125]].forEach(([l, c, x, y], k) =>
      chip(x, y, l, c, 36, P(t, .4 + k * .4, 1 + k * .4)));
    const cols = [[175, "margem", ["lucro", "c"], ["receita", "a"], "= 7,5%", 4], [500, "giro", ["receita", "a"], ["ativo", "e"], "≈ 1,33", 5.5], [825, "alavancagem", ["ativo", "e"], ["PL", "b"], "= 1,5", 7]];
    cols.forEach(([x, name, n, d, v, a]) => {
      text(x, 230, [[name, "f", 1]], 36, { anchor: "middle", op: P(t, a, a + .6) });
      frac(x, 320, [[n[0], n[1], 1]], [[d[0], d[1], 1]], 40, P(t, a, a + .6));
      text(x, 450, [[v, "d", 1]], 44, { anchor: "middle", op: P(t, a + .8, a + 1.4) });
    });
    text(337, 335, [["×"]], 50, { anchor: "middle", op: P(t, 9.8, 10.3) });
    text(662, 335, [["×"]], 50, { anchor: "middle", op: P(t, 9.8, 10.3) });
    const c = P(t, 10.4, 11.2);
    if (c > 0) [[175, "receita", "a", 346], [500, "receita", "a", 294], [500, "ativo", "e", 346], [825, "ativo", "e", 294]].forEach(([x, w, col, y]) => {
      const ww = width([[w, col, 1]], 40) / 2 + 6;
      line(x - ww, y, x + ww, y, "r", 4, c);
    });
    text(470, 590, [["ROE ="]], 52, { anchor: "end" });
    answerAt(570, 590, 56, t, "d");
    text(500, 680, [["receita e ativo se cancelam: sobra lucro ÷ PL", "m"]], 36, { anchor: "middle", op: P(t, 11.2, 12) });
  } },

{ title: "Mesmo ROE, histórias diferentes", dur: 13, terms: ["margem", "giro", "alavancagem"],
  cap: [[0, "Três empresas com ROE de 15%. Os números são de exemplo, para mostrar o formato típico de cada setor."],
        [3, "<b>Varejo</b>: margem pequena, mas vende muito com pouco ativo (giro alto)."],
        [6, "<b>Software</b>: margem grande, cada venda extra custa quase nada."],
        [9, "<b>Banco</b>: margem 20%, giro 0,075, alavancagem 10."],
        [10.6, "O banco empresta muito mais do que o patrimônio dos sócios: <b>alavancagem alta</b> segura o ROE."]],
  ck: { at: 10.5, show: 10.6, kind: "tap", answer: 2, zones: [370, 560, 760].map(x => [x - 95, 520, 190, 75]),
        q: "Toque no número que segura o ROE de 15% do banco.",
        hint: "Uma margem de 20% com giro de 0,075 dá só 1,5%. Qual número multiplica isso por 10?" },
  draw(t) {
    const cols = [370, 560, 760, 930], hy = 120, hotC = ["c", "a", "e"];
    [["margem", "c"], ["giro", "a"], ["alavancagem", "e"], ["ROE", "d"]].forEach(([h, c], k) => text(cols[k], hy, [[h, c, 1]], 36, { anchor: "middle", op: P(t, 0, .8) }));
    line(20, hy + 25, 980, hy + 25, "l", 2, P(t, 0, .8));
    const rows = [["varejo", "3%", "2,5", "2", 1], ["software", "25%", "0,6", "1", 0], ["banco", "20%", "0,075", "10", 2]];
    rows.forEach(([n, m, g, a, hk], r) => {
      const y = 230 + r * 170, st = 3 + r * 3, op = P(t, st, st + .6), bank = r === 2;
      const roeAt = bank ? 10.8 : st + 1.4;
      text(30, y, [[n, "f", 1]], 40, { op });
      [m, g, a].forEach((v, k) => {
        const hot = k === hk && (!bank || (ans[cur] && t >= this.ck.show));
        text(cols[k], y, [[v, hot ? hotC[k] : "m", hot ? 1 : 0]], hot ? 48 : 40, { anchor: "middle", op: P(t, st + .3 + k * .3, st + .8 + k * .3) });
      });
      text(cols[3], y, [["15%", "d", 1]], 44, { anchor: "middle", op: P(t, roeAt, roeAt + .5) });

        [4, "Com R$ 100 você compra só <b>R$ 33,33</b> de patrimônio."],

    const r = P(t, 7.7, 8.7);
    box(430, base - pl * sc - 90 - 20 * r, 100, 20 * r + 0.01, "c", r, .6, 6);
    text(480, base - pl * sc - 110 - 20 * r, [["lucro R$ 5", "c", 1]], 36, { anchor: "middle", op: r });
    text(815, 160, [["seu retorno", "f", 1]], 40, { anchor: "middle", op: P(t, 6.8, 7.4) });
    frac(815, 270, [["ROE 15%", "d", 1]], [["P/VP 3", "b", 1]], 40, P(t, 8.7, 9.4));
    text(700, 450, [["="]], 60, { anchor: "middle", op: P(t, 8.7, 9.4) });
    if (t >= 6.8) answerAt(815, 450, 60, t, "c");
    text(815, 510, [["ao ano", "m"]], 36, { anchor: "middle", op: P(t, 8.7, 9.4) });

// ---------- player
const HEADLESS = /HeadlessChrome/.test(navigator.userAgent);
const $ = id => document.getElementById(id);
const starts = []; let total = 0;
SCENES.forEach(s => { starts.push(total); total += s.dur; });
const svg = $("stage"), cap = $("caption"), ask = $("ask"), terms = $("terms");
let T = 0, playing = false, speed = 1, lastTs = null, lastKey = "", tries = 0, tapWrong = null, lastWrong = null;
const sceneAt = T => { let i = 0; while (i + 1 < SCENES.length && T >= starts[i + 1]) i++; return i; };
const sceneEnd = i => starts[i] + SCENES[i].dur - 1e-3;
const ckTime = i => starts[i] + SCENES[i].ck.at;
const ckOpen = () => { const i = sceneAt(T), ck = SCENES[i].ck; return !!ck && !ans[i] && T >= ckTime(i) - 1e-6; };

const tl = $("timeline");
SCENES.forEach((s, i) => {
  const seg = document.createElement("div");
  seg.className = "seg"; seg.style.flex = s.dur; seg.title = `${i + 1}. ${s.title}`;
  seg.innerHTML = '<div class="fill"></div>';
  tl.appendChild(seg);
});
const fills = [...tl.querySelectorAll(".fill")];

function buildAsk(i) {
  const ck = SCENES[i].ck;
  tries = 0; tapWrong = null; lastWrong = null;
  ask.querySelector(".q").innerHTML = `<b>Sua vez:</b> ${ck.q}`;
  $("hint").textContent = "";
  const ctl = ask.querySelector(".ctl");
  ctl.innerHTML = "";
  if (ck.kind === "num") {
    ctl.innerHTML = '<input id="in" type="text" inputmode="decimal" autocomplete="off"><button id="check">Conferir</button>';
    const inp = $("in");
    inp.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") submit(inp.value.trim(), inp); });
    $("check").onclick = () => submit(inp.value.trim(), inp);
  } else if (ck.kind === "opt") {
    ck.opts.forEach(o => {
      const b = document.createElement("button");
      b.textContent = o; b.onclick = () => submit(o, b);
      ctl.appendChild(b);
    });
  } else {
    ctl.insertAdjacentHTML("beforeend", '<span>Toque no desenho.</span>');
  }
  const show = document.createElement("button");
  show.className = "show"; show.textContent = "Mostrar resposta";
  show.onclick = () => resolve(lastWrong, false);
  ctl.appendChild(show);
}
// typed numbers accept "20", "20%", "R$ 9", "9,0"; stored in pt-BR form for display
function submit(val, el) {
  if (val === "") return;
  const i = sceneAt(T), ck = SCENES[i].ck;
  let ok;
  if (ck.kind === "num") {
    const n = Number(String(val).replace(/R\$|%|\s/g, "").replace(",", "."));
    ok = Number.isFinite(n) && Math.abs(n - ck.answer) < 1e-9;
    if (Number.isFinite(n)) val = brn(n);
  } else ok = String(val) === String(ck.answer);
  if (ok) {
    if (el) el.classList.add("ok");
    return setTimeout(() => resolve(val, true), 450);
  }
  tries++; lastWrong = val;
  if (el) el.classList.add("bad");
  if (ck.kind === "tap") { tapWrong = val; lastKey = ""; }
  if (tries >= 2) return setTimeout(() => resolve(val, false), 450);
  $("hint").textContent = "Ainda não. Dica: " + ck.hint;
}
function resolve(val, ok) {
  const i = sceneAt(T);
  if (ans[i]) return;
  ans[i] = { val, ok };
  lastKey = "";
  setPlaying(true);
}

let askFor = -1;
function render() {
  const i = sceneAt(T), s = SCENES[i], t = Math.min(T - starts[i], s.dur), open = ckOpen();
  if (open && askFor !== i) { buildAsk(i); askFor = i; }
  if (!open) askFor = -1;
  ask.style.display = open ? "block" : "none";
  cap.style.display = open ? "none" : "block";
  const key = i + ":" + t.toFixed(3) + ":" + open + ":" + tapWrong;
  if (key === lastKey) return;
  lastKey = key; out = []; cur = i;
  s.draw(t);
  if (s.ck && s.ck.kind === "tap" && t >= s.ck.at - 1e-6) {
    const z = s.ck.zones, a = ans[i];
    const ring = (k, c, dash = "") => add(`<rect x="${z[k][0] + 4}" y="${z[k][1] + 4}" width="${z[k][2] - 8}" height="${z[k][3] - 8}" rx="8" fill="none" stroke="${COL[c]}" stroke-width="5" stroke-dasharray="${dash}"/>`);
    if (open) { z.forEach((_, k) => ring(k, "m", "8 8")); if (tapWrong !== null) ring(tapWrong, "r"); }
    else if (a) { ring(s.ck.answer, "c"); if (!a.ok && a.val !== null && a.val !== s.ck.answer) ring(a.val, "r"); }
  }
  svg.innerHTML = out.join("");
  const c = s.cap.filter(([a]) => a <= t + 1e-6).pop();
  if (cap.innerHTML !== c[1]) cap.innerHTML = c[1];
  const tm = s.terms.map(k => `<b>${k}</b>: ${GLOSS[k]}`).join(" · ");
  if (terms.innerHTML !== tm) terms.innerHTML = tm;
  fills.forEach((f, k) => f.style.width = (k < i ? 100 : k > i ? 0 : 100 * (T - starts[i]) / s.dur) + "%");
  $("where").textContent = s.title;
  $("prev").disabled = i === 0;
  const last = i === SCENES.length - 1;
  $("next").disabled = last ? !(HEADLESS && open) : (!HEADLESS && open);
  $("play").disabled = open;
}
function loop(ts) {
  if (playing && lastTs !== null) {
    const i = sceneAt(T), s = SCENES[i];
    const stop = s.ck && !ans[i] && T < ckTime(i) ? ckTime(i) : sceneEnd(i);
    T += (ts - lastTs) / 1000 * speed;
    if (T >= stop) { T = stop; setPlaying(false); }
  }
  lastTs = ts;
  render();
  requestAnimationFrame(loop);
}
function setPlaying(v) { playing = v; $("play").textContent = v ? "⏸" : "▶"; }
// headless (fit-check): stop on each checkpoint with the box open, then on the revealed last frame
function go(i) {
  i = clamp(i, 0, SCENES.length - 1);
  ans[i] = undefined; askFor = -1;
  if (HEADLESS) T = SCENES[i].ck ? ckTime(i) : sceneEnd(i);
  else { T = starts[i]; setPlaying(true); }
  render();
}
$("play").onclick = () => {
  const i = sceneAt(T);
  if (ckOpen()) return;
  if (playing) return setPlaying(false);
  if (T >= sceneEnd(i)) return go(i === SCENES.length - 1 ? 0 : i + 1);
  setPlaying(true);
};
$("replay").onclick = () => go(sceneAt(T));
$("restart").onclick = () => go(0);
$("prev").onclick = () => go(sceneAt(T) - 1);
$("next").onclick = () => {
  const i = sceneAt(T);
  if (ckOpen()) {
    if (!HEADLESS) return;
    ans[i] = { val: SCENES[i].ck.kind === "num" ? brn(SCENES[i].ck.answer) : SCENES[i].ck.answer, ok: true };
    T = sceneEnd(i);
    return render();
  }
  go(i + 1);
};
document.querySelectorAll(".spd").forEach(b => b.onclick = () => {
  speed = +b.dataset.s;
  document.querySelectorAll(".spd").forEach(x => x.classList.toggle("on", x === b));
});
function scrub(e) {
  const r = tl.getBoundingClientRect();
  T = clamp((e.clientX - r.left) / r.width) * total * 0.9999;
  const i = sceneAt(T);
  if (SCENES[i].ck && !ans[i] && T > ckTime(i)) T = ckTime(i);
  setPlaying(false);
  render();
}
tl.addEventListener("pointerdown", e => { scrub(e); tl.setPointerCapture(e.pointerId); tl.onpointermove = scrub; });
tl.addEventListener("pointerup", () => tl.onpointermove = null);
svg.addEventListener("pointerdown", e => {
  const i = sceneAt(T), ck = SCENES[i].ck;
  if (!ckOpen() || ck.kind !== "tap") return;
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  const k = ck.zones.findIndex(([x, y, w, h]) => p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h);
  if (k >= 0) submit(k, null);
});
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === " ") { e.preventDefault(); $("play").click(); }
  if (e.key === "ArrowRight") $("next").click();
  if (e.key === "ArrowLeft") go(sceneAt(T) - 1);
});
if (HEADLESS) go(0);
requestAnimationFrame(loop);
</script>
