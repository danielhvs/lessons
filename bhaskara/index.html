<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fórmula de Bhaskara</title>
<style>
:root {
  --bg: #f7f6f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65;
  --line: #e2e0d8; --accent: #2f6fde; --accent-soft: #2f6fde22;
  --add: #1f8a4c; --add-bg: #1f8a4c1f; --del: #c2382f; --del-bg: #c2382f1a;
  --code-bg: #f1efe8; --term-bg: #1d1f24; --term-ink: #e6e6e6;
  --curve: #2f6fde; --root: #1f8a4c; --axis2: #d9822b; --half: #8a4fd0; --grid: #ecebe4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161a; --panel: #1d1f24; --ink: #ecebe6; --muted: #9a998f;
    --line: #2e3038; --accent: #6ea0ff; --accent-soft: #6ea0ff26;
    --add: #4cc483; --add-bg: #4cc48322; --del: #ff7a70; --del-bg: #ff7a7020;
    --code-bg: #24262d; --term-bg: #0e0f12; --term-ink: #e6e6e6;
    --curve: #6ea0ff; --root: #4cc483; --axis2: #f0a35a; --half: #b88cf0; --grid: #262830;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
  font: clamp(15px, 1.1vmin + 7px, 18px)/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 1600px;
  margin: 0 auto; padding: clamp(10px, 2vh, 20px) clamp(16px, 3vw, 48px); }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
header h1 { font-size: 1.4rem; margin: 0 0 2px; }
header p { margin: 0; color: var(--muted); }
header a { color: var(--accent); }
.dots { display: flex; gap: 6px; margin: clamp(8px, 1.6vh, 16px) 0; flex-wrap: wrap; }
.dot {
  width: 28px; height: 6px; border-radius: 3px; border: 0; padding: 0;
  background: var(--line); cursor: pointer; transition: background .3s;
}
.dot.done { background: var(--accent-soft); }
.dot.on { background: var(--accent); }
.stage {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: clamp(14px, 2.4vh, 24px); flex: 1; min-height: 0; overflow: hidden;
}
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 20px; align-items: start; }
.step { animation: enter .45s ease both; transform-origin: top left; }
@keyframes enter { from { opacity: 0; transform: translateY(14px); } }
.num { color: var(--accent); font-weight: 600; font-size: .85rem; letter-spacing: .04em; }
.step h2 { margin: 2px 0 6px; font-size: 1.3rem; }
.say { margin: 0 0 clamp(10px, 1.8vh, 18px); max-width: 80ch; }
.say code, .note code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
.note { color: var(--muted); font-size: .92rem; margin-top: 12px; max-width: 80ch; }
.tip { border-bottom: 1px dotted var(--accent); cursor: help; }
#tip { position: fixed; z-index: 10; max-width: min(56ch, 90vw); padding: 8px 12px; border-radius: 8px;
  background: var(--ink); color: var(--bg); font: 14px/1.45 system-ui, sans-serif; pointer-events: none; }
pre {
  margin: 0; background: var(--code-bg); border-radius: 10px; padding: 12px 0;
  font: clamp(12.5px, .9vmin + 6px, 16px)/1.6 ui-monospace, "JetBrains Mono", Menlo, monospace;
}
.ln { display: block; padding: 0 16px 0 calc(16px + 2em); text-indent: -2em; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.6em;
  border-left: 3px solid transparent; transition: background .3s, border-color .3s; }
.ln.hl { background: var(--accent-soft); border-left-color: var(--accent); }
.ln[data-tip], .ln[data-mark] { cursor: help; }
.ln[data-tip] { text-decoration: underline dotted var(--muted); }
.ln.lit { background: var(--accent-soft); border-left-color: var(--axis2); }
.term {
  background: var(--term-bg); color: var(--term-ink); border-radius: 10px; padding: 14px 16px;
  font: clamp(12.5px, .9vmin + 6px, 15px)/1.55 ui-monospace, "JetBrains Mono", Menlo, monospace;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.term .cmd::before { content: "$ "; color: #7fd18b; }
.term .out { color: #b9b9b9; animation: enter .3s ease both; }
.caret { display: inline-block; width: 8px; height: 1.1em; background: var(--term-ink);
  vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* the parabola */
svg.plot { width: 100%; height: auto; max-height: 42vh; display: block; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .axis { stroke: var(--muted); stroke-width: 1.4; }
svg .tick { fill: var(--muted); font: 11px system-ui, sans-serif; }
svg .curve { stroke: var(--curve); stroke-width: 3; fill: none; }
svg .curve.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
svg .eq { fill: var(--curve); font: 600 15px ui-monospace, monospace; }
svg .pop { opacity: 0; animation: pop .45s ease forwards; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
svg .root { fill: var(--root); stroke: var(--panel); stroke-width: 2; }
svg .rlabel { fill: var(--root); font: 600 14px ui-monospace, monospace; }
svg .reveal { cursor: pointer; }
svg .vtx { fill: var(--panel); stroke: var(--curve); stroke-width: 2; }
svg .axl { stroke: var(--axis2); stroke-width: 2; stroke-dasharray: 6 5; }
svg .axt { fill: var(--axis2); font: 600 13px ui-monospace, monospace; }
svg .hf { stroke: var(--half); stroke-width: 2; }
svg .hft { fill: var(--half); font: 600 13px ui-monospace, monospace; }
svg .cpt { fill: var(--axis2); }
svg .delta { font: 600 14px ui-monospace, monospace; }
svg .lit { filter: drop-shadow(0 0 5px var(--axis2)); }
svg .lit line, svg line.lit { stroke-width: 4; }

/* completing the square */
svg.sq { width: 100%; height: auto; max-height: 42vh; display: block; }
svg .tile { stroke: var(--panel); stroke-width: 2; }
svg .t-x2 { fill: var(--curve); opacity: .8; }
svg .t-bx { fill: var(--half); opacity: .75; }
svg .t-c { fill: none; stroke: var(--axis2); stroke-width: 2.5; stroke-dasharray: 6 4; }
svg .t-cf { fill: var(--axis2); opacity: .25; }
svg .tl { fill: #fff; font: 600 15px ui-monospace, monospace; }
svg .sl { fill: var(--ink); font: 14px ui-monospace, monospace; }
svg .ctl { fill: var(--axis2); font: 600 14px ui-monospace, monospace; }
svg .whole { fill: none; stroke: var(--ink); stroke-width: 2; opacity: 0; }
svg .whole.lit { opacity: 1; }

/* explorer */
.ctrl { display: grid; gap: 10px; }
.slider { display: grid; grid-template-columns: 5.5em 1fr; align-items: center; gap: 10px;
  font: 15px ui-monospace, monospace; }
.slider input { width: 100%; min-width: 0; margin: 0; accent-color: var(--accent); }
.presets { display: flex; gap: 8px; flex-wrap: wrap; }
.presets button { font: inherit; font-size: .9rem; padding: 5px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); }

nav {
  position: relative; flex: none; background: var(--panel);
  border-top: 1px solid var(--line); padding: clamp(8px, 1.4vh, 12px) 16px;
  display: flex; gap: 10px; justify-content: center; align-items: center;
}
nav button {
  font: inherit; font-size: .95rem; padding: 8px 16px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
nav button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
nav button:disabled { opacity: .4; cursor: default; }
nav .count { color: var(--muted); font-size: .9rem; min-width: 52px; text-align: center; }
.bar { height: 3px; background: var(--accent); width: 0; position: absolute; left: 0; top: -2px; }
.bar.run { transition: width linear; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01s !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <header><div><h1 id="title"></h1><p id="subtitle"></p></div><a href="creative.html">versão criativa: a máquina de Bhaskara →</a></header>
  <div class="dots" id="dots"></div>
  <section class="stage" id="stage" aria-live="polite"></section>
</main>
<nav>
  <div class="bar" id="bar"></div>
  <button id="prev">← Voltar</button>
  <button id="play" class="primary">▶ Play</button>
  <button id="next">Próximo →</button>
  <span class="count" id="count"></span>
</nav>
<div id="tip" hidden></div>

<script id="lesson" type="application/json">
{
  "title": "Fórmula de Bhaskara",
  "subtitle": "Onde a parábola corta o eixo x",
  "steps": [
    {"title": "A pergunta", "say": "Qual `x` zera `x² − 5x + 6`? Desenhe `y = x² − 5x + 6`: dá uma [[parábola|Todo polinômio de grau 2 (ax² + bx + c com a ≠ 0) desenha uma parábola.]]. As [[raízes|Raiz = valor de x que faz a expressão valer 0.]] são onde ela corta o eixo x (y = 0). Chute, depois clique nos pontos verdes.",
     "show": {"kind": "split", "panes": [
       {"kind": "plot", "a": 1, "b": -5, "c": 6, "marks": ["roots"], "reveal": true},
       {"kind": "code", "code": "x² − 5x + 6 = 0\n\nx = 0  →  0 − 0 + 6   = 6\nx = 1  →  1 − 5 + 6   = 2\nx = ?  →  ...         = 0"}]},
     "note": "Chutar funciona aqui porque as raízes são inteiras. Com raízes como 1,37 o chute não acha nada: é para isso que existe a fórmula."},

    {"title": "Separe a, b e c", "say": "Toda equação do 2º grau tem a forma `ax² + bx + c = 0`. O primeiro passo é ler os três números. O sinal vai junto: em `− 5x`, b é `−5`. Passe o mouse na linha do c.",
     "show": {"kind": "split", "panes": [
       {"kind": "plot", "a": 1, "b": -5, "c": 6, "marks": ["c"]},
       {"kind": "code", "code": "a·x²  + b·x  + c  = 0\n1·x²  − 5·x  + 6  = 0\n\na = 1\nb = −5\nc = 6", "highlight": [5],
        "tips": {"4": "a é o número na frente de x². Quando não aparece nada, é 1.", "5": "O sinal de menos faz parte do b. Esquecer isso é o erro nº 1."},
        "marks": {"6": "c"}}]},
     "note": "c é onde a parábola corta o eixo y: em x = 0 sobra só o c."},

    {"title": "Calcule o Δ (delta)", "say": "`Δ = b² − 4ac` é o [[discriminante|Discriminante: ele discrimina (separa) os três casos: duas raízes, uma raiz ou nenhuma.]]. Ele diz quantas raízes existem antes do resto da conta. Aqui Δ = 1, positivo: duas raízes.",
     "show": {"kind": "split", "panes": [
       {"kind": "plot", "a": 1, "b": -5, "c": 6, "marks": ["roots", "delta"], "nolabels": true},
       {"kind": "code", "code": "Δ = b² − 4·a·c\nΔ = (−5)² − 4·1·6\nΔ = 25 − 24\nΔ = 1", "highlight": [4],
        "tips": {"2": "Coloque o b entre parênteses. (−5)² = 25, positivo. Sem parênteses a calculadora faz −5² = −25.", "4": "Δ > 0: duas raízes. Δ = 0: uma. Δ < 0: nenhuma real."},
        "marks": {"4": "delta"}}]}},

    {"title": "Aplique a fórmula", "say": "`x = (−b ± √Δ) / 2a`. O [[±|Mais ou menos: faça a conta duas vezes, uma com + e outra com −. Cada uma dá uma raiz.]] quer dizer: faça a conta duas vezes. Passe o mouse nas duas últimas linhas.",
     "show": {"kind": "split", "panes": [
       {"kind": "plot", "a": 1, "b": -5, "c": 6, "marks": ["roots"]},
       {"kind": "code", "code": "x = (−b ± √Δ) / (2·a)\nx = (−(−5) ± √1) / (2·1)\nx = (5 ± 1) / 2\n\nx₁ = (5 + 1) / 2 = 3\nx₂ = (5 − 1) / 2 = 2", "highlight": [5, 6],
        "tips": {"2": "−(−5) = +5. Menos com menos dá mais."},
        "marks": {"5": "roots", "6": "roots"}}]},
     "note": "Confere: 3² − 5·3 + 6 = 9 − 15 + 6 = 0 e 2² − 5·2 + 6 = 4 − 10 + 6 = 0."},

    {"title": "O que cada pedaço desenha", "say": "Quebre a fórmula em dois pedaços. `−b/2a` é o meio da parábola (o [[eixo de simetria|A linha vertical que divide a parábola em duas metades espelhadas. O vértice fica em cima dela.]]). `√Δ/2a` é a distância do meio até cada raiz. Passe o mouse nas linhas.",
     "show": {"kind": "split", "panes": [
       {"kind": "plot", "a": 1, "b": -5, "c": 6, "marks": ["axis", "half", "roots", "vertex"]},
       {"kind": "code", "code": "x = −b/2a  ±  √Δ/2a\n\n−b/2a = 5/2 = 2,5      o meio\n√Δ/2a = 1/2 = 0,5      a distância\n\nx = 2,5 ± 0,5   →   3 e 2",
        "marks": {"3": "axis", "4": "half", "6": "roots"}}]},
     "note": "Por isso as raízes ficam sempre à mesma distância do vértice: a fórmula anda o mesmo tanto para cada lado."},

    {"title": "Δ = 0: uma raiz só", "say": "`x² − 4x + 4 = 0`. Com Δ = 0, √Δ = 0: a distância até as raízes é zero, então as duas caem no mesmo ponto. A parábola só encosta no eixo x.",
     "show": {"kind": "split", "panes": [
       {"kind": "plot", "a": 1, "b": -4, "c": 4, "marks": ["roots", "axis", "delta"], "xr": [-2, 6], "yr": [-3, 8]},
       {"kind": "code", "code": "a = 1, b = −4, c = 4\n\nΔ = (−4)² − 4·1·4 = 16 − 16 = 0\nx = (4 ± 0) / 2\nx = 2", "highlight": [3],
        "marks": {"3": "delta", "5": "roots"}}]}},

    {"title": "Δ < 0: nenhuma raiz real", "say": "`x² + x + 1 = 0`. Δ = −3, e não existe [[raiz quadrada de negativo|Nenhum número real ao quadrado dá negativo. Nos números complexos existe: x = (−1 ± i√3) / 2.]] nos números reais. No desenho: a parábola fica toda acima do eixo x e nunca corta.",
     "show": {"kind": "split", "panes": [
       {"kind": "plot", "a": 1, "b": 1, "c": 1, "marks": ["axis", "vertex", "delta"], "xr": [-4, 3], "yr": [-2, 8]},
       {"kind": "code", "code": "a = 1, b = 1, c = 1\n\nΔ = 1² − 4·1·1 = 1 − 4 = −3\n√(−3)  →  não existe nos reais\n\nsolução: { }  (conjunto vazio)", "highlight": [4],
        "marks": {"3": "delta"}}]}},

    {"title": "a negativo: a parábola vira", "say": "`−2x² + 4x + 6 = 0`. Com a < 0 a parábola abre para baixo. A fórmula é a mesma; só cuide dos sinais: `−4·(−2)·6 = +48`, e o 2a no denominador é −4.",
     "show": {"kind": "split", "panes": [
       {"kind": "plot", "a": -2, "b": 4, "c": 6, "marks": ["roots", "axis", "vertex"], "xr": [-3, 5], "yr": [-4, 10]},
       {"kind": "code", "code": "a = −2, b = 4, c = 6\n\nΔ = 4² − 4·(−2)·6 = 16 + 48 = 64\nx = (−4 ± 8) / (2·(−2)) = (−4 ± 8) / −4\n\nx₁ = 4 / −4   = −1\nx₂ = −12 / −4 = 3",
        "tips": {"3": "−4 · (−2) = +8, e 8 · 6 = 48. O Δ cresce em vez de diminuir."},
        "marks": {"4": "axis", "6": "roots", "7": "roots"}}]},
     "note": "Com a negativo o x₁ (o do +) sai menor que o x₂. Tudo bem: os nomes são só rótulos."},

    {"title": "Em código", "say": "A mesma conta em Python, rodada de verdade com os quatro exemplos desta aula.",
     "show": {"kind": "split", "panes": [
       {"kind": "code", "code": "import math\n\ndef bhaskara(a, b, c):\n    delta = b*b - 4*a*c\n    if delta < 0:\n        return []\n    r = math.sqrt(delta)\n    return sorted({(-b + r) / (2*a), (-b - r) / (2*a)})\n\nprint(bhaskara(1, -5, 6))\nprint(bhaskara(1, -4, 4))\nprint(bhaskara(1, 1, 1))\nprint(bhaskara(-2, 4, 6))",
        "highlight": [4, 8],
        "tips": {"5": "Δ < 0: nenhuma raiz real, devolve lista vazia.", "8": "O { } é um set: com Δ = 0 as duas contas dão o mesmo número e o set guarda só um."}},
       {"kind": "terminal", "lines": [{"cmd": "python3 bhaskara.py"}, {"out": "[2.0, 3.0]"}, {"out": "[2.0]"}, {"out": "[]"}, {"out": "[-1.0, 3.0]"}]}]}},

    {"title": "De onde vem a fórmula", "say": "Ela sai de [[completar o quadrado|Truque: somar o pedaço que falta para x² + (b/a)x virar um quadrado perfeito (x + b/2a)².]]. Divida x² + (b/a)x em um quadrado e duas tiras de b/2a. Falta um cantinho de lado b/2a para fechar um quadrado grande. Passe o mouse nas linhas 3 e 4.",
     "show": {"kind": "split", "panes": [
       {"kind": "square"},
       {"kind": "code", "code": "ax² + bx + c = 0\nx² + (b/a)x = −c/a\nx² + (b/a)x + (b/2a)² = (b/2a)² − c/a\n(x + b/2a)² = (b² − 4ac) / 4a²\nx + b/2a = ±√Δ / 2a\nx = (−b ± √Δ) / 2a",
        "highlight": [6],
        "tips": {"2": "Divide tudo por a e passa o c para o outro lado.", "3": "Soma o cantinho (b/2a)² dos dois lados para manter a igualdade.", "4": "O lado esquerdo virou um quadrado perfeito. No direito, junta as frações: aparece o b² − 4ac, o Δ.", "5": "Tira a raiz dos dois lados. Raiz de um quadrado pode ser + ou −: daí o ±."},
        "marks": {"3": "corner", "4": "whole"}}]}},

    {"title": "Brinque", "say": "Mexa em a, b e c. Veja o Δ trocar de sinal e as raízes aparecerem, se juntarem e sumirem.",
     "show": {"kind": "explore", "a": 1, "b": -2, "c": -3}}
  ]
}
</script>

<script>
const LESSON = JSON.parse(document.getElementById("lesson").textContent);
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const svgEl = (tag, attrs, text) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
};
const prose = (cls, s) => {
  const p = el("p", cls);
  String(s).split(/(`[^`]+`|\[\[[^\]]+\]\])/).forEach(part => {
    if (part.startsWith("`") && part.endsWith("`") && part.length > 1) p.append(el("code", null, part.slice(1, -1)));
    else if (part.startsWith("[[") && part.endsWith("]]")) {
      const [word, tip] = part.slice(2, -2).split("|");
      const t = el("span", "tip", word); t.dataset.tip = tip || ""; p.append(t);
    } else p.append(part);
  });
  return p;
};

// pt-BR numbers: comma decimals, real minus sign
const fmt = n => { const r = Math.round(n * 100) / 100 || 0; return String(r).replace(".", ",").replace("-", "−"); };
const par = n => n < 0 ? `(${fmt(n)})` : fmt(n);
function poly(a, b, c) {
  let s = "";
  [[a, "x²"], [b, "x"], [c, ""]].forEach(([k, v]) => {
    if (k === 0) return;
    const abs = Math.abs(k);
    s += s ? (k < 0 ? " − " : " + ") : (k < 0 ? "−" : "");
    s += (abs === 1 && v ? "" : fmt(abs)) + v;
  });
  return s || "0";
}
// {delta, x1 (with +), x2 (with −)}; a = 0 is a line, not a quadratic
function solve(a, b, c) {
  if (a === 0) return {line: true, roots: b !== 0 ? [-c / b] : []};
  const d = b * b - 4 * a * c;
  if (d < 0) return {delta: d, roots: []};
  const r = Math.sqrt(d), x1 = (-b + r) / (2 * a), x2 = (-b - r) / (2 * a);
  return {delta: d, x1, x2, roots: d === 0 ? [x1] : [x1, x2]};
}

let i = 0, playing = false, timer = null, pending = [];
const later = (fn, ms) => pending.push(setTimeout(fn, ms));
const clearPending = () => { pending.forEach(clearTimeout); pending = []; };

function renderPlot(s, animate = true) {
  const W = 520, H = 340, M = 28, {a, b, c} = s, marks = new Set(s.marks || []);
  const [x0, x1] = s.xr || [-2, 6], [y0, y1] = s.yr || [-3, 8];
  const sx = x => M + (x - x0) / (x1 - x0) * (W - 2 * M), sy = y => H - M - (y - y0) / (y1 - y0) * (H - 2 * M);
  const svg = svgEl("svg", {class: "plot", viewBox: `0 0 ${W} ${H}`});
  const uid = Math.random().toString(36).slice(2);
  const defs = svgEl("defs", {});
  const cp = svgEl("clipPath", {id: "c" + uid}); cp.append(svgEl("rect", {x: M, y: M, width: W - 2 * M, height: H - 2 * M}));
  const mk = svgEl("marker", {id: "m" + uid, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse"});
  mk.append(svgEl("path", {d: "M0,0 L10,5 L0,10 z", fill: "var(--half)"}));
  defs.append(cp, mk); svg.append(defs);
  const ax = Math.min(Math.max(sy(0), M), H - M), ay = Math.min(Math.max(sx(0), M), W - M);
  const stepX = x1 - x0 > 12 ? 2 : 1, stepY = y1 - y0 > 12 ? 2 : 1;
  for (let x = Math.ceil(x0); x <= x1; x++) {
    svg.append(svgEl("line", {class: "grid", x1: sx(x), x2: sx(x), y1: M, y2: H - M}));
    if (x !== 0 && x % stepX === 0) svg.append(svgEl("text", {class: "tick", x: sx(x), y: ax + 14, "text-anchor": "middle"}, fmt(x)));
  }
  for (let y = Math.ceil(y0); y <= y1; y++) {
    svg.append(svgEl("line", {class: "grid", x1: M, x2: W - M, y1: sy(y), y2: sy(y)}));
    if (y !== 0 && y % stepY === 0) svg.append(svgEl("text", {class: "tick", x: ay - 6, y: sy(y) + 4, "text-anchor": "end"}, fmt(y)));
  }
  svg.append(svgEl("line", {class: "axis", x1: M, x2: W - M, y1: ax, y2: ax}));
  svg.append(svgEl("line", {class: "axis", x1: ay, x2: ay, y1: M, y2: H - M}));
  svg.append(svgEl("text", {class: "tick", x: W - M + 4, y: ax + 4}, "x"));
  svg.append(svgEl("text", {class: "tick", x: ay + 4, y: M - 6}, "y"));
  let d = "";
  for (let k = 0; k <= 240; k++) {
    const x = x0 + (x1 - x0) * k / 240, y = a * x * x + b * x + c;
    d += (k ? "L" : "M") + sx(x).toFixed(1) + "," + sy(Math.max(Math.min(y, y1 + 50), y0 - 50)).toFixed(1);
  }
  svg.append(svgEl("path", {class: "curve" + (animate ? " draw" : ""), d, "clip-path": `url(#c${uid})`, pathLength: 1}));
  svg.append(svgEl("text", {class: "eq", x: W - M - 4, y: M + 18, "text-anchor": "end"}, "y = " + poly(a, b, c)));

  const sol = solve(a, b, c), delay = animate ? 1000 : 0;
  const g = (mark, k = 0) => {
    const e = svgEl("g", {"data-mark": mark});
    if (animate) { e.setAttribute("class", "pop"); e.style.animationDelay = (delay + k * 250) + "ms"; }
    svg.append(e); return e;
  };
  const h = a ? -b / (2 * a) : null, inside = a > 0 ? 1 : -1;
  if (marks.has("axis") && h !== null) {
    const e = g("axis", 0);
    e.append(svgEl("line", {class: "axl", x1: sx(h), x2: sx(h), y1: M + 26, y2: H - M}));
    e.append(svgEl("text", {class: "axt", x: sx(h) + 6, y: M + 40}, "−b/2a = " + fmt(h)));
  }
  if (marks.has("half") && sol.roots.length === 2) {
    const e = g("half", 1), y = ax + 30;
    sol.roots.forEach(r => e.append(svgEl("line", {class: "hf", x1: sx(h), x2: sx(r), y1: y, y2: y, "marker-end": `url(#m${uid})`})));
    e.append(svgEl("text", {class: "hft", x: sx(Math.max(...sol.roots)) + 10, y: y + 5}, "√Δ/2a = " + fmt(Math.abs(Math.sqrt(sol.delta) / (2 * a)))));
  }
  if (marks.has("vertex") && h !== null) {
    const e = g("vertex", 1);
    e.append(svgEl("circle", {class: "vtx", cx: sx(h), cy: sy(a * h * h + b * h + c), r: 5}));
  }
  if (marks.has("c")) {
    const e = g("c", 0);
    e.append(svgEl("circle", {class: "cpt", cx: sx(0), cy: sy(c), r: 6}));
    e.append(svgEl("text", {class: "axt", x: sx(0) + 10, y: sy(c) + 5}, "c = " + fmt(c)));
  }
  if (marks.has("roots")) {
    const e = g("roots", 2), labels = [];
    sol.roots.forEach((r, k) => {
      const name = sol.roots.length === 1 ? "x" : (k === 0 ? "x₁" : "x₂"), right = r >= Math.min(...sol.roots) && sol.roots.length === 2 && r === Math.max(...sol.roots);
      const one = sol.roots.length === 1, dy = inside > 0 ? 22 : -12;
      e.append(svgEl("circle", {class: "root" + (s.reveal ? " reveal" : ""), cx: sx(r), cy: ax, r: 7}));
      if (s.nolabels) return;
      const t = svgEl("text", {class: "rlabel", x: sx(r) + (one ? 0 : right ? 10 : -10), y: ax + dy,
        "text-anchor": one ? "middle" : right ? "start" : "end"}, s.reveal ? "?" : `${name} = ${fmt(r)}`);
      t.dataset.val = `${name} = ${fmt(r)}`; labels.push(t); e.append(t);
    });
    if (s.reveal) e.querySelectorAll(".reveal").forEach(cc => cc.addEventListener("click", () => labels.forEach(t => t.textContent = t.dataset.val)));
  }
  if (marks.has("delta") && !sol.line) {
    const e = g("delta", 0), dl = sol.delta;
    const txt = `Δ = ${fmt(dl)} ${dl > 0 ? "> 0 · 2 raízes" : dl === 0 ? "· 1 raiz" : "< 0 · nenhuma raiz"}`;
    e.append(svgEl("text", {class: "delta", x: M + 8, y: M + 18, fill: dl > 0 ? "var(--root)" : dl === 0 ? "var(--axis2)" : "var(--del)"}, txt));
  }
  return [svg, animate ? 1800 : 0];
}

function renderSquare() {
  const svg = svgEl("svg", {class: "sq", viewBox: "0 0 380 320"});
  const X = 60, Y = 40, S = 170, B = 70, tiles = [
    ["rect", {class: "tile t-x2", x: X, y: Y, width: S, height: S}, "x²", X + S / 2, Y + S / 2, 0],
    ["rect", {class: "tile t-bx", x: X + S, y: Y, width: B, height: S}, "(b/2a)x", X + S + B / 2, Y + S / 2, 400],
    ["rect", {class: "tile t-bx", x: X, y: Y + S, width: S, height: B}, "(b/2a)x", X + S / 2, Y + S + B / 2, 800]
  ];
  tiles.forEach(([tag, attrs, label, lx, ly, t]) => {
    const g = svgEl("g", {class: "pop", style: `animation-delay:${t}ms`});
    g.append(svgEl(tag, attrs), svgEl("text", {class: "tl", x: lx, y: ly + 5, "text-anchor": "middle"}, label));
    svg.append(g);
  });
  const corner = svgEl("g", {class: "pop", "data-mark": "corner", style: "animation-delay:1500ms"});
  corner.append(svgEl("rect", {class: "t-cf", x: X + S, y: Y + S, width: B, height: B}),
    svgEl("rect", {class: "t-c", x: X + S + 2, y: Y + S + 2, width: B - 4, height: B - 4}),
    svgEl("text", {class: "ctl", x: X + S + B / 2, y: Y + S + B / 2 + 5, "text-anchor": "middle"}, "(b/2a)²"),
    svgEl("text", {class: "ctl", x: X + S + B + 6, y: Y + S + B + 20, "text-anchor": "end"}, "falta este canto"));
  svg.append(corner);
  svg.append(svgEl("rect", {class: "whole", "data-mark": "whole", x: X - 3, y: Y - 3, width: S + B + 6, height: S + B + 6}));
  [["x", X + S / 2, Y - 10], ["b/2a", X + S + B / 2, Y - 10]].forEach(([t, x, y]) => svg.append(svgEl("text", {class: "sl", x, y, "text-anchor": "middle"}, t)));
  [["x", X - 10, Y + S / 2], ["b/2a", X - 10, Y + S + B / 2]].forEach(([t, x, y]) => svg.append(svgEl("text", {class: "sl", x, y: y + 5, "text-anchor": "end"}, t)));
  return [svg, 2000];
}

function renderExplore(s) {
  const box = el("div", "split"), plotBox = el("div"), ctrl = el("div", "ctrl"), pre = el("pre");
  const v = {a: s.a, b: s.b, c: s.c}, inputs = {};
  const marks = {2: "delta", 4: "axis", 5: "roots"};
  const draw = animate => {
    const {a, b, c} = v, sol = solve(a, b, c);
    plotBox.replaceChildren(renderPlot({a, b, c, marks: ["roots", "axis", "vertex", "delta"], xr: [-6, 6], yr: [-5, 7]}, animate)[0]);
    let lines;
    if (sol.line) lines = [`y = ${poly(a, b, c)}`, "a = 0: sem x², não é do 2º grau", "a fórmula dividiria por 2a = 0", "vira reta: x = −c/b",
      sol.roots.length ? `x = ${fmt(sol.roots[0])}` : "sem raiz"];
    else {
      const dl = sol.delta, sq = dl >= 0 ? fmt(Math.sqrt(dl)) : "√" + par(dl);
      lines = [`y = ${poly(a, b, c)}`, `Δ = ${par(b)}² − 4·${par(a)}·${par(c)} = ${fmt(dl)}`,
        dl > 0 ? "Δ > 0  →  2 raízes" : dl === 0 ? "Δ = 0  →  1 raiz" : "Δ < 0  →  nenhuma raiz real",
        `x = (${fmt(-b)} ± ${sq}) / ${par(2 * a)}`,
        dl < 0 ? "a parábola não toca o eixo x" : dl === 0 ? `x = ${fmt(sol.x1)}` : `x₁ = ${fmt(sol.x1)}   x₂ = ${fmt(sol.x2)}`];
    }
    pre.replaceChildren(...lines.map((t, n) => { const ln = el("span", "ln", t); if (marks[n + 1]) ln.dataset.mark = marks[n + 1]; return ln; }));
    for (const k in inputs) inputs[k].label.textContent = `${k} = ${fmt(v[k])}`;
  };
  [["a", -3, 3], ["b", -8, 8], ["c", -8, 8]].forEach(([k, lo, hi]) => {
    const row = el("label", "slider"), label = el("span"), inp = el("input");
    Object.assign(inp, {type: "range", min: lo, max: hi, step: 0.5, value: v[k]});
    inp.oninput = () => { v[k] = +inp.value; draw(false); };
    inputs[k] = {label, inp}; row.append(label, inp); ctrl.append(row);
  });
  const presets = el("div", "presets");
  [["2 raízes", 1, -2, -3], ["1 raiz", 1, -2, 1], ["nenhuma", 1, -2, 3], ["abre p/ baixo", -1, 1, 2]].forEach(([t, a, b, c]) => {
    const bt = el("button", null, t);
    bt.onclick = () => { Object.assign(v, {a, b, c}); for (const k in inputs) inputs[k].inp.value = v[k]; draw(true); };
    presets.append(bt);
  });
  ctrl.append(pre, presets);
  box.append(plotBox, ctrl);
  draw(true);
  return [box, 1800];
}

function renderCode(s) {
  const pre = el("pre");
  const hl = new Set(s.highlight || []);
  s.code.split("\n").forEach((t, n) => {
    const ln = el("span", "ln" + (hl.has(n + 1) ? " hl" : ""), t);
    if (s.tips && s.tips[n + 1]) ln.dataset.tip = s.tips[n + 1];
    if (s.marks && s.marks[n + 1]) ln.dataset.mark = s.marks[n + 1];
    pre.append(ln);
  });
  return [pre, 0];
}

function renderTerminal(s) {
  const box = el("div", "term"), caret = el("span", "caret"), max = s.max || 12;
  box.append(caret);
  const add = row => { box.insertBefore(row, caret); while (box.children.length > max + 1) box.firstChild.remove(); };
  let t = 400;
  s.lines.forEach(line => {
    if (line.cmd != null) {
      const row = el("div", "cmd");
      later(() => add(row), t);
      [...line.cmd].forEach(ch => { t += 45; later(() => row.textContent += ch, t); });
      t += 350;
    } else {
      const row = el("div", "out", line.out);
      later(() => add(row), t);
      t += 250;
    }
  });
  return [box, t];
}

function renderSplit(s) {
  const box = el("div", "split");
  let t = 0;
  s.panes.forEach(p => { const [node, ms] = RENDER[p.kind](p); box.append(node); t = Math.max(t, ms); });
  return [box, t];
}

const RENDER = {code: renderCode, terminal: renderTerminal, split: renderSplit, plot: renderPlot, square: renderSquare, explore: renderExplore};

function show(n) {
  clearPending(); clearTimeout(timer);
  i = Math.max(0, Math.min(LESSON.steps.length - 1, n));
  const s = LESSON.steps[i], stage = $("stage"), box = el("div", "step");
  box.append(el("div", "num", `PASSO ${i + 1} DE ${LESSON.steps.length}`), el("h2", null, s.title), prose("say", s.say));
  let anim = 0;
  if (s.show && RENDER[s.show.kind]) { const [node, ms] = RENDER[s.show.kind](s.show); box.append(node); anim = ms; }
  if (s.note) box.append(prose("note", s.note));
  stage.replaceChildren(box);
  fitObserver.disconnect(); fitObserver.observe(box);
  [...$("dots").children].forEach((d, k) => d.className = "dot" + (k < i ? " done" : k === i ? " on" : ""));
  $("count").textContent = `${i + 1} / ${LESSON.steps.length}`;
  $("prev").disabled = i === 0;
  $("next").disabled = i === LESSON.steps.length - 1;
  if (playing) schedule(anim + 2500 + 45 * (s.say || "").length);
}

function schedule(ms) {
  const bar = $("bar");
  bar.classList.remove("run"); bar.style.width = "0"; void bar.offsetWidth;
  bar.classList.add("run"); bar.style.transitionDuration = ms + "ms"; bar.style.width = "100%";
  timer = setTimeout(() => i < LESSON.steps.length - 1 ? show(i + 1) : setPlaying(false), ms);
}

function setPlaying(on) {
  playing = on;
  $("play").textContent = on ? "❚❚ Pausar" : "▶ Play";
  clearTimeout(timer);
  const bar = $("bar"); bar.classList.remove("run"); bar.style.width = "0";
  if (on) show(i === LESSON.steps.length - 1 ? 0 : i);
}

function fit() {
  const stage = $("stage"), box = stage.firstElementChild;
  if (!box) return;
  const cs = getComputedStyle(stage);
  const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const k = Math.min(1, h / box.scrollHeight, w / box.scrollWidth);
  box.style.scale = k < 1 ? k : "";
  if (k < 1) box.dataset.fit = k.toFixed(3); else delete box.dataset.fit;
}
const fitObserver = new ResizeObserver(fit);
addEventListener("resize", fit);

document.addEventListener("mouseover", e => {
  const t = e.target.closest("[data-tip]"), tip = $("tip");
  if (!t || !t.dataset.tip) tip.hidden = true;
  else {
    tip.textContent = t.dataset.tip; tip.hidden = false;
    const r = t.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + "px";
    tip.style.top = (r.bottom + h + 8 < innerHeight ? r.bottom + 6 : Math.max(8, r.top - h - 6)) + "px";
  }
  // a code line and the part of the drawing it computes light up together
  const m = e.target.closest("[data-mark]");
  document.querySelectorAll(".lit").forEach(x => x.classList.remove("lit"));
  if (m) $("stage").querySelectorAll(`[data-mark="${m.dataset.mark}"]`).forEach(x => x.classList.add("lit"));
});

document.title = LESSON.title;
$("title").textContent = LESSON.title;
$("subtitle").textContent = LESSON.subtitle || "";
LESSON.steps.forEach((s, k) => {
  const d = el("button", "dot"); d.title = s.title; d.onclick = () => show(k); $("dots").append(d);
});
$("prev").onclick = () => show(i - 1);
$("next").onclick = () => show(i + 1);
$("play").onclick = () => setPlaying(!playing);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") show(i + 1);
  else if (e.key === "ArrowLeft") show(i - 1);
  else if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
});
show(0);
</script>
</body>
