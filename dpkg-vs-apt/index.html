<!-- Only this block changes per lesson. Escape "</" as "<\/" inside strings. -->
<script id="lesson" type="application/json">
{
  "title": "dpkg vs apt",
  "subtitle": "Two layers of the same machine: apt plans and fetches, dpkg installs. Real output from Ubuntu 24.04 (apt 2.8.3, dpkg 1.22.6).",
  "steps": [
    {"title": "Not rivals: apt calls dpkg",
     "say": "`dpkg` installs the `.deb` files you hand it. `apt` sits on top: it finds packages, works out their [[dependencies|Other packages a package needs, listed in its Depends: field.]], downloads them, then runs `dpkg` itself. Hover any box.",
     "show": {"kind": "split", "panes": [
       {"kind": "stack", "hl": ["apt", "dpkg"], "flows": [["you>apt", "apt install X", 0, 140, 108], ["apt>dpkg", "runs dpkg", 0, 170, 228]]},
       {"kind": "terminal", "lines": [
         {"cmd": "apt-config dump | grep Dir::Bin::dpkg"},
         {"out": "Dir::Bin::dpkg \"/usr/bin/dpkg\";"}]}]},
     "note": "That config key is the dpkg binary apt runs for every install and removal."},

    {"title": "A .deb is a box with a label",
     "say": "A `.deb` holds the files plus a control file. `Depends:` is the line that matters: `dpkg` checks it, `apt` acts on it. `apt download` fetches a `.deb` without installing it, no root needed.",
     "show": {"kind": "split", "panes": [
       {"kind": "stack", "hl": ["repo", "lists"], "flows": [["repo>lists", "fortune-mod .deb", 0, 500, 108]]},
       {"kind": "terminal", "lines": [
         {"cmd": "apt download fortune-mod"},
         {"out": "Fetched 32.7 kB in 1s (37.4 kB/s)"},
         {"cmd": "dpkg-deb --info fortune-mod_1%3a1.99.1-7.3build1_amd64.deb"},
         {"out": " Package: fortune-mod"},
         {"out": " Version: 1:1.99.1-7.3build1"},
         {"out": " Depends: libc6 (>= 2.34), librecode0 (>= 3.6)"},
         {"out": " Recommends: fortunes-min | fortune-cookie-db"},
         {"out": " Description: provides fortune cookies on demand"}]}]},
     "note": "On this machine libc6 is installed, librecode0 is not. Keep watching librecode0."},

    {"title": "dpkg alone: unpacks, then stops",
     "say": "Hand the `.deb` straight to `dpkg`. It unpacks the files, sees `librecode0` is missing, and refuses to [[configure|Run the package's setup scripts and mark it fully installed. Unpacked but unconfigured means the files are on disk but the package is not usable yet.]] it. It does not go and fetch `librecode0`: that is not its job.",
     "show": {"kind": "split", "panes": [
       {"kind": "stack", "bad": ["dpkg", "status"], "sub": {"status": "fortune-mod  iU"},
        "flows": [["you>dpkg", "dpkg -i fortune-mod...deb", 0, 140, 108], ["dpkg>fs", "files unpacked", 0, 170, 348], ["dpkg>status", "iU", 1, 290, 342]]},
       {"kind": "terminal", "lines": [
         {"cmd": "sudo dpkg -i fortune-mod_1%3a1.99.1-7.3build1_amd64.deb"},
         {"out": "Unpacking fortune-mod (1:1.99.1-7.3build1) ..."},
         {"out": "dpkg: dependency problems prevent configuration of fortune-mod:"},
         {"out": " fortune-mod depends on librecode0 (>= 3.6); however:"},
         {"out": "  Package librecode0 is not installed."},
         {"out": "dpkg: error processing package fortune-mod (--install):"},
         {"out": " dependency problems - leaving unconfigured"},
         {"cmd": "dpkg -l fortune-mod | tail -1"},
         {"out": "iU  fortune-mod  1:1.99.1-7.3build1  amd64  provides fortune cookies on demand"}]}]},
     "note": "Run in a throwaway root (dpkg --root=...) so the real system stayed clean; the messages are dpkg's own. iU: [[i|Desired state: install.]] = you want it installed, [[U|Current state: Unpacked. Files are on disk, setup has not run.]] = only unpacked. A healthy package shows ii."},

    {"title": "Doing apt's job by hand",
     "say": "To finish with `dpkg` only, you fetch the dependency yourself, install it, then tell `dpkg` to configure whatever is still waiting. You did the dependency solving in your head.",
     "show": {"kind": "split", "panes": [
       {"kind": "stack", "ok": ["status"], "hl": ["dpkg"], "sub": {"status": "librecode0 ii, fortune-mod ii"},
        "flows": [["you>dpkg", "you pick the order", 0, 140, 108], ["dpkg>status", "iU → ii", 0, 290, 342]]},
       {"kind": "terminal", "lines": [
         {"cmd": "sudo dpkg -i librecode0_3.6-26_amd64.deb"},
         {"out": "Setting up librecode0:amd64 (3.6-26) ..."},
         {"cmd": "dpkg -l fortune-mod librecode0 | tail -2"},
         {"out": "iU  fortune-mod       1:1.99.1-7.3build1"},
         {"out": "ii  librecode0:amd64  3.6-26"},
         {"cmd": "sudo dpkg --configure -a"},
         {"out": "Setting up fortune-mod (1:1.99.1-7.3build1) ..."},
         {"cmd": "dpkg -l fortune-mod | tail -1"},
         {"out": "ii  fortune-mod       1:1.99.1-7.3build1"}]}]},
     "note": "Installing librecode0 did not fix fortune-mod on its own: it stayed iU until --configure -a."},

    {"title": "apt: the same install, one command",
     "say": "`apt` reads `Depends:` from its index, adds `librecode0` and the recommended `fortunes-min`, downloads all three, and runs `dpkg` on them dependencies first. `-s` simulates, so this ran without root.",
     "show": {"kind": "split", "panes": [
       {"kind": "stack", "ok": ["status"], "hl": ["apt", "lists", "dpkg"], "sub": {"status": "3 packages ii"},
        "flows": [["you>apt", "apt install fortune-mod", 0, 140, 108], ["apt>lists", "solve deps", 0, 290, 226], ["repo>lists", "3 .debs", 0, 500, 108], ["apt>dpkg", "Inst, Conf", 0, 170, 228], ["dpkg>status", "ii", 0, 290, 342]]},
       {"kind": "terminal", "lines": [
         {"cmd": "apt-get -s install fortune-mod"},
         {"out": "The following NEW packages will be installed:"},
         {"out": "  fortune-mod fortunes-min librecode0"},
         {"out": "Inst librecode0 (3.6-26 Ubuntu:24.04/noble [amd64])"},
         {"out": "Inst fortune-mod (1:1.99.1-7.3build1 Ubuntu:24.04/noble [amd64])"},
         {"out": "Inst fortunes-min (1:1.99.1-7.3build1 Ubuntu:24.04/noble [all])"},
         {"out": "Conf librecode0 (3.6-26 Ubuntu:24.04/noble [amd64])"},
         {"out": "Conf fortune-mod (1:1.99.1-7.3build1 Ubuntu:24.04/noble [amd64])"},
         {"out": "Conf fortunes-min (1:1.99.1-7.3build1 Ubuntu:24.04/noble [all])"}]}]},
     "note": "Inst = dpkg unpacks, Conf = dpkg configures. librecode0 comes first because fortune-mod needs it."},

    {"title": "Got a .deb file? Still use apt",
     "say": "Give `apt` the path, with `./` so it reads it as a file. It uses your `.deb` and still fetches the dependencies from the repos. Already stuck at `iU` from a raw `dpkg -i`? `sudo apt -f install` fetches what is missing and finishes the job.",
     "show": {"kind": "split", "panes": [
       {"kind": "stack", "ok": ["status"], "hl": ["apt", "dpkg"],
        "flows": [["you>apt", "apt install ./fortune-mod...deb", 0, 140, 108], ["repo>lists", "librecode0", 0, 500, 108], ["apt>dpkg", "Inst, Conf", 0, 170, 228]]},
       {"kind": "terminal", "lines": [
         {"cmd": "apt-get -s install ./fortune-mod_1%3a1.99.1-7.3build1_amd64.deb"},
         {"out": "  fortune-mod fortunes-min librecode0"},
         {"out": "Inst librecode0 (3.6-26 Ubuntu:24.04/noble [amd64])"},
         {"out": "Inst fortune-mod (1:1.99.1-7.3build1 Ubuntu:24.04/noble, local-deb [amd64])"},
         {"out": "Inst fortunes-min (1:1.99.1-7.3build1 Ubuntu:24.04/noble [all])"}]}]},
     "note": "local-deb marks the package taken from your file instead of the repo."},

    {"title": "Removing: dpkg refuses, apt cascades",
     "say": "`dpkg -r` will not remove a package something else depends on. `apt remove` lists every package that has to go with it and asks before acting.",
     "show": {"kind": "split", "panes": [
       {"kind": "stack", "bad": ["dpkg"], "hl": ["apt"],
        "flows": [["you>dpkg", "dpkg -r librecode0", 1, 140, 108], ["apt>dpkg", "Remv x4", 0, 170, 228]]},
       {"kind": "terminal", "lines": [
         {"cmd": "sudo dpkg -r librecode0"},
         {"out": "dpkg: dependency problems prevent removal of librecode0:amd64:"},
         {"out": " fortune-mod depends on librecode0 (>= 3.6)."},
         {"out": " dependency problems - not removing"},
         {"cmd": "apt-get -s remove libtext-charwidth-perl"},
         {"out": "The following packages will be REMOVED:"},
         {"out": "  debconf-i18n libtext-charwidth-perl libtext-wrapi18n-perl ubuntu-minimal"},
         {"out": "0 upgraded, 0 newly installed, 4 to remove and 192 not upgraded."}]}]},
     "note": "The second example uses a package this machine really has: removing one small perl library would take ubuntu-minimal with it. Read that list before saying yes."},

    {"title": "Asking questions: two databases",
     "say": "`dpkg` answers about what is installed on this machine, from its database. `apt` answers about what the repos offer, from its index.",
     "show": {"kind": "split", "panes": [
       {"kind": "stack", "hl": ["status", "lists"],
        "flows": [["dpkg>status", "what's here?", 0, 290, 342], ["apt>lists", "what exists?", 0, 290, 226]]},
       {"kind": "terminal", "lines": [
         {"cmd": "dpkg -S /usr/bin/ls"},
         {"out": "coreutils: /usr/bin/ls"},
         {"cmd": "dpkg -L coreutils | grep -E 'bin/(ls|cat)$'"},
         {"out": "/usr/bin/cat"},
         {"out": "/usr/bin/ls"},
         {"cmd": "apt-cache policy librecode0"},
         {"out": "librecode0:"},
         {"out": "  Installed: (none)"},
         {"out": "  Candidate: 3.6-26"}]}]},
     "note": "dpkg -S: which package owns this file. dpkg -L: which files this package put down. apt-cache policy: installed version vs the version apt would install."},

    {"title": "Cheat sheet",
     "say": "Change the system with `apt`. Inspect it with `dpkg`. Reach for raw `dpkg -i` only when you know every dependency is already there.",
     "show": {"kind": "split", "panes": [
       {"kind": "code", "highlight": [2, 3, 4, 5], "code": "# change things: apt\nsudo apt install fortune-mod\nsudo apt install ./some.deb\nsudo apt remove fortune-mod\nsudo apt -f install          # finish a stuck iU\n# what's on this machine: dpkg\ndpkg -l | grep fortune       # installed + state\ndpkg -L fortune-mod          # files it installed\ndpkg -S /usr/bin/ls          # who owns this file\n# what the repos have: apt\napt-cache policy librecode0  # installed vs candidate\napt search fortune",
        "tips": {"5": "--fix-broken: installs the dependencies that unconfigured packages are waiting for, then configures them.", "7": "First column pair: ii healthy, iU unpacked only, rc removed but config files kept."}},
       {"kind": "stack", "hl": ["apt", "dpkg"], "flows": [["you>apt", "change", 0, 140, 108], ["apt>dpkg", "runs dpkg", 0, 170, 228], ["dpkg>status", "inspect", 0, 290, 342]]}]}}
  ]
}
</script>

<script>
const LESSON = JSON.parse(document.getElementById("lesson").textContent);
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const svgEl = (tag, attrs) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};
// `inline code` and [[word|hover detail]] in prose, everything else as text
const prose = (cls, s) => {
  const p = el("p", cls);
  String(s).split(/(`[^`]+`|\[\[[^\]]+\]\])/).forEach(part => {
    if (part.startsWith("`") && part.endsWith("`") && part.length > 1) p.append(el("code", null, part.slice(1, -1)));
    else if (part.startsWith("[[") && part.endsWith("]]")) {
      const [word, tip] = part.slice(2, -2).split("|");
      const t = el("span", "tip", word); t.dataset.tip = tip || ""; p.append(t);
    } else p.append(part);
  });
  return p;
};

let i = 0, playing = false, timer = null, pending = [];
const later = (fn, ms) => pending.push(setTimeout(fn, ms));
const clearPending = () => { pending.forEach(clearTimeout); pending = []; };

function renderCode(s) {
  const pre = el("pre");
  const hl = new Set(s.highlight || []);
  s.code.split("\n").forEach((t, n) => {
    const ln = el("span", "ln" + (hl.has(n + 1) ? " hl" : ""), t);
    if (s.tips && s.tips[n + 1]) ln.dataset.tip = s.tips[n + 1];
    pre.append(ln);
  });
  return [pre, 0];
}

// LCS line diff -> [{op: "same"|"del"|"add", t}]
function diffLines(a, b) {
  const m = a.length, n = b.length, L = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  for (let x = m - 1; x >= 0; x--) for (let y = n - 1; y >= 0; y--)
    L[x][y] = a[x] === b[y] ? L[x + 1][y + 1] + 1 : Math.max(L[x + 1][y], L[x][y + 1]);
  const out = []; let x = 0, y = 0;
  while (x < m && y < n) {
    if (a[x] === b[y]) { out.push({op: "same", t: a[x]}); x++; y++; }
    else if (L[x + 1][y] >= L[x][y + 1]) out.push({op: "del", t: a[x++]});
    else out.push({op: "add", t: b[y++]});
  }
  while (x < m) out.push({op: "del", t: a[x++]});
  while (y < n) out.push({op: "add", t: b[y++]});
  return out;
}

function renderDiff(s) {
  const wrap = el("div"), label = el("div", "diff-label", "before"), pre = el("pre");
  wrap.append(label, pre);
  const ops = diffLines(s.before.split("\n"), s.after.split("\n"));
  const spans = ops.map(o => {
    const sp = el("span", "ln", o.t);
    if (o.op === "add") sp.style.display = "none";
    pre.append(sp);
    return sp;
  });
  later(() => {
    label.textContent = "before → after";
    ops.forEach((o, k) => { if (o.op === "del") spans[k].classList.add("del"); });
  }, 900);
  later(() => {
    label.textContent = "after";
    ops.forEach((o, k) => {
      if (o.op === "del") spans[k].classList.add("gone");
      if (o.op === "add") { spans[k].style.display = ""; spans[k].classList.add("add"); }
    });
  }, 2100);
  return [wrap, 2600];
}

// keeps the last `max` rows (default 12), like a real terminal, so it never grows past the stage
function renderTerminal(s) {
  const box = el("div", "term"), caret = el("span", "caret"), max = s.max || 12;
  box.append(caret);
  const add = row => { box.insertBefore(row, caret); while (box.children.length > max + 1) box.firstChild.remove(); };
  let t = 400;
  s.lines.forEach(line => {
    if (line.cmd != null) {
      const row = el("div", "cmd");
      later(() => add(row), t);
      [...line.cmd].forEach(ch => { t += 45; later(() => row.textContent += ch, t); });
      t += 350;
    } else {
      const row = el("div", "out", line.out);
      later(() => add(row), t);
      t += 250;
    }
  });
  return [box, t];
}

function renderDiagram(s) {
  const W = 170, H = 52, GX = 70, GY = 60, PAD = 10;
  const cols = Math.max(...s.nodes.map(n => n.col)) + 1, rows = Math.max(...s.nodes.map(n => n.row)) + 1;
  const vw = cols * W + (cols - 1) * GX + 2 * PAD, vh = rows * H + (rows - 1) * GY + 2 * PAD;
  const svg = svgEl("svg", {class: "diagram", width: vw, viewBox: `0 0 ${vw} ${vh}`});
  const defs = svgEl("defs", {}), mk = svgEl("marker", {id: "arr", viewBox: "0 0 10 10", refX: 9, refY: 5,
    markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse"});
  mk.append(svgEl("path", {d: "M0,0 L10,5 L0,10 z"})); defs.append(mk); svg.append(defs);
  const pos = {};
  s.nodes.forEach(n => pos[n.id] = {x: PAD + n.col * (W + GX), y: PAD + n.row * (H + GY)});
  let t = 0;
  s.nodes.forEach(n => {
    const g = svgEl("g", {class: "node" + (n.hl ? " hl" : ""), style: `animation-delay:${t}ms;transform-origin:${pos[n.id].x + W / 2}px ${pos[n.id].y + H / 2}px`});
    if (n.tip) g.dataset.tip = n.tip;
    g.append(svgEl("rect", {x: pos[n.id].x, y: pos[n.id].y, width: W, height: H, rx: 10}));
    const tx = svgEl("text", {x: pos[n.id].x + W / 2, y: pos[n.id].y + H / 2 + 5, "text-anchor": "middle"});
    tx.textContent = n.label; g.append(tx); svg.append(g);
    t += 250;
  });
  (s.edges || []).forEach(e => {
    const a = pos[e.from], b = pos[e.to];
    const ac = {x: a.x + W / 2, y: a.y + H / 2}, bc = {x: b.x + W / 2, y: b.y + H / 2};
    // clip the line to the box edges so the arrowhead touches the border
    const clip = (c, o) => {
      const dx = o.x - c.x, dy = o.y - c.y;
      const k = Math.min(dx ? (W / 2) / Math.abs(dx) : Infinity, dy ? (H / 2) / Math.abs(dy) : Infinity);
      return {x: c.x + dx * k, y: c.y + dy * k};
    };
    const p = clip(ac, bc), q = clip(bc, ac);
    const len = Math.hypot(q.x - p.x, q.y - p.y);
    const line = svgEl("path", {class: "edge draw" + (e.hl ? " hl" : ""), d: `M${p.x},${p.y} L${q.x},${q.y}`,
      "marker-end": "url(#arr)", style: `stroke-dasharray:${len};stroke-dashoffset:${len};animation-delay:${t}ms`});
    svg.insertBefore(line, svg.querySelector(".node"));
    if (e.label) {
      const lb = svgEl("text", {class: "elabel", x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 - 7,
        "text-anchor": "middle", style: `animation-delay:${t + 400}ms`});
      lb.textContent = e.label; svg.append(lb);
    }
    t += 500;
  });
  return [svg, t + 400];
}

function renderSplit(s) {
  const box = el("div", "split");
  let t = 0;
  s.panes.forEach(p => { const [node, ms] = RENDER[p.kind](p); box.append(node); t = Math.max(t, ms); });
  return [box, t];
}

// fixed picture of the apt/dpkg stack; each step lights boxes and draws flows
const BOX = {
  you:    {x: 50,  y: 12,  w: 160, h: 62, t: "you", s: "$ shell",
           tip: "You type a command. You can talk to apt, or skip it and hand a .deb straight to dpkg."},
  repo:   {x: 330, y: 12,  w: 320, h: 62, t: "repositories", s: "archive.ubuntu.com",
           tip: "Servers listed in /etc/apt/sources.list.d/. They hold thousands of .deb files plus an index of them."},
  apt:    {x: 50,  y: 132, w: 220, h: 62, t: "apt / apt-get", s: "solve, fetch, order",
           tip: "High-level tool. Reads the index, works out every dependency, downloads the .debs, then runs dpkg on them in the right order. apt is the friendly CLI; apt-get/apt-cache are the older script-stable ones."},
  lists:  {x: 330, y: 132, w: 320, h: 62, t: "apt index + .deb cache", s: "/var/lib/apt/lists",
           tip: "`apt update` refreshes /var/lib/apt/lists (what exists in the repos). Downloaded .debs land in /var/cache/apt/archives."},
  dpkg:   {x: 50,  y: 252, w: 220, h: 62, t: "dpkg", s: "unpack + configure",
           tip: "Low-level tool. Installs exactly the .deb files you give it. Checks dependencies, but never downloads anything to fix them."},
  status: {x: 330, y: 252, w: 320, h: 62, t: "dpkg database", s: "/var/lib/dpkg/status",
           tip: "The record of every installed package and its state (ii, iU, rc...). Both dpkg and apt read it; only dpkg writes it."},
  fs:     {x: 20,  y: 372, w: 630, h: 58, t: "files on disk", s: "/usr/games/fortune, /usr/lib/...",
           tip: "Where the package's files end up after dpkg unpacks them. `dpkg -L pkg` lists them."}
};
const WIRE = {
  "you>apt":    "M130,74 V132",
  "apt>dpkg":   "M160,194 V252",
  "dpkg>fs":    "M160,314 V372",
  "apt>lists":  "M270,163 H330",
  "repo>lists": "M490,74 V132",
  "dpkg>status":"M270,283 H330",
  "you>dpkg":   "M50,43 H24 V283 H50"
};
function renderStack(s) {
  const svg = svgEl("svg", {class: "stack", viewBox: "0 0 670 440"});
  const defs = svgEl("defs", {}), mk = svgEl("marker", {id: "sarr", viewBox: "0 0 10 10", refX: 8, refY: 5,
    markerWidth: 4, markerHeight: 4, orient: "auto"});
  mk.append(svgEl("path", {d: "M0,0 L10,5 L0,10 z"})); defs.append(mk); svg.append(defs);
  Object.values(WIRE).forEach(d => svg.append(svgEl("path", {class: "wire", d})));
  const cls = id => (s.bad || []).includes(id) ? " bad" : (s.ok || []).includes(id) ? " ok" : (s.hl || []).includes(id) ? " hl" : "";
  Object.entries(BOX).forEach(([id, b]) => {
    const g = svgEl("g", {class: "box" + cls(id)});
    g.dataset.tip = b.tip;
    g.append(svgEl("rect", {x: b.x, y: b.y, width: b.w, height: b.h, rx: 12}));
    const t = svgEl("text", {class: "t", x: b.x + 14, y: b.y + 26}); t.textContent = b.t;
    const sub = svgEl("text", {class: "s", x: b.x + 14, y: b.y + 49}); sub.textContent = (s.sub || {})[id] || b.s;
    g.append(t, sub); svg.append(g);
  });
  let t = 300;
  (s.flows || []).forEach(f => {
    const [key, label, bad, lx, ly] = f;
    const p = svgEl("path", {class: "flow" + (bad ? " bad" : ""), d: WIRE[key], style: `opacity:0;animation-delay:0s`});
    later(() => p.style.opacity = 1, t);
    svg.append(p);
    if (label) {
      const lb = svgEl("text", {class: "flabel" + (bad ? " bad" : ""), x: lx, y: ly, style: `animation-delay:${t}ms`});
      lb.textContent = label; svg.append(lb);
    }
    t += 600;
  });
  return [svg, t];
}

const RENDER = {stack: renderStack, code: renderCode, diff: renderDiff, terminal: renderTerminal, diagram: renderDiagram, split: renderSplit};

function show(n) {
  clearPending(); clearTimeout(timer);
  i = Math.max(0, Math.min(LESSON.steps.length - 1, n));
  const s = LESSON.steps[i], stage = $("stage"), box = el("div", "step");
  box.append(el("div", "num", `STEP ${i + 1} OF ${LESSON.steps.length}`), el("h2", null, s.title), prose("say", s.say));
  let anim = 0;
  if (s.show && RENDER[s.show.kind]) { const [node, ms] = RENDER[s.show.kind](s.show); box.append(node); anim = ms; }
  if (s.note) box.append(prose("note", s.note));
  stage.replaceChildren(box);
  [...$("dots").children].forEach((d, k) => d.className = "dot" + (k < i ? " done" : k === i ? " on" : ""));
  $("count").textContent = `${i + 1} / ${LESSON.steps.length}`;
  $("prev").disabled = i === 0;
  $("next").disabled = i === LESSON.steps.length - 1;
  if (playing) schedule(anim + 2500 + 45 * (s.say || "").length);
}

function schedule(ms) {
  const bar = $("bar");
  bar.classList.remove("run"); bar.style.width = "0"; void bar.offsetWidth;
  bar.classList.add("run"); bar.style.transitionDuration = ms + "ms"; bar.style.width = "100%";
  timer = setTimeout(() => i < LESSON.steps.length - 1 ? show(i + 1) : setPlaying(false), ms);
}

function setPlaying(on) {
  playing = on;
  $("play").textContent = on ? "❚❚ Pause" : "▶ Play";
  clearTimeout(timer);
  const bar = $("bar"); bar.classList.remove("run"); bar.style.width = "0";
  if (on) show(i === LESSON.steps.length - 1 ? 0 : i);
}

document.addEventListener("mouseover", e => {
  const t = e.target.closest("[data-tip]"), tip = $("tip");
  if (!t || !t.dataset.tip) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  const r = t.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + "px";
  tip.style.top = (r.bottom + h + 8 < innerHeight ? r.bottom + 6 : Math.max(8, r.top - h - 6)) + "px";
});

document.title = LESSON.title;
$("title").textContent = LESSON.title;
$("subtitle").textContent = LESSON.subtitle || "";
LESSON.steps.forEach((s, k) => {
  const d = el("button", "dot"); d.title = s.title; d.onclick = () => show(k); $("dots").append(d);
});
$("prev").onclick = () => show(i - 1);
$("next").onclick = () => show(i + 1);
$("play").onclick = () => setPlaying(!playing);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") show(i + 1);
  else if (e.key === "ArrowLeft") show(i - 1);
  else if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
});
show(0);
</script>
