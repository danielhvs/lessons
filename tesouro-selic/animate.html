<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesouro Selic, animado</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1d1f; --muted: #6b6b70; --line: #d8d6d0; --panel: #f0eee8;
    --a: #e8590c; --b: #1c7ed6; --c: #2b8a3e; --d: #9c36b5; --r: #d6336c; --e: #0c8599;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141417; --fg: #ececf0; --muted: #9a9aa3; --line: #34343b; --panel: #1f1f24;
      --a: #ff922b; --b: #4dabf7; --c: #51cf66; --d: #da77f2; --r: #f06595; --e: #3bc9db;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: 6px; gap: 6px; }
  #stage { flex: 1; min-height: 0; width: 100%; display: block; }
  #stage text { white-space: pre; fill: var(--fg); }
  #caption { font-size: 22px; line-height: 1.35; min-height: 2.7em; padding: 4px 10px;
    border-left: 4px solid var(--d); background: var(--panel); border-radius: 4px; }
  #caption b { color: var(--d); }
  #terms { font-size: 16px; line-height: 1.4; min-height: 4.2em; padding: 2px 10px; color: var(--muted); }
  #terms b { color: var(--fg); }
  #bar { display: flex; align-items: center; gap: 6px; font-size: 16px; flex-wrap: wrap; }
  #bar button { font: inherit; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #bar button:not(.spd) { width: 60px; padding: 4px 0; text-align: center; letter-spacing: -3px; }
  #bar button[data-k]::after { content: attr(data-k); margin-left: 6px; font-size: 13px; letter-spacing: 0; opacity: .7; }
  #bar button:disabled { opacity: .4; cursor: default; }
  #bar button.on { border-color: var(--d); color: var(--d); }
  #timeline { flex: 1; min-width: 200px; height: 22px; display: flex; gap: 3px;
    cursor: pointer; position: relative; }
  #timeline .seg { position: relative; background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; overflow: hidden; }
  #timeline .fill { position: absolute; inset: 0; width: 0; background: var(--d); opacity: .55; }
  #where { text-align: center; font-size: 24px; font-weight: 700; padding: 2px 0; }
  #links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 16px; }
  #links a { color: var(--b); }
  #m { position: absolute; width: 0; height: 0; visibility: hidden; }
  #m text { white-space: pre; }
</style>
</head>
<body>
<nav id="links"><a href="../">← todas as aulas</a><a href="index.html">lição</a></nav>
<div id="where"></div>
<svg id="stage" viewBox="0 0 1600 820" preserveAspectRatio="xMidYMid meet"></svg>
<div id="caption"></div>
<div id="terms"></div>
<div id="bar">
  <button id="restart" data-k="H" title="recomeçar (H)">⏮</button>
  <button id="prev" data-k="h" title="cena anterior (h, ←)">◀◀</button>
  <button id="play" data-k="SPC" title="tocar / pausar (espaço)">▶</button>
  <button id="next" data-k="l" title="próxima cena (l, →)">▶▶</button>
  <button id="replay" data-k="r" title="repetir esta cena (r)">↻</button>
  <button class="spd" data-s="0.5" data-k="1" title="0.5x (1)">0.5x</button>
  <button class="spd on" data-s="1" data-k="2" title="1x (2)">1x</button>
  <button class="spd" data-s="2" data-k="3" title="2x (3)">2x</button>
  <div id="timeline"></div>
</div>
<svg id="m"><text id="mt"></text></svg>
<script>
const COL = { a: "var(--a)", b: "var(--b)", c: "var(--c)", d: "var(--d)", r: "var(--r)",
  m: "var(--muted)", l: "var(--line)", f: "var(--fg)", p: "var(--panel)" };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => (t = clamp(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const P = (t, a, b) => ease((t - a) / (b - a));
const L = (a, b, p) => a + (b - a) * p;
const num = v => (v < -1e-9 ? "−" : "") + Math.abs(v).toFixed(1);

let out = [];
const add = s => out.push(s);

// tokens: [text, colorKey?, bold?]; text may hold &lt; etc.
const span = ([s, c, w]) => `<tspan${c ? ` fill="${COL[c]}"` : ""}${w ? ' font-weight="700"' : ""}>${s}</tspan>`;
const mt = document.getElementById("mt"), wcache = {};
function width(tokens, size) {
  const k = size + "|" + JSON.stringify(tokens);
  if (!(k in wcache)) {
    mt.setAttribute("font-size", size);
    mt.innerHTML = tokens.map(span).join("");
    wcache[k] = mt.getComputedTextLength();
  }
  return wcache[k];
}
function text(x, y, tokens, size, o = {}) {
  if (typeof tokens === "string") tokens = [[tokens, o.c]];
  const op = o.op ?? 1;
  if (op <= 0.001) return;
  add(`<text x="${x}" y="${y}" font-size="${size}" text-anchor="${o.anchor || "start"}" opacity="${op}"${o.w ? ' font-weight="700"' : ""}>${tokens.map(span).join("")}</text>`);
}
// lays tokens out left to right centered on cx, returns each token's center x
function row(cx, y, tokens, size, o = {}) {
  const ws = tokens.map(t => width([t], size));
  let x = cx - ws.reduce((a, b) => a + b, 0) / 2;
  const centers = [];
  tokens.forEach((t, i) => {
    const op = Array.isArray(o.op) ? o.op[i] : o.op ?? 1;
    text(x, y, [t], size, { op });
    centers.push(x + ws[i] / 2);
    x += ws[i];
  });
  return centers;
}
const brl = (v, d = 2) => "R$ " + v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const pc = v => (v < -1e-9 ? "−" : "+") + Math.abs(v).toFixed(1).replace(".", ",") + "%";
const tx = (r, d = 2) => (r * 100).toFixed(d).replace(".", ",") + "%";
// chart: x from 0 to NX, value from V0 to VM (set by the page, with GRID and TICKS); RX is the side panel
const CH = { x0: 150, y0: 690, w: 860, h: 580 }, RX = 1070;
const X = x => CH.x0 + x / NX * CH.w, Y = v => CH.y0 - (v - V0) / (VM - V0) * CH.h;
function axes(ylab) {
  for (const v of GRID) {
    add(`<line x1="${CH.x0}" x2="${CH.x0 + CH.w}" y1="${Y(v)}" y2="${Y(v)}" stroke="${COL.l}" stroke-width="2"/>`);
    text(CH.x0 - 14, Y(v) + 9, [[v.toLocaleString("pt-BR"), "m"]], 26, { anchor: "end" });
  }
  add(`<line x1="${CH.x0}" x2="${CH.x0 + CH.w}" y1="${CH.y0}" y2="${CH.y0}" stroke="${COL.m}" stroke-width="3"/>`);
  for (const [x, l] of TICKS) text(X(x), CH.y0 + 38, [[l, "m"]], 26, { anchor: "middle" });
  text(CH.x0, 50, [[ylab, "m"]], 26);
}
function path(fn, a, b, color, o = {}) {
  if (b - a < 1e-6) return;
  const pts = [];
  for (let x = a; x < b; x += NX / 200) pts.push(`${X(x).toFixed(1)},${Y(fn(x)).toFixed(1)}`);
  pts.push(`${X(b).toFixed(1)},${Y(fn(b)).toFixed(1)}`);
  add(`<polyline points="${pts.join(" ")}" fill="none" stroke="${COL[color]}" stroke-width="${o.sw || 6}" stroke-linejoin="round" stroke-linecap="round"${o.dash ? ` stroke-dasharray="${o.dash}"` : ""}/>`);
}
const dot = (x, y, color, r = 12, op = 1) => add(`<circle cx="${x}" cy="${y}" r="${r}" fill="${COL[color]}" opacity="${op}"/>`);

// rate on the left end, price on the right end: one goes up, the other goes down
function seesaw(t, r0, n, formula, pfx) {
  const r = r0 + .01 * (P(t, 3, 5) - 2 * P(t, 6.5, 8.5) + P(t, 10.2, 11.6)), p = 1000 / Math.pow(1 + r, n);
  row(800, 120, formula, 56);
  const ang = (r - r0) * 1400, a = ang * Math.PI / 180, px = 800, py = 600, h = 430;
  add(`<polygon points="${px},${py} ${px - 70},${py + 130} ${px + 70},${py + 130}" fill="${COL.m}" opacity=".5"/>`);
  add(`<line x1="${px - 380}" x2="${px + 380}" y1="${py + 130}" y2="${py + 130}" stroke="${COL.m}" stroke-width="3"/>`);
  add(`<rect x="${px - h}" y="${py - 14}" width="${2 * h}" height="24" rx="12" fill="${COL.f}" opacity=".75" transform="rotate(${ang} ${px} ${py})"/>`);
  const lx = px - h * Math.cos(a), ly = py - h * Math.sin(a), rx = px + h * Math.cos(a), ry = py + h * Math.sin(a);
  text(lx, ly - 110, [["taxa de mercado", "m"]], 28, { anchor: "middle" });
  text(lx, ly - 40, [[pfx + tx(r), "a", 1]], 56, { anchor: "middle" });
  text(rx, ry - 110, [["preço do título", "m"]], 28, { anchor: "middle" });
  text(rx, ry - 40, [[brl(p), "b", 1]], 56, { anchor: "middle" });
  const d = (p * Math.pow(1 + r0, n) / 1000 - 1) * 100;
  if (Math.abs(d) > .05) text(rx, ry + 70, [[pc(d), d > 0 ? "c" : "r", 1]], 44, { anchor: "middle" });
}

// one scenario: xj years on the contracted curve, the market rate jumps from r0 to r2, then the path to maturity
function scen(t, r0, r2, xj, pfx, col, sell, hold) {
  const f0 = x => 1000 / Math.pow(1 + r0, NX - x), f2 = x => 1000 / Math.pow(1 + r2, NX - x);
  path(f0, 0, NX, "m", { dash: "3 14", sw: 4 });
  const x = xj * P(t, .5, 2.5), k = P(t, 3.5, 5.5), g = xj + (NX - xj) * P(t, 7, 10.5);
  const vx = t < 3.5 ? x : g, val = t < 3.5 ? f0(x) : g > xj ? f2(g) : L(f0(xj), f2(xj), k);
  path(f0, 0, x, "b");
  if (k > 0) add(`<line x1="${X(xj)}" x2="${X(xj)}" y1="${Y(f0(xj))}" y2="${Y(L(f0(xj), f2(xj), k))}" stroke="${COL[col]}" stroke-width="6" stroke-linecap="round"/>`);
  path(f2, xj, g, col);
  dot(X(NX), Y(1000), "c", 12);
  dot(X(vx), Y(val), "b", 14);
  text(RX, 180, [["taxa de mercado", "m"]], 28);
  text(RX, 245, [[pfx + tx(L(r0, r2, k)), "a", 1]], 56);
  text(RX, 335, [["seu título vale", "m"]], 28);
  text(RX, 400, [[brl(val), "b", 1]], 56);
  text(RX, 470, [[pc((f2(xj) / f0(xj) - 1) * 100) + " contra a curva", col, 1]], 34, { op: P(t, 5.5, 6.2) });
  text(RX, 570, [[sell]], 30, { op: P(t, 5.9, 6.6) });
  text(RX, 630, [[hold, "c", 1]], 30, { op: P(t, 10.5, 11.2) });
}

// real history: rate on top, price below, same x; D rows are [x, rate, price]
function realChart(t, D, c) {
  const XR = x => 150 + (x - c.x0) / (c.x1 - c.x0) * 850, YT = r => 300 - (r - c.r0) / (c.r1 - c.r0) * 210,
    YP = p => 700 - (p - c.p0) / (c.p1 - c.p0) * 300;
  const end = c.x0 + (c.x1 - c.x0) * clamp((t - .5) / 5.5), pts = D.filter(d => d[0] <= end);
  text(150, 50, [[c.rl, "a", 1]], 28);
  text(150, 372, [["preço de venda (R$)", "b", 1]], 28);
  for (const [r, l] of c.rg) {
    add(`<line x1="150" x2="1000" y1="${YT(r)}" y2="${YT(r)}" stroke="${COL.l}" stroke-width="2"/>`);
    text(136, YT(r) + 9, [[l, "m"]], 26, { anchor: "end" });
  }
  for (const p of c.pg) {
    add(`<line x1="150" x2="1000" y1="${YP(p)}" y2="${YP(p)}" stroke="${COL.l}" stroke-width="2"/>`);
    text(136, YP(p) + 9, [[p.toLocaleString("pt-BR"), "m"]], 26, { anchor: "end" });
  }
  for (const [x, l] of c.xt) text(XR(x), 750, [[l, "m"]], 26, { anchor: "middle" });
  const line = (fy, col) => add(`<polyline points="${pts.map(d => `${XR(d[0]).toFixed(1)},${fy(d).toFixed(1)}`).join(" ")}" fill="none" stroke="${COL[col]}" stroke-width="4" stroke-linejoin="round"/>`);
  line(d => YT(d[1]), "a"); line(d => YP(d[2]), "b");
  c.marks.forEach(([x, r, p, l1, l2, col, at], i) => {
    const op = P(t, at, at + .7);
    add(`<line x1="${XR(x)}" x2="${XR(x)}" y1="70" y2="710" stroke="${COL.m}" stroke-width="2" stroke-dasharray="6 8" opacity="${op}"/>`);
    dot(XR(x), YT(r), "a", 11, op); dot(XR(x), YP(p), col, 13, op);
    text(RX - 20, 170 + i * 130, [[l1, "m"]], 28, { op });
    text(RX - 20, 215 + i * 130, [[l2, col, 1]], 34, { op });
  });
}

// bullet list, one line per item: [text, color]
function bullets(t, items) {
  items.forEach(([s, c], i) => {
    const op = P(t, .5 + i * .8, 1.2 + i * .8);
    dot(150, 148 + i * 92, c, 13, op);
    text(190, 160 + i * 92, [[s]], 36, { op });
  });
}

// x in months, value in R$: R$ 10.000 invested for one year
const NX = 12, V0 = 10000, VM = 11600, GRID = [10400, 10800, 11200, 11600],
  TICKS = [[0, "hoje"], [3, "3 meses"], [6, "6 meses"], [9, "9 meses"], [12, "1 ano"]];
const bal = (r, m, from = 10000, m0 = 0) => from * Math.pow(1 + r, (m - m0) / 12), HALF = bal(.14, 6);

// accumulated in the year, %: [year, Selic, IPCA] (Banco Central, SGS series 4390 and 433)
const YEARS = [[2019, 5.95, 4.31], [2020, 2.75, 4.52], [2021, 4.44, 10.06], [2022, 12.38, 5.78], [2023, 13.03, 4.62], [2024, 10.89, 4.83], [2025, 14.33, 4.26]];

const GLOSS = {
  "Selic": "taxa básica de juros do Brasil, definida pelo Copom (Comitê de Política Monetária do Banco Central) a cada 45 dias",
  "Tesouro Selic": "título público que rende a taxa Selic de cada dia",

  "p.p.": "ponto percentual; de 14% para 16% são 2 p.p.",

};
const TERMS = [["Selic", "Tesouro Selic"], ["pós-fixado", "Selic"], ["p.p.", "marcação a mercado", "Prefixado", "IPCA+"],
  ["deságio", "marcação a mercado"], ["IR", "IOF"], ["IPCA", "ganho real"], ["reserva de emergência", "IPCA+"]];

const SCENES = [
{ title: "Um saldo que sobe todo dia", dur: 10,
  cap: [[0, "O <b>Tesouro Selic</b> rende a taxa Selic, um dia útil de cada vez. Com a Selic a 14% ao ano, R$ 10.000 ganham cerca de R$ 5,20 por dia útil."],
        [6.5, "Em um ano viram <b>R$ 11.400</b>, se a Selic ficar parada. Ela não fica: o Banco Central revê a taxa a cada 45 dias."]],
  draw(t) {
    axes("saldo (R$)");
    const m = 12 * P(t, 1, 6.5), f = m => bal(.14, m);
    path(f, 0, m, "b");
    dot(X(m), Y(f(m)), "b", 14);
    text(RX, 180, [["Selic", "m"]], 28);
    text(RX, 245, [["14,00% ao ano", "a", 1]], 56);
    text(RX, 335, [["R$ 10.000 viram", "m"]], 28);

// ---------- player
const HEADLESS = /HeadlessChrome/.test(navigator.userAgent);
const starts = []; let total = 0;
SCENES.forEach(s => { starts.push(total); total += s.dur; });
const terms = document.getElementById("terms");
const svg = document.getElementById("stage"), cap = document.getElementById("caption");
const DEFS = "";
let T = 0, playing = false, speed = 1, lastTs = null, lastKey = "";
const sceneAt = T => { let i = 0; while (i + 1 < SCENES.length && T >= starts[i + 1]) i++; return i; };

const tl = document.getElementById("timeline");
SCENES.forEach((s, i) => {
  const seg = document.createElement("div");
  seg.className = "seg"; seg.style.flex = s.dur; seg.title = `${i + 1}. ${s.title}`;
  seg.innerHTML = '<div class="fill"></div>';
  tl.appendChild(seg);
});
const fills = [...tl.querySelectorAll(".fill")];

function render() {
  const i = sceneAt(T), s = SCENES[i], t = Math.min(T - starts[i], s.dur);
  const key = i + ":" + t.toFixed(3);
  if (key === lastKey) return;
  lastKey = key; out = [];
  s.draw(t);
  svg.innerHTML = DEFS + out.join("");
  const c = s.cap.filter(([a]) => a <= t + 1e-6).pop();
  if (cap.innerHTML !== c[1]) cap.innerHTML = c[1];
  const tm = TERMS[i].map(k => `<b>${k}</b>: ${GLOSS[k]}`).join(" · ");
  if (terms.innerHTML !== tm) terms.innerHTML = tm;
  fills.forEach((f, k) => f.style.width = (k < i ? 100 : k > i ? 0 : 100 * (T - starts[i]) / s.dur) + "%");
  document.getElementById("where").textContent = s.title;
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").disabled = i === SCENES.length - 1;
}
function loop(ts) {
  if (playing && lastTs !== null) {
    const end = sceneEnd(sceneAt(T));
    T += (ts - lastTs) / 1000 * speed;
    if (T >= end) { T = end; setPlaying(false); }
  }
  lastTs = ts;
  render();
  requestAnimationFrame(loop);
}
function setPlaying(v) { playing = v; document.getElementById("play").textContent = v ? "⏸" : "▶"; }
// headless (fit-check) jumps to each scene's final frame so the page settles
function go(i) {
  i = clamp(i, 0, SCENES.length - 1);
  T = HEADLESS ? sceneEnd(i) : starts[i];
  if (!HEADLESS) setPlaying(true);
  render();
}
// a scene stops on its last frame; play there starts the next one
const sceneEnd = i => starts[i] + SCENES[i].dur - 1e-3;
document.getElementById("play").onclick = () => {
  const i = sceneAt(T);
  if (playing) return setPlaying(false);
  if (T >= sceneEnd(i)) return go(i === SCENES.length - 1 ? 0 : i + 1);
  setPlaying(true);
};
document.getElementById("replay").onclick = () => go(sceneAt(T));
document.getElementById("restart").onclick = () => go(0);
document.getElementById("prev").onclick = () => go(sceneAt(T) - 1);
document.getElementById("next").onclick = () => go(sceneAt(T) + 1);
document.querySelectorAll(".spd").forEach(b => b.onclick = () => {
  speed = +b.dataset.s;
  document.querySelectorAll(".spd").forEach(x => x.classList.toggle("on", x === b));
});
function scrub(e) {
  const r = tl.getBoundingClientRect();
  T = clamp((e.clientX - r.left) / r.width) * total * 0.9999;
  setPlaying(false);
  render();
}
tl.addEventListener("pointerdown", e => { scrub(e); tl.setPointerCapture(e.pointerId); tl.onpointermove = scrub; });
tl.addEventListener("pointerup", () => tl.onpointermove = null);
const KEYS = { " ": "#play", l: "#next", ArrowRight: "#next", h: "#prev", ArrowLeft: "#prev", H: "#restart", r: "#replay",
  1: ".spd[data-s='0.5']", 2: ".spd[data-s='1']", 3: ".spd[data-s='2']" };
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.ctrlKey || e.altKey || e.metaKey || !KEYS[e.key]) return;
  e.preventDefault();
  document.querySelector(KEYS[e.key]).click();
});
if (HEADLESS) go(+location.hash.slice(1) || 0);
requestAnimationFrame(loop);
</script>
