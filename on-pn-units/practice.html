<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final 3, 4 e 11, interação</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1d1f; --muted: #6b6b70; --line: #d8d6d0; --panel: #f0eee8;
    --a: #e8590c; --b: #1c7ed6; --c: #2b8a3e; --d: #9c36b5; --r: #d6336c; --e: #0c8599;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141417; --fg: #ececf0; --muted: #9a9aa3; --line: #34343b; --panel: #1f1f24;
      --a: #ff922b; --b: #4dabf7; --c: #51cf66; --d: #da77f2; --r: #f06595; --e: #3bc9db;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: 6px; gap: 6px; }
  #top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  #links { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-self: start; }
  #top a { color: var(--b); font-size: 16px; }
  #where { text-align: center; font-size: 22px; font-weight: 700; }
  #stage { flex: 1; min-height: 0; width: 100%; display: block; touch-action: manipulation; }
  #stage text { white-space: pre; fill: var(--fg); }
  #talk { min-height: 104px; }
  #caption, #ask { font-size: 20px; line-height: 1.35; padding: 6px 10px; border-radius: 4px;
    background: var(--panel); min-height: 104px; }
  #caption { border-left: 4px solid var(--d); }
  #caption b { color: var(--d); }
  #ask { border-left: 4px solid var(--a); display: none; }
  #ask .q b { color: var(--a); }
  #ask .ctl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  #ask button, #ask input { font: inherit; font-size: 20px; padding: 4px 12px; border-radius: 6px;
    border: 2px solid var(--line); background: var(--bg); color: var(--fg); }
  #ask button { cursor: pointer; }
  #ask input { width: 110px; text-align: center; }
  #ask .ok { border-color: var(--c); color: var(--c); }
  #ask .bad { border-color: var(--r); color: var(--r); }
  #ask .show { color: var(--muted); }
  #hint { color: var(--r); font-size: 18px; margin-top: 4px; }
  #terms { font-size: 16px; line-height: 1.4; min-height: 4.2em; padding: 2px 10px; color: var(--muted); }
  #terms b { color: var(--fg); }
  #bar { display: flex; align-items: center; gap: 6px; font-size: 16px; flex-wrap: wrap; }
  #bar button { font: inherit; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #bar button:not(.spd) { width: 60px; padding: 4px 0; text-align: center; letter-spacing: -3px; }
  #bar button[data-k]::after { content: attr(data-k); margin-left: 6px; font-size: 13px; letter-spacing: 0; opacity: .7; }
  #bar button:disabled { opacity: .4; cursor: default; }
  #bar button.on { border-color: var(--d); color: var(--d); }
  #timeline { flex: 1; min-width: 160px; height: 22px; display: flex; gap: 3px; cursor: pointer; }
  #timeline .seg { position: relative; background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; overflow: hidden; }
  #timeline .fill { position: absolute; inset: 0; width: 0; background: var(--d); opacity: .55; }
  #m { position: absolute; width: 0; height: 0; visibility: hidden; }
  #m text { white-space: pre; }
  /* phone: the stage takes the full width at its own height and the page scrolls */
  @media (max-width: 700px) {
    html, body { height: auto; }
    #top { grid-template-columns: 1fr; }
    #where { text-align: left; }
    #stage { flex: none; height: auto; aspect-ratio: 800 / 820; }
  }
</style>
</head>
<body>
<div id="top"><nav id="links"><a href="../">← todas as aulas</a><a href="index.html">lição</a><a href="animate.html">animação</a></nav><div id="where"></div><span></span></div>
<svg id="stage" viewBox="0 0 800 820" preserveAspectRatio="xMidYMid meet"></svg>
<div id="talk">
  <div id="caption"></div>
  <div id="ask"><div class="q"></div><div class="ctl"></div><div id="hint"></div></div>
</div>
<div id="terms"></div>
<div id="bar">
  <button id="restart" data-k="H" title="recomeçar (H)">⏮</button>
  <button id="prev" data-k="h" title="cena anterior (h, ←)">◀◀</button>
  <button id="play" data-k="SPC" title="tocar / pausar (espaço)">▶</button>
  <button id="next" data-k="l" title="próxima cena (l, →)">▶▶</button>
  <button id="replay" data-k="r" title="repetir esta cena (r)">↻</button>
  <button class="spd" data-s="0.5" data-k="1" title="0.5x (1)">0.5x</button>
  <button class="spd on" data-s="1" data-k="2" title="1x (2)">1x</button>
  <button class="spd" data-s="2" data-k="3" title="2x (3)">2x</button>
  <div id="timeline"></div>
</div>
<svg id="m"><text id="mt"></text></svg>
<script>
const COL = { a: "var(--a)", b: "var(--b)", c: "var(--c)", d: "var(--d)", r: "var(--r)", e: "var(--e)",
  m: "var(--muted)", l: "var(--line)", f: "var(--fg)", p: "var(--panel)" };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => (t = clamp(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const P = (t, a, b) => ease((t - a) / (b - a));
const L = (a, b, p) => a + (b - a) * p;

let out = [];
const add = s => out.push(s);
const span = ([s, c, w]) => `<tspan${c ? ` fill="${COL[c]}"` : ""}${w ? ' font-weight="700"' : ""}>${s}</tspan>`;
const mt = document.getElementById("mt"), wcache = {};
function width(tokens, size) {
  const k = size + "|" + JSON.stringify(tokens);
  if (!(k in wcache)) {
    mt.setAttribute("font-size", size);
    mt.innerHTML = tokens.map(span).join("");
    wcache[k] = mt.getComputedTextLength();
  }
  return wcache[k];
}
function text(x, y, tokens, size, o = {}) {
  if (typeof tokens === "string") tokens = [[tokens, o.c]];
  const op = o.op ?? 1;
  if (op <= 0.001) return;
  add(`<text x="${x}" y="${y}" font-size="${size}" text-anchor="${o.anchor || "start"}" opacity="${op}">${tokens.map(span).join("")}</text>`);
}
// lays tokens out left to right centered on cx, returns each token's center x
function row(cx, y, tokens, size, o = {}) {
  const ws = tokens.map(t => width([t], size));
  let x = cx - ws.reduce((a, b) => a + b, 0) / 2;
  const centers = [];
  tokens.forEach((t, i) => {
    const op = Array.isArray(o.op) ? o.op[i] : o.op ?? 1;
    text(x, y, [t], size, { op });
    centers.push(x + ws[i] / 2);
    x += ws[i];
  });
  return centers;
}
const line = (x1, y1, x2, y2, color, w = 3, op = 1, dash = "") => op > 0 && add(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${COL[color]}" stroke-width="${w}" stroke-dasharray="${dash}" stroke-linecap="round" opacity="${op}"/>`);
function box(x, y, w, h, color, op = 1, fillOp = .18, rx = 14, dash = "") {
  if (op <= 0) return;
  add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${COL[color]}" fill-opacity="${fillOp}" stroke="${COL[color]}" stroke-width="3" stroke-dasharray="${dash}" opacity="${op}"/>`);
}
function arrow(x1, y1, x2, y2, color, p = 1, w = 4) {
  if (p <= 0) return;
  const x = L(x1, x2, p), y = L(y1, y2, p), a = Math.atan2(y - y1, x - x1), s = 16;
  line(x1, y1, x, y, color, w);
  add(`<polygon points="${x},${y} ${x - s * Math.cos(a - .45)},${y - s * Math.sin(a - .45)} ${x - s * Math.cos(a + .45)},${y - s * Math.sin(a + .45)}" fill="${COL[color]}"/>`);
}
const r$ = v => "R$ " + v.toFixed(2).replace(".", ",");
const pc = v => v.toFixed(1).replace(".", ",") + "%";

// ---------- checkpoint answers drawn in the stage
let cur = 0;
const ans = [];
// the user's answer flies from the "Sua vez" box to (x, y) at ck.show; a wrong one stays above, struck out
function answerAt(x, y, size, t, c = "c", anchor = "middle") {
  const ck = SCENES[cur].ck, a = ans[cur], show = ck.show ?? ck.at;
  if (!a || t < show) return text(x, y, [["?", "m", 1]], size, { anchor });
  const right = "" + ck.answer, mine = a.val == null ? null : "" + a.val, p = P(t, show, show + .9);
  if (mine !== null && p < 1) {
    return text(L(400, x, p), L(810, y, p) - Math.sin(p * Math.PI) * 80, [[mine, a.ok ? c : "r", 1]], size, { anchor });
  }
  text(x, y, [[right, c, 1]], size, { anchor, op: mine === null ? P(t, show, show + .6) : 1 });
  if (!a.ok && mine !== null) {
    const s = Math.max(30, size * .7), w = width([["você: " + mine]], s), yy = y - size * 1.05;
    const x0 = anchor === "start" ? x : x - w / 2;
    text(x0, yy, [["você: " + mine, "r"]], s);
    line(x0, yy - s * .32, x0 + w, yy - s * .32, "r", 3);
  }
}

const GLOSS = {
  "B3": "a bolsa de valores do Brasil",
  "código": "o nome da ação na bolsa: 4 letras da empresa + um número do tipo de papel",
  "ON": "ação ordinária nominativa (final 3): dá direito a voto na assembleia",
  "PN": "ação preferencial nominativa (final 4): sem voto, com alguma vantagem no dividendo",
  "unit": "certificado (final 11) que representa um pacote fixo de ações ON e PN da mesma empresa",
  "assembleia": "reunião dos acionistas que decide, por voto, assuntos como eleger o conselho e aprovar contas",
  "tag along": "se o controlador vender o controle, o comprador tem de fazer uma oferta também aos minoritários",
  "controlador": "quem tem votos suficientes para mandar na empresa",
  "minoritários": "acionistas que não controlam a empresa, como quem compra poucas ações na bolsa",
  "Lei 6.404": "Lei das S.A., de 1976: as regras das sociedades anônimas no Brasil",
  "Novo Mercado": "segmento mais exigente de governança da B3: só ações ON, tag along de 100%",
  "dividendo mínimo": "parte do lucro que o estatuto obriga a empresa a pagar todo ano",
  "DY": "dividend yield: dividendo por ação em 12 meses ÷ preço, em %",
  "dividendo por ação": "aqui aproximado como preço × DY dos últimos 12 meses",
  "FII": "fundo de investimento imobiliário: tem imóveis ou dívidas imobiliárias, cota com final 11",
  "ETF": "fundo negociado na bolsa que copia um índice, como o Ibovespa",
  "PNA / PNB": "classes diferentes de preferencial (finais 5 e 6), cada uma com sua vantagem no estatuto",
  "fracionário": "mercado onde se compra de 1 em 1 ação em vez do lote de 100; o código ganha um F no fim",
  "liquidez": "volume negociado por dia: com pouco volume você paga mais caro para entrar e sair",
};

const SCENES = [
{ title: "Lendo o código", dur: 11, terms: ["B3", "código", "ON", "PN", "unit"],
  cap: [[0, "Todo código de ação da <b>B3</b> tem 4 letras e um número. As letras dizem qual empresa: <b>TAEE</b> é a Taesa."],
        [4, "O número diz que tipo de papel você compra: <b>3</b> ordinária (ON), <b>4</b> preferencial (PN), <b>11</b> unit, um pacote das duas."]],
  draw(t) {
    const x0 = 100;
    "TAEE".split("").forEach((c, k) => { const op = P(t, .3 + k * .3, .8 + k * .3); box(x0 + k * 110, 60, 96, 120, "b", op, .2, 10); text(x0 + k * 110 + 48, 145, [[c, "b", 1]], 70, { anchor: "middle", op }); });
    box(x0 + 450, 60, 150, 120, "a", P(t, 1.6, 2.2), .25, 10);
    text(x0 + 525, 145, [["11", "a", 1]], 70, { anchor: "middle", op: P(t, 1.6, 2.2) });
    text(x0 + 215, 230, [["empresa: Taesa", "b", 1]], 30, { anchor: "middle", op: P(t, 2.2, 2.8) });
    text(x0 + 525, 230, [["tipo de papel", "a", 1]], 30, { anchor: "middle", op: P(t, 2.6, 3.2) });
    [["3", "ON", ["ordinária: vota"], "c"], ["4", "PN", ["preferencial: sem voto,", "prioridade no dividendo"], "e"], ["11", "unit", ["pacote de ON + PN"], "a"]].forEach(([n, s, d, c], k) => {
      const op = P(t, 4.5 + k * 1.2, 5.2 + k * 1.2), y = 360 + k * 140;
      text(40, y, [["TAEE" + n, c, 1]], 42, { op });
      text(220, y, [[s, c, 1]], 40, { op });
      d.forEach((l, j) => text(340, y + j * 40, [[l]], 30, { op }));
    });
  } },

{ title: "Final 3: ON, você vota", dur: 14, terms: ["ON", "assembleia", "tag along", "controlador", "Novo Mercado"],
  cap: [[0, "<b>ON</b>, ordinária: cada ação dá 1 voto na <b>assembleia</b> (Lei 6.404, art. 110)."],
        [4.5, "E traz <b>tag along</b>: se o controlador vender o controle, o comprador tem de fazer uma oferta também aos minoritários ON."],
        [8.5, "Pelo menos <b>80%</b> do preço que pagou ao controlador (Lei 6.404, art. 254-A)."],
        [11, "No <b>Novo Mercado</b> da B3 a exigência sobe para 100%, e a empresa só pode ter ações ON."]],
  ck: { at: 8, show: 8.5, kind: "opt", answer: "R$ 80", opts: ["R$ 0", "R$ 50", "R$ 80", "R$ 100"],
        q: "O controlador vendeu o controle a R$ 100 por ação. Quanto, no mínimo, o comprador tem de oferecer por ação ao minoritário ON?",
        hint: "A lei não garante o preço cheio ao minoritário, mas garante a maior parte dele." },
  draw(t) {
    for (let k = 0; k < 5; k++) { const op = P(t, .4 + k * .3, .9 + k * .3); box(125 + k * 115, 40, 90, 90, "c", op, .25, 10); text(170 + k * 115, 98, [["ON", "c", 1]], 30, { anchor: "middle", op }); text(170 + k * 115, 172, [["1 voto", "m"]], 30, { anchor: "middle", op: P(t, 1.8, 2.4) }); }
    const s = P(t, 4.5, 5.5);
    box(40, 240, 720, 100, "d", s, .15);
    row(400, 302, [["controlador", "d", 1], [" vende a R$ 100 por ação"]], 30, { op: s });
    arrow(400, 350, 400, 450, "m", P(t, 6, 7));
    text(420, 410, [["comprador", "m"]], 30, { op: P(t, 6, 7) });
    const m = P(t, 7, 7.8);
    box(40, 460, 720, 150, "c", m, .15);
    text(400, 515, [["minoritário ON", "c", 1]], 34, { anchor: "middle", op: m });
    if (m > 0) {
      text(390, 580, [["recebe oferta de ≥", "c", 1]], 32, { anchor: "end", op: m });
      answerAt(410, 580, 32, t, "c", "start");
    }
    text(400, 700, [["Novo Mercado: ≥ R$ 100", "a", 1]], 32, { anchor: "middle", op: P(t, 11, 11.8) });
  } },

{ title: "Final 4: PN, prioridade no dividendo", dur: 15, terms: ["PN", "dividendo mínimo", "Lei 6.404"],
  cap: [[0, "<b>PN</b>, preferencial: não vota. Em troca, para ser negociada na bolsa, precisa de pelo menos uma vantagem (Lei 6.404, art. 17, §1º)."],
        [3.5, "Prioridade num <b>dividendo mínimo</b>, ou dividendo pelo menos <b>10% maior</b> que o da ON, ou tag along de 80%."],
        [8.5, "E se a empresa passar <b>3 anos seguidos</b> sem pagar o dividendo mínimo prometido?"],
        [11.5, "A PN ganha voto até a empresa voltar a pagar (art. 111, §1º). O estatuto pode fixar um prazo menor; 3 anos é o máximo."]],
  ck: { at: 11, show: 11.5, kind: "opt", answer: "a PN ganha voto", opts: ["a PN ganha voto", "a PN vira ON", "nada muda"],
        q: "A empresa passou 3 anos seguidos sem pagar o dividendo mínimo prometido à PN. O que acontece?",
        hint: "A PN abriu mão do voto em troca do dividendo. Se o dividendo não vem, o que ela recupera?" },
  draw(t) {
    box(40, 40, 200, 130, "e", P(t, 0, .8), .25); text(140, 127, [["PN", "e", 1]], 60, { anchor: "middle", op: P(t, 0, .8) });
    text(380, 117, [["sem voto", "m"]], 34, { anchor: "middle", op: P(t, .8, 1.4) });
    line(300, 106, 460, 106, "r", 3, P(t, 1.4, 2));
    text(40, 260, [["a lei exige pelo menos uma vantagem:", "m"]], 30, { op: P(t, 3.5, 4) });
    ["prioridade num dividendo mínimo", "dividendo ≥ 10% maior que o da ON", "tag along de 80%"].forEach((s, k) => {
      const op = P(t, 3.7 + k * 1.3, 4.4 + k * 1.3), y = 320 + k * 55;
      text(40, y, [[k ? "ou " : "• ", "m"], [s, "e", 1]], 32, { op });
    });
    [0, 1, 2].forEach(k => { const op = P(t, 9 + k * .6, 9.5 + k * .6); box(40 + k * 245, 520, 220, 80, "r", op, .15, 10); text(150 + k * 245, 572, [["ano " + (k + 1) + ": R$ 0", "r", 1]], 30, { anchor: "middle", op }); });
    if (t >= 10.2) { text(40, 700, [["→", "c", 1]], 40); answerAt(90, 700, 40, t, "c", "start"); }
  } },

{ title: "ON ou PN? Compare o DY", dur: 15, terms: ["DY", "dividendo por ação"],
  cap: [[0, "Itaúsa, cotações de 30/10/2026 (fundamentus). As duas pagam por volta de R$ 1,13 por ação em 12 meses."],
        [4, "A PN custa menos: <b>ITSA4</b> rende 9,1% contra 8,7% da ITSA3. Mesmo dinheiro de dividendo, preço menor."],
        [8.5, "Bradesco: <b>BBDC4</b> recebe ~10% a mais por ação, mas custa ~9% a mais. O DY fica quase igual: o mercado já cobrou a vantagem."]],
  ck: { at: 3.5, show: 4, kind: "opt", answer: "ITSA4", opts: ["ITSA3", "ITSA4", "empate"],
        q: "ITSA3 custa R$ 12,93 e rende DY 8,7%; ITSA4 custa R$ 12,45 e rende 9,1%. Com R$ 1.000 investidos, qual paga mais dividendo?",
        hint: "Com o mesmo dinheiro, o dividendo é dinheiro × DY: compare 8,7% e 9,1%." },
  draw(t) {
    const data = [["ITSA3", 12.93, 8.7, "c"], ["ITSA4", 12.45, 9.1, "e"], ["BBDC3", 12.71, 10.9, "c"], ["BBDC4", 13.86, 11.0, "e"]];
    text(400, 50, [["preço × DY = dividendo por ação", "m"]], 30, { anchor: "middle" });
    data.forEach(([k, p, d, c], i) => {
      const a = i < 2 ? .3 + i * 1.2 : 8.5 + (i - 2) * 1.2, op = P(t, a, a + .7), y = 120 + i * 120 + (i > 1 ? 70 : 0);
      text(30, y, [[k, c, 1]], 36, { op });
      text(220, y, [[r$(p), "b"]], 32, { op });
      text(420, y, [["DY " + pc(d), "d", i % 2]], 32, { op });
      const div = p * d / 100, w = div * 400 * P(t, a + .6, a + 1.4);
      if (w > 0) add(`<rect x="30" y="${y + 14}" width="${w}" height="38" rx="8" fill="${COL.a}" fill-opacity=".6"/>`);
      text(45 + w, y + 45, [[r$(div), "a", 1]], 30, { op: P(t, a + 1.2, a + 1.6) });
    });
    text(30, 345, [["mais dividendo por real:", "d"]], 30);
    answerAt(390, 345, 30, t, "d", "start");
    text(400, 720, [["BBDC3 e BBDC4 praticamente empatam", "d", 1]], 30, { anchor: "middle", op: P(t, 11.5, 12.5) });
  } },

{ title: "Final 11: o pacote", dur: 16, terms: ["unit"],
  cap: [[0, "<b>TAEE11</b> = 1 TAEE3 + 2 TAEE4: a unit é um pacote fixo de ações da Taesa."],
        [4.5, "Soma das partes: 12,90 + 2 × 13,30 = <b>R$ 39,50</b>."],
        [6.5, "A unit custa R$ 39,59: só 0,2% acima. O preço fica colado na soma, porque se descolar alguém compra o lado barato e vende o caro."],
        [10.5, "<b>KLBN11</b> = 1 KLBN3 + 4 KLBN4: 3,56 + 4 × 3,41 = R$ 17,20, exatamente o preço da unit."]],
  ck: { at: 4, show: 4.5, kind: "num", answer: "39,50",
        q: "TAEE3 custa R$ 12,90 e TAEE4 custa R$ 13,30. Quanto valem, em R$, as partes de 1 TAEE11 (1 TAEE3 + 2 TAEE4)?",
        hint: "12,90 + 2 × 13,30: faça primeiro a multiplicação." },
  draw(t) {
    const tile = (x, y, l, c, op) => { box(x, y, 160, 70, c, op, .25, 10); text(x + 80, y + 46, [[l, c, 1]], 30, { anchor: "middle", op }); };
    const pk = P(t, 2, 3.8);
    [["TAEE3", "c", 0], ["TAEE4", "e", 1], ["TAEE4", "e", 2]].forEach(([l, c, k]) => {
      tile(L(40, 245 + k * 175, pk), L(40 + k * 85, 120, pk), l, c, P(t, k * .4, k * .4 + .6));
    });
    box(230, 105, 540, 100, "a", pk, .06, 16, "10 8");
    text(500, 85, [["TAEE11", "a", 1]], 34, { anchor: "middle", op: pk });
    if (t >= 3.8) {
      const c = row(400, 300, [["12,90", "c", 1], [" + 2 × "], ["13,30", "e", 1], [" = R$ "], ["        "]], 36);
      answerAt(c[4] - width([["        "]], 36) / 2 + 10, 300, 36, t, "f", "start");
    }
    text(400, 370, [["unit: R$ 39,59  (+0,2%)", "a", 1]], 34, { anchor: "middle", op: P(t, 6.5, 7.5) });
    row(400, 490, [["KLBN11", "a", 1], [" = 1 KLBN3 + 4 KLBN4"]], 32, { op: P(t, 10.5, 11.5) });
    row(400, 560, [["3,56", "c", 1], [" + 4 × "], ["3,41", "e", 1], [" = "], ["R$ 17,20", "a", 1], ["  = unit"]], 32, { op: P(t, 11.5, 12.5) });
  } },

// ---------- player
const HEADLESS = /HeadlessChrome/.test(navigator.userAgent);
const $ = id => document.getElementById(id);
const starts = []; let total = 0;
SCENES.forEach(s => { starts.push(total); total += s.dur; });
const svg = $("stage"), cap = $("caption"), ask = $("ask"), terms = $("terms");
let T = 0, playing = false, speed = 1, lastTs = null, lastKey = "", tries = 0, tapWrong = null, lastWrong = null;
const sceneAt = T => { let i = 0; while (i + 1 < SCENES.length && T >= starts[i + 1]) i++; return i; };
const sceneEnd = i => starts[i] + SCENES[i].dur - 1e-3;
const ckTime = i => starts[i] + SCENES[i].ck.at;
const ckOpen = () => { const i = sceneAt(T), ck = SCENES[i].ck; return !!ck && !ans[i] && T >= ckTime(i) - 1e-6; };
// pt-BR numbers: "39,50", "39,5" and "39.5" are the same answer
const same = (a, b) => {
  const n = v => Number(String(v).replace(/^R\$\s*/, "").replace(",", "."));
  return String(a) === String(b) || (!isNaN(n(a)) && n(a) === n(b));
};

const tl = $("timeline");
SCENES.forEach((s, i) => {
  const seg = document.createElement("div");
  seg.className = "seg"; seg.style.flex = s.dur; seg.title = `${i + 1}. ${s.title}`;
  seg.innerHTML = '<div class="fill"></div>';
  tl.appendChild(seg);
});
const fills = [...tl.querySelectorAll(".fill")];

function buildAsk(i) {
  const ck = SCENES[i].ck;
  tries = 0; tapWrong = null; lastWrong = null;
  ask.querySelector(".q").innerHTML = `<b>Sua vez:</b> ${ck.q}`;
  $("hint").textContent = "";
  const ctl = ask.querySelector(".ctl");
  ctl.innerHTML = "";
  if (ck.kind === "num") {
    ctl.innerHTML = '<input id="in" type="text" inputmode="decimal" autocomplete="off"><button id="check">Conferir</button>';
    const inp = $("in");
    inp.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") submit(inp.value.trim(), inp); });
    $("check").onclick = () => submit(inp.value.trim(), inp);
  } else if (ck.kind === "opt") {
    ck.opts.forEach(o => {
      const b = document.createElement("button");
      b.textContent = o; b.onclick = () => submit(o, b);
      ctl.appendChild(b);
    });
  } else {
    ctl.insertAdjacentHTML("beforeend", '<span>Toque no desenho.</span>');
  }
  const show = document.createElement("button");
  show.className = "show"; show.textContent = "Mostrar resposta";
  show.onclick = () => resolve(lastWrong, false);
  ctl.appendChild(show);
}
function submit(val, el) {
  if (val === "") return;
  const i = sceneAt(T), ck = SCENES[i].ck;
  if (same(val, ck.answer)) {
    if (el) el.classList.add("ok");
    return setTimeout(() => resolve(val, true), 450);
  }
  tries++; lastWrong = val;
  if (el) el.classList.add("bad");
  if (ck.kind === "tap") { tapWrong = val; lastKey = ""; }
  if (tries >= 2) return setTimeout(() => resolve(val, false), 450);
  $("hint").textContent = "Ainda não. Dica: " + ck.hint;
}
function resolve(val, ok) {
  const i = sceneAt(T);
  if (ans[i]) return;
  // a tap answer is a zone index: show the code tapped, not the number
  const ck = SCENES[i].ck;
  ans[i] = { val: ck.kind === "tap" || val === null ? null : val, ok, tap: ck.kind === "tap" ? val : null };
  lastKey = "";
  setPlaying(true);
}

let askFor = -1;
function render() {
  const i = sceneAt(T), s = SCENES[i], t = Math.min(T - starts[i], s.dur), open = ckOpen();
  if (open && askFor !== i) { buildAsk(i); askFor = i; }
  if (!open) askFor = -1;
  ask.style.display = open ? "block" : "none";
  cap.style.display = open ? "none" : "block";
  const key = i + ":" + t.toFixed(3) + ":" + open + ":" + tapWrong;
  if (key === lastKey) return;
  lastKey = key; out = []; cur = i;
  s.draw(t);
  if (s.ck && s.ck.kind === "tap" && t >= s.ck.at - 1e-6) {
    const z = s.ck.zones, a = ans[i];
    const ring = (k, c, dash = "") => add(`<rect x="${z[k][0] + 4}" y="${z[k][1] + 4}" width="${z[k][2] - 8}" height="${z[k][3] - 8}" rx="10" fill="none" stroke="${COL[c]}" stroke-width="5" stroke-dasharray="${dash}"/>`);
    if (open) { z.forEach((_, k) => ring(k, "m", "8 8")); if (tapWrong !== null) ring(tapWrong, "r"); }
    else if (a) { ring(s.ck.answer, "c"); if (!a.ok && a.tap !== null && a.tap !== s.ck.answer) ring(a.tap, "r"); }
  }
  svg.innerHTML = out.join("");
  const c = s.cap.filter(([a]) => a <= t + 1e-6).pop();
  if (cap.innerHTML !== c[1]) cap.innerHTML = c[1];
  const tm = s.terms.map(k => `<b>${k}</b>: ${GLOSS[k]}`).join(" · ");
  if (terms.innerHTML !== tm) terms.innerHTML = tm;
  fills.forEach((f, k) => f.style.width = (k < i ? 100 : k > i ? 0 : 100 * (T - starts[i]) / s.dur) + "%");
  $("where").textContent = s.title;
  $("prev").disabled = i === 0;
  const last = i === SCENES.length - 1;
  $("next").disabled = last ? !(HEADLESS && open) : (!HEADLESS && open);
  $("play").disabled = open;
}
function loop(ts) {
  if (playing && lastTs !== null) {
    const i = sceneAt(T), s = SCENES[i];
    const stop = s.ck && !ans[i] && T < ckTime(i) ? ckTime(i) : sceneEnd(i);
    T += (ts - lastTs) / 1000 * speed;
    if (T >= stop) { T = stop; setPlaying(false); }
  }
  lastTs = ts;
  render();
  requestAnimationFrame(loop);
}
function setPlaying(v) { playing = v; $("play").textContent = v ? "⏸" : "▶"; }
// headless (fit-check): stop on each checkpoint with the box open, then on the revealed last frame
function go(i) {
  i = clamp(i, 0, SCENES.length - 1);
  ans[i] = undefined; askFor = -1;
  if (HEADLESS) T = SCENES[i].ck ? ckTime(i) : sceneEnd(i);
  else { T = starts[i]; setPlaying(true); }
  render();
}
$("play").onclick = () => {
  const i = sceneAt(T);
  if (ckOpen()) return;
  if (playing) return setPlaying(false);
  if (T >= sceneEnd(i)) return go(i === SCENES.length - 1 ? 0 : i + 1);
  setPlaying(true);
};
$("replay").onclick = () => go(sceneAt(T));
$("restart").onclick = () => go(0);
$("prev").onclick = () => go(sceneAt(T) - 1);
$("next").onclick = () => {
  const i = sceneAt(T);
  if (ckOpen()) {
    if (!HEADLESS) return;
    const ck = SCENES[i].ck;
    ans[i] = { val: ck.kind === "tap" ? null : ck.answer, ok: true, tap: ck.kind === "tap" ? ck.answer : null };
    T = sceneEnd(i);
    return render();
  }
  go(i + 1);
};
document.querySelectorAll(".spd").forEach(b => b.onclick = () => {
  speed = +b.dataset.s;
  document.querySelectorAll(".spd").forEach(x => x.classList.toggle("on", x === b));
});
function scrub(e) {
  const r = tl.getBoundingClientRect();
  T = clamp((e.clientX - r.left) / r.width) * total * 0.9999;
  const i = sceneAt(T);
  if (SCENES[i].ck && !ans[i] && T > ckTime(i)) T = ckTime(i);
  setPlaying(false);
  render();
}
tl.addEventListener("pointerdown", e => { scrub(e); tl.setPointerCapture(e.pointerId); tl.onpointermove = scrub; });
tl.addEventListener("pointerup", () => tl.onpointermove = null);
svg.addEventListener("pointerdown", e => {
  const i = sceneAt(T), ck = SCENES[i].ck;
  if (!ckOpen() || ck.kind !== "tap") return;
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  const k = ck.zones.findIndex(([x, y, w, h]) => p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h);
  if (k >= 0) submit(k, null);
});
const KEYS = { " ": "#play", l: "#next", ArrowRight: "#next", h: "#prev", ArrowLeft: "#prev", H: "#restart", r: "#replay",
  1: ".spd[data-s='0.5']", 2: ".spd[data-s='1']", 3: ".spd[data-s='2']" };
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.ctrlKey || e.altKey || e.metaKey || !KEYS[e.key]) return;
  e.preventDefault();
  document.querySelector(KEYS[e.key]).click();
});
if (HEADLESS) go(0);
requestAnimationFrame(loop);
</script>
