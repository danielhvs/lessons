<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Condomínio Taesa</title>
<style>
:root {
  --bg: #f7f6f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e2e0d8;
  --accent: #2f6fde; --on: #2f6fde; --on-soft: #2f6fde22; --pn: #c77d12; --pn-soft: #c77d1224;
  --unit: #1f8a4c; --unit-soft: #1f8a4c1f; --bad: #c2382f; --bad-soft: #c2382f1a;
  --sky: #dfeefe; --wall: #efe6d8; --roof: #b5523b; --code-bg: #f1efe8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161a; --panel: #1d1f24; --ink: #ecebe6; --muted: #9a998f; --line: #2e3038;
    --accent: #6ea0ff; --on: #6ea0ff; --on-soft: #6ea0ff26; --pn: #f0a63a; --pn-soft: #f0a63a26;
    --unit: #4cc483; --unit-soft: #4cc48322; --bad: #ff7a70; --bad-soft: #ff7a7020;
    --sky: #1b2433; --wall: #2c2a27; --roof: #8a3f2e; --code-bg: #24262d;
  }
}
* { box-sizing: border-box; }
html { font: clamp(16.5px, .55vw + 9px, 20px)/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { margin: 0; background: var(--bg); color: var(--ink); }
main { width: 100%; max-width: 1600px; margin: 0 auto; padding: 6px; }
header h1 { font-size: 1.4rem; margin: 0 0 2px; }
header p { margin: 0 0 8px; color: var(--muted); }
a { color: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; animation: enter .45s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(14px); } }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 20px; align-items: start; }
h2 { margin: 2px 0 6px; font-size: 1.3rem; }
svg.scene { width: 100%; height: auto; display: block; }
svg text { font-family: system-ui, sans-serif; fill: var(--ink); }
.who { cursor: pointer; transition: transform .3s; }
.who:hover { transform: translateY(-4px); }
.bubble { background: var(--code-bg); border-radius: 12px; padding: 10px 14px; min-height: 4.5em; }
.opts { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
.opts button, .ctl button {
  font: inherit; padding: 10px 18px; border-radius: 10px; cursor: pointer; border: 2px solid var(--line);
  background: var(--bg); color: var(--ink); font-family: ui-monospace, monospace; font-weight: 600;
}
.opts button.right { border-color: var(--unit); background: var(--unit-soft); }
.opts button.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opts button:disabled { cursor: default; }
.ctl { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.ctl button { font-family: inherit; }
.ctl button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.ctl button:disabled { opacity: .4; cursor: default; }
.coins { font-size: 1.1rem; color: var(--muted); }
.why { margin-top: 8px; min-height: 3em; }
.mono { font-family: ui-monospace, monospace; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .95rem; margin-top: 6px; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 6px; vertical-align: -2px; background: var(--c); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Condomínio Taesa</h1>
    <p>A empresa é um prédio. Cada papel é um tipo de morador. <a href="index.html">← Aula passo a passo</a></p>
  </header>
  <div id="panel"></div>
  <div class="ctl">
    <button id="prev">← Voltar</button>
    <button id="next" class="primary">Próximo →</button>
    <span class="coins" id="coins"></span>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let score = 0, answered = {};

const scene = `
<svg class="scene" viewBox="0 0 640 400">
  <rect x="0" y="0" width="640" height="400" fill="var(--sky)"/>
  <circle cx="570" cy="60" r="30" fill="#f6c445"/>
  <path d="M120 120 L320 30 L520 120 Z" fill="var(--roof)"/>
  <rect x="130" y="120" width="380" height="250" fill="var(--wall)" stroke="var(--muted)" stroke-width="2"/>
  <text x="320" y="105" text-anchor="middle" font-size="20" font-weight="700" fill="#fff" style="fill:#fff">TAESA</text>
  ${[0,1,2].map(r => [0,1,2,3].map(c => `<rect x="${155 + c * 90}" y="${140 + r * 70}" width="50" height="40" rx="4" fill="var(--sky)" stroke="var(--muted)"/>`).join("")).join("")}
  <rect x="295" y="320" width="50" height="50" fill="var(--roof)"/>
  <rect x="0" y="370" width="640" height="30" fill="var(--line)"/>

  <g class="who" data-w="on">
    <circle cx="60" cy="300" r="22" fill="var(--on)"/><rect x="38" y="322" width="44" height="48" rx="12" fill="var(--on)"/>
    <rect x="76" y="250" width="34" height="26" rx="3" fill="#fff" stroke="var(--on)" stroke-width="2"/>
    <text x="93" y="268" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--on)">voto</text>
    <path d="M78 300 L90 278" stroke="var(--on)" stroke-width="4"/>
    <text x="60" y="392" text-anchor="middle" font-size="15" font-weight="700" class="mono" style="fill:var(--on)">TAEE3</text>
  </g>
  <g class="who" data-w="pn">
    <circle cx="580" cy="300" r="22" fill="var(--pn)"/><rect x="558" y="322" width="44" height="48" rx="12" fill="var(--pn)"/>
    <circle cx="545" cy="335" r="13" fill="#f6c445" stroke="var(--pn)" stroke-width="2"/>
    <text x="545" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4b00" style="fill:#7a4b00">$</text>
    <text x="580" y="392" text-anchor="middle" font-size="15" font-weight="700" class="mono" style="fill:var(--pn)">TAEE4</text>
  </g>
  <g class="who" data-w="unit">
    <rect x="200" y="300" width="80" height="62" rx="8" fill="var(--unit-soft)" stroke="var(--unit)" stroke-width="3"/>
    <circle cx="222" cy="322" r="9" fill="var(--on)"/><circle cx="242" cy="322" r="9" fill="var(--pn)"/><circle cx="262" cy="322" r="9" fill="var(--pn)"/>
    <text x="240" y="352" text-anchor="middle" font-size="15" font-weight="700" class="mono" style="fill:var(--unit)">TAEE11</text>
  </g>
  <g class="who" data-w="fii">
    <rect x="380" y="300" width="80" height="62" rx="8" fill="var(--code-bg)" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6"/>
    <text x="420" y="328" text-anchor="middle" font-size="14" class="mono">HGLG11</text>
    <text x="420" y="350" text-anchor="middle" font-size="13" style="fill:var(--muted)">vizinho?</text>
  </g>
</svg>`;

const WHO = {
  on: "TAEE3, morador ON: vai à reunião de condomínio (assembleia) e vota: conselho, contas, dividendos. Se o prédio for vendido, a lei garante que ele recebe pelo menos 80% do que o dono do controle recebeu por ação (tag along).",
  pn: "TAEE4, morador PN: não vota na reunião, mas tem alguma vantagem no dividendo garantida pela lei e pelo estatuto. Se passar 3 anos sem receber o mínimo prometido, ganha o direito a voto.",
  unit: "TAEE11, a unit: um apartamento-combo com 1 morador ON e 2 PN dentro. Custa praticamente a soma dos três: R$ 12,90 + 2 × R$ 13,30 = R$ 39,50, e a unit fechou a R$ 39,59.",
  fii: "HGLG11 termina em 11, mas mora em outro prédio: é cota de um fundo imobiliário, sem ON nem PN. O 11 sozinho não diz que é unit.",
};

const Q = [
  { q: "Qual desses papéis é uma ação ordinária, com voto?", o: ["TAEE4", "TAEE3", "HGLG11"], a: 1,
    why: "Final 3 = ON. TAEE4 é PN (sem voto); HGLG11 é cota de FII." },
  { q: "ITSA3 custa R$ 12,93 e ITSA4 R$ 12,45. As duas pagaram ~R$ 1,13 por ação em 12 meses. Qual rende mais por real?", o: ["ITSA3", "ITSA4", "igual"], a: 1,
    why: "Mesmo dividendo, preço menor: ITSA4 tem DY 9,1% contra 8,7% da ITSA3." },
  { q: "TAEE11 = 1 TAEE3 + 2 TAEE4. Preços: TAEE3 R$ 12,90, TAEE4 R$ 13,30, TAEE11 R$ 39,59. Qual sai mais barato?", o: ["a unit", "avulso", "dá igual, centavos"], a: 2,
    why: "Avulso: 12,90 + 2 × 13,30 = R$ 39,50. A diferença é R$ 0,09 (0,2%), menos que a corretagem e o spread. A arbitragem segura o preço da unit colado na soma." },
  { q: "KLBN11 = 1 KLBN3 + 4 KLBN4. KLBN3 R$ 3,56, KLBN4 R$ 3,41. Quanto deveria valer KLBN11?", o: ["R$ 6,97", "R$ 17,20", "R$ 13,64"], a: 1,
    why: "3,56 + 4 × 3,41 = 3,56 + 13,64 = R$ 17,20, exatamente o fechamento da KLBN11." },
  { q: "BBDC4 recebe ~10% a mais de dividendo que BBDC3, e custa R$ 13,86 contra R$ 12,71. O DY da PN é...", o: ["bem maior", "quase igual", "menor"], a: 1,
    why: "A PN custa ~9% a mais, então o DY fica 11,0% contra 10,9%. O mercado já cobra a vantagem no preço." },
  { q: "WEGE3, EGIE3 e TOTS3 só têm final 3. Por quê?", o: ["são pequenas", "estão no Novo Mercado", "não pagam dividendo"], a: 1,
    why: "O Novo Mercado da B3 só aceita empresas com 100% de ações ordinárias. Então não existe WEGE4." },
];

const panels = [
  () => {
    const d = document.createElement("div");
    d.innerHTML = `<h2>Clique em cada morador</h2><div class="split"><div>${scene}
      <div class="legend"><span style="--c:var(--on)">ON (final 3)</span><span style="--c:var(--pn)">PN (final 4)</span><span style="--c:var(--unit)">unit (final 11)</span></div></div>
      <div class="bubble" id="bub">Quem mora no prédio Taesa? Clique numa pessoa ou caixa da cena.</div></div>`;
    d.querySelectorAll(".who").forEach(g => g.onclick = () => d.querySelector("#bub").textContent = WHO[g.dataset.w]);
    return d;
  },
  ...Q.map((x, k) => () => {
    const d = document.createElement("div");
    d.innerHTML = `<h2>Rodada ${k + 1} de ${Q.length}</h2><div class="split"><div><p>${x.q}</p>
      <div class="opts">${x.o.map((o, j) => `<button data-j="${j}">${o}</button>`).join("")}</div>
      <div class="why" id="why"></div></div>${scene}</div>`;
    const bs = d.querySelectorAll(".opts button");
    const lock = j => {
      bs.forEach(b => { b.disabled = true; const n = +b.dataset.j; if (n === x.a) b.classList.add("right"); else if (n === j) b.classList.add("wrong"); });
      d.querySelector("#why").textContent = (j === x.a ? "Isso! " : "Não: ") + x.why;
    };
    bs.forEach(b => b.onclick = () => {
      const j = +b.dataset.j;
      if (!(k in answered)) { answered[k] = j; if (j === x.a) score++; coins(); }
      lock(j);
    });
    if (k in answered) lock(answered[k]);
    d.querySelectorAll(".who").forEach(g => g.style.opacity = .5);
    return d;
  }),
  () => {
    const d = document.createElement("div");
    d.innerHTML = `<h2>Placar: ${score} de ${Q.length}</h2><div class="split"><div class="bubble" style="font-size:1.1rem">
      <b>3</b>: vota.<br><b>4</b>: não vota, vantagem no dividendo.<br><b>11</b>: pacote de 3 e 4, preço ≈ soma, ou então é FII/ETF.<br><br>
      Pra renda: compare o DY dos papéis da mesma empresa e fique com o que paga mais por real.</div>${scene}</div>
      <p style="color:var(--muted)">Preços e DY: fundamentus, fechamento de 30/10/2026. Material de estudo, não recomendação de investimento.</p>`;
    return d;
  },
];

let p = 0;
const coins = () => $("coins").textContent = `🪙 ${score} / ${Q.length}`;
function go(n) {
  p = Math.max(0, Math.min(panels.length - 1, n));
  const d = panels[p](); d.className = "panel"; $("panel").replaceChildren(d);
  $("prev").disabled = p === 0; $("next").disabled = p === panels.length - 1;
}
$("prev").onclick = () => go(p - 1);
$("next").onclick = () => go(p + 1);
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") go(p + 1); else if (e.key === "ArrowLeft") go(p - 1); });
coins(); go(0);
</script>
</body>
</html>
