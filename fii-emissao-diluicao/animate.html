<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emissão de FII, animado</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1d1d1f; --muted: #6b6b70; --line: #d8d6d0; --panel: #f0eee8;
    --a: #e8590c; --b: #1c7ed6; --c: #2b8a3e; --d: #9c36b5; --r: #d6336c; --e: #0c8599;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141417; --fg: #ececf0; --muted: #9a9aa3; --line: #34343b; --panel: #1f1f24;
      --a: #ff922b; --b: #4dabf7; --c: #51cf66; --d: #da77f2; --r: #f06595; --e: #3bc9db;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: 6px; gap: 6px; }
  #stage { flex: 1; min-height: 0; width: 100%; display: block; }
  #stage text { white-space: pre; fill: var(--fg); }
  #caption { font-size: 22px; line-height: 1.35; min-height: 2.7em; padding: 4px 10px;
    border-left: 4px solid var(--d); background: var(--panel); border-radius: 4px; }
  #caption b { color: var(--d); }
  #terms { font-size: 16px; line-height: 1.4; min-height: 4.2em; padding: 2px 10px; color: var(--muted); }
  #terms b { color: var(--fg); }
  #bar { display: flex; align-items: center; gap: 6px; font-size: 16px; flex-wrap: wrap; }
  #bar button { font: inherit; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #bar button:not(.spd) { width: 60px; padding: 4px 0; text-align: center; letter-spacing: -3px; }
  #bar button[data-k]::after { content: attr(data-k); margin-left: 6px; font-size: 13px; letter-spacing: 0; opacity: .7; }
  #bar button:disabled { opacity: .4; cursor: default; }
  #bar button.on { border-color: var(--d); color: var(--d); }
  #timeline { flex: 1; min-width: 200px; height: 22px; display: flex; gap: 3px;
    cursor: pointer; position: relative; }
  #timeline .seg { position: relative; background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; overflow: hidden; }
  #timeline .fill { position: absolute; inset: 0; width: 0; background: var(--d); opacity: .55; }
  #where { text-align: center; font-size: 24px; font-weight: 700; padding: 2px 0; }
  #bar a { color: var(--b); }
  #links { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  #links a { color: var(--b); font-size: 16px; }
  #m { position: absolute; width: 0; height: 0; visibility: hidden; }
  #m text { white-space: pre; }
</style>
</head>
<body>
<nav id="links"><a href="../">← todas as aulas</a><a href="index.html">lição</a></nav>
<div id="where"></div>
<svg id="stage" viewBox="0 0 1600 820" preserveAspectRatio="xMidYMid meet"></svg>
<div id="caption"></div>
<div id="terms"></div>
<div id="bar">
  <button id="restart" data-k="H" title="recomeçar (H)">⏮</button>
  <button id="prev" data-k="h" title="cena anterior (h, ←)">◀◀</button>
  <button id="play" data-k="SPC" title="tocar / pausar (espaço)">▶</button>
  <button id="next" data-k="l" title="próxima cena (l, →)">▶▶</button>
  <button id="replay" data-k="r" title="repetir esta cena (r)">↻</button>
  <button class="spd" data-s="0.5" data-k="1" title="0.5x (1)">0.5x</button>
  <button class="spd on" data-s="1" data-k="2" title="1x (2)">1x</button>
  <button class="spd" data-s="2" data-k="3" title="2x (3)">2x</button>
  <div id="timeline"></div>
</div>
<svg id="m"><text id="mt"></text></svg>
<script>
const COL = { a: "var(--a)", b: "var(--b)", c: "var(--c)", d: "var(--d)", r: "var(--r)",
  m: "var(--muted)", l: "var(--line)", f: "var(--fg)", p: "var(--panel)" };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => (t = clamp(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const P = (t, a, b) => ease((t - a) / (b - a));
const L = (a, b, p) => a + (b - a) * p;
const num = v => (v < -1e-9 ? "−" : "") + Math.abs(v).toFixed(1);

let out = [];
const add = s => out.push(s);

// tokens: [text, colorKey?, bold?]; text may hold &lt; etc.
const span = ([s, c, w]) => `<tspan${c ? ` fill="${COL[c]}"` : ""}${w ? ' font-weight="700"' : ""}>${s}</tspan>`;
const mt = document.getElementById("mt"), wcache = {};
function width(tokens, size) {
  const k = size + "|" + JSON.stringify(tokens);
  if (!(k in wcache)) {
    mt.setAttribute("font-size", size);
    mt.innerHTML = tokens.map(span).join("");
    wcache[k] = mt.getComputedTextLength();
  }
  return wcache[k];
}
function text(x, y, tokens, size, o = {}) {
  if (typeof tokens === "string") tokens = [[tokens, o.c]];
  const op = o.op ?? 1;
  if (op <= 0.001) return;
  add(`<text x="${x}" y="${y}" font-size="${size}" text-anchor="${o.anchor || "start"}" opacity="${op}"${o.w ? ' font-weight="700"' : ""}>${tokens.map(span).join("")}</text>`);
}
// lays tokens out left to right centered on cx, returns each token's center x
function row(cx, y, tokens, size, o = {}) {
  const ws = tokens.map(t => width([t], size));
  let x = cx - ws.reduce((a, b) => a + b, 0) / 2;
  const centers = [];
  tokens.forEach((t, i) => {
    const op = Array.isArray(o.op) ? o.op[i] : o.op ?? 1;
    text(x, y, [t], size, { op });
    centers.push(x + ws[i] / 2);
    x += ws[i];
  });
  return centers;
}
function frac(cx, cy, numT, denT, size, op = 1, lead = "") {
  const w = Math.max(width(numT, size), width(denT, size)) + 20;
  if (op <= 0.001) return;
  if (lead) text(cx - w / 2 - 12, cy + size * 0.35, [[lead]], size, { anchor: "end", op });
  text(cx, cy - size * 0.3, numT, size, { anchor: "middle", op });
  add(`<line x1="${cx - w / 2}" x2="${cx + w / 2}" y1="${cy}" y2="${cy}" stroke="${COL.f}" stroke-width="3" opacity="${op}"/>`);
  text(cx, cy + size * 1.0, denT, size, { anchor: "middle", op });
}
function chip(x, y, label, color, size, op = 1) {
  if (op <= 0.001) return;
  const w = width([[label]], size) + 34, h = size * 1.6;
  add(`<rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="12" fill="${COL.p}" stroke="${COL[color]}" stroke-width="3" opacity="${op}"/>`);
  text(x, y + size * 0.35, [[label, color, 1]], size, { anchor: "middle", op });
}
const fly = (x0, y0, x1, y1, p, label, color, size) => {
  if (p <= 0 || p >= 1) return;
  text(L(x0, x1, p), L(y0, y1, p) - Math.sin(p * Math.PI) * 60, [[label, color, 1]], size, { anchor: "middle" });
};

// ---------- helpers, pt-BR numbers
COL.e = "var(--e)";
const dot = (x, y, color, r = 11, op = 1) => op > 0 && add(`<circle cx="${x}" cy="${y}" r="${r}" fill="${COL[color]}" opacity="${op}"/>`);
const br = v => v.toFixed(2).replace(".", ",");
const brl = v => "R$ " + br(v);
const pct = v => (Math.round(v * 1000) / 10).toString().replace(".", ",") + "%";
// horizontal number line from lo to hi; returns x for a value
function nline(x0, x1, y, lo, hi, step, op = 1, fmt = v => "" + v) {
  const f = v => L(x0, x1, (v - lo) / (hi - lo));
  if (op <= 0) return f;
  add(`<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="${COL.m}" stroke-width="3" opacity="${op}"/>`);
  for (let v = lo; v <= hi + 1e-9; v += step) {
    add(`<line x1="${f(v)}" x2="${f(v)}" y1="${y - 10}" y2="${y + 10}" stroke="${COL.m}" stroke-width="2" opacity="${op}"/>`);
    text(f(v), y + 42, [[fmt(v), "m"]], 24, { anchor: "middle", op });
  }
  return f;
}
function pin(x, y, h, label, sub, color, op = 1) {
  if (op <= 0) return;
  add(`<line x1="${x}" x2="${x}" y1="${y}" y2="${y - h}" stroke="${COL[color]}" stroke-width="4" opacity="${op}"/>`);
  dot(x, y, color, 11, op);
  text(x, y - h - 46, [[label, color, 1]], 36, { anchor: "middle", op });
  text(x, y - h - 12, [[sub, "m"]], 26, { anchor: "middle", op });
}
function box(x, y, w, h, color, op = 1, fillOp = .18, rx = 14, dash = "") {
  if (op <= 0) return;
  add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${COL[color]}" fill-opacity="${fillOp}" stroke="${COL[color]}" stroke-width="3" stroke-dasharray="${dash}" opacity="${op}"/>`);
}
const line = (x1, y1, x2, y2, color, w = 3, op = 1, dash = "") => op > 0 && add(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${COL[color]}" stroke-width="${w}" stroke-dasharray="${dash}" stroke-linecap="round" opacity="${op}"/>`);
function arrow(x1, y1, x2, y2, color, p = 1, w = 4) {
  if (p <= 0) return;
  const x = L(x1, x2, p), y = L(y1, y2, p), a = Math.atan2(y - y1, x - x1), s = 16;
  line(x1, y1, x, y, color, w);
  add(`<polygon points="${x},${y} ${x - s * Math.cos(a - .45)},${y - s * Math.sin(a - .45)} ${x - s * Math.cos(a + .45)},${y - s * Math.sin(a + .45)}" fill="${COL[color]}"/>`);
}
const GLOSS = {
  "FII": "fundo de investimento imobiliário: fundo negociado na bolsa que tem imóveis ou dívidas imobiliárias",
  "cota": "a fração do fundo que você compra na bolsa",
  "PL": "patrimônio líquido: tudo que o fundo tem menos o que deve",
  "VP por cota": "valor patrimonial por cota: PL ÷ número de cotas",
  "emissão": "o fundo cria cotas novas e vende para captar dinheiro",
  "subscrever": "comprar as cotas novas de uma emissão",
  "participação": "sua fatia do fundo: suas cotas ÷ total de cotas",
  "preço de emissão": "quanto o fundo recebe por cota nova",
  "P/VP": "preço na bolsa ÷ VP por cota; abaixo de 1 a bolsa paga menos que o patrimônio",
  "rendimento": "o dinheiro que o fundo distribui por cota todo mês",
  "caixa": "dinheiro do fundo ainda não investido em imóveis, aplicado em renda fixa",
  "cash drag": "o rendimento por cota cai enquanto o dinheiro novo está em caixa rendendo menos",
  "direito de preferência": "prioridade do cotista para subscrever na proporção do que tem; ticker final 12",
  "fator de proporção": "cotas novas ÷ cotas antigas; quantas cotas novas cada cota antiga dá direito a subscrever",
  "recibo de subscrição": "o que você recebe ao exercer e pagar o direito; ticker final 13, vira final 11 depois da oferta",
  "custo de distribuição": "taxa por cota paga por quem subscreve aos bancos da oferta; não entra no fundo",
  "preço teórico": "média ponderada das cotas velhas (preço de bolsa) e novas (preço pago) depois da oferta",
};
const TERMS = [["FII", "cota", "PL", "VP por cota"], ["emissão", "preço de emissão", "VP por cota"], ["participação", "subscrever"],
  ["preço de emissão", "VP por cota", "P/VP"], ["rendimento", "caixa", "cash drag"],
  ["direito de preferência", "fator de proporção", "recibo de subscrição"], ["custo de distribuição", "preço teórico", "direito de preferência"],
  ["subscrever", "direito de preferência", "preço teórico"], ["participação", "VP por cota", "cash drag", "direito de preferência"]];
const n2 = v => v.toFixed(2).replace(".", ",");
const r$ = v => "R$ " + n2(v);
const pat = (id, c) => `<pattern id="${id}" width="18" height="18" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="16" height="16" rx="2" fill="${COL[c]}" fill-opacity=".55"/></pattern>`;

const SCENES = [
{ title: "O fundo antes da emissão", dur: 9,
  cap: [[0, "O XPTO11 (fictício) tem <b>1 milhão de cotas</b> e PL de <b>R$ 100 milhões</b>."],
        [4, "VP por cota = PL ÷ cotas = <b>R$ 100</b>."]],
  draw(t) {
    const a = P(t, 0, 1.2);
    box(150, 650 - 300 * a, 600, 300 * a, "b", a > 0 ? 1 : 0, .3);
    text(450, 470, [["1,0 mi cotas", "b", 1]], 42, { anchor: "middle", op: P(t, 1, 1.6) });
    text(450, 540, [["PL R$ 100 mi", "b", 1]], 42, { anchor: "middle", op: P(t, 1, 1.6) });
    text(450, 710, [["XPTO11", "m"]], 32, { anchor: "middle", op: a });
    const fp = P(t, 4, 5.5), done = t >= 5.5 ? 1 : 0;
    fly(450, 540, 1200, 380 - 48 * .3, fp, "R$ 100 mi", "b", 48);
    fly(450, 470, 1200, 380 + 48, fp, "1,0 mi cotas", "b", 48);
    frac(1200, 380, [["R$ 100 mi", "b", 1]], [["1,0 mi cotas", "b", 1]], 48, done, "VP =");
    text(1200, 590, [["= R$ 100 por cota", "b", 1]], 52, { anchor: "middle", op: P(t, 6, 6.8) });
  } },

{ title: "Emissão no VP", dur: 12,
  cap: [[0, "O fundo faz uma <b>emissão</b>: 500 mil cotas novas a R$ 100 cada."],
        [4, "Entram R$ 50 milhões. PL 150 mi ÷ 1,5 mi cotas: o VP continua <b>R$ 100</b>."],
        [8, "Cada cota nova trouxe exatamente o que vale: o patrimônio por cota não diluiu."]],
  draw(t) {
    box(150, 400, 600, 300, "b", 1, .3);
    text(450, 540, [["1,0 mi cotas", "b", 1]], 38, { anchor: "middle" });
    text(450, 600, [["R$ 100 mi", "b", 1]], 38, { anchor: "middle" });
    const s = P(t, .5, 2.5), nx = L(1550, 760, s), no = P(t, .3, .8);
    box(nx, 400, 300, 300, "a", no, .3);
    text(nx + 150, 540, [["+0,5 mi cotas", "a", 1]], 34, { anchor: "middle", op: no });
    text(nx + 150, 600, [["R$ 50 mi", "a", 1]], 38, { anchor: "middle", op: no });
    const q = P(t, 4, 4.6), fp = P(t, 3, 4);
    const c = row(800, 150, [["PL = 100 + "], ["50", "a", 1], [" = "], ["R$ 150 mi", "b", 1]], 46, { op: [q, t >= 4 ? 1 : 0, q, q] });
    fly(nx + 150, 600, c[1], 150, fp, "50", "a", 46);
    row(800, 240, [["VP = 150 mi ÷ 1,5 mi cotas = "], ["R$ 100,00", "b", 1]], 46, { op: P(t, 5, 5.8) });
    line(130, 400, 1080, 400, "m", 3, P(t, 8, 8.8), "10 8");
    text(1100, 410, [["mesma altura = mesmo VP", "m"]], 30, { op: P(t, 8, 8.8) });
  } },

{ title: "Sua fatia", dur: 11,
  cap: [[0, "Cada quadrado é 1.000 cotas. Você tem 1.000 cotas: 1 quadrado de 1.000, <b>0,1%</b> do fundo."],
        [4, "A emissão acrescenta 500 quadrados. Se você não <b>subscreve</b>, seu quadrado vira 1 de 1.500: <b>0,0667%</b>."],
        [8, "Seu dinheiro não mudou: 1.000 × R$ 100 = R$ 100 mil. Mudou só a fatia."]],
  draw(t) {
    add(pat("sq-b", "b") + pat("sq-a", "a"));
    const x0 = 260, y0 = 190, g = P(t, 4, 6), o = P(t, 0, .8);
    if (o > 0) add(`<rect x="${x0}" y="${y0}" width="720" height="450" fill="url(#sq-b)" opacity="${o}"/>`);
    if (g > 0) add(`<rect x="${x0 + 720}" y="${y0}" width="${360 * g}" height="450" fill="url(#sq-a)"/>`);
    const yo = P(t, 1, 1.6);
    if (yo > 0) add(`<rect x="${x0 + 1}" y="${y0 + 1}" width="16" height="16" rx="2" fill="${COL.c}" stroke="${COL.c}" stroke-width="3" opacity="${yo}"/>`);
    arrow(x0 - 120, y0 + 9, x0 - 8, y0 + 9, "c", yo);
    text(x0 - 130, y0 + 20, [["você", "c", 1]], 32, { anchor: "end", op: yo });
    const den = t < 4 ? "1.000.000" : "1.500.000", pc = t < 4 ? "0,1%" : "0,0667%";
    row(800, 120, [["1.000 ÷ "], [den, t < 4 ? "b" : "a", 1], [" = "], [pc, "c", 1]], 46, { op: P(t, 1.5, 2.2) });
    text(800, 720, [["R$ 100 mil antes  =  R$ 100 mil depois", "f", 1]], 38, { anchor: "middle", op: P(t, 8, 8.8) });
  } },

{ title: "O preço de emissão decide", dur: 16,
  cap: [[0, "Agora o que muda é o <b>preço de emissão</b>, o quanto o fundo recebe por cota nova. A R$ 100, o VP fica R$ 100."],
        [3, "A <b>R$ 90</b>, abaixo do VP: PL 145 mi ÷ 1,5 mi = <b>R$ 96,67</b>. O cotista antigo perde 3,33%."],
        [8, "A <b>R$ 110</b>, acima do VP: PL 155 mi ÷ 1,5 mi = <b>R$ 103,33</b>. O cotista antigo ganha 3,33%."],
        [12.5, "Com <b>P/VP</b> abaixo de 1, ninguém paga R$ 100 numa cota que a bolsa vende a R$ 85: o fundo só consegue emitir diluindo."]],
  draw(t) {
    const pr = t < 3 ? 100 : t < 5 ? L(100, 90, P(t, 3, 5)) : t < 8 ? 90 : t < 10 ? L(90, 110, P(t, 8, 10)) : 110;
    const pl = 100 + .5 * pr, vp = pl / 1.5, sc = 3.6, base = 720;
    const col = vp < 99.995 ? "r" : vp > 100.005 ? "c" : "f";
    box(100, base - 100 * sc, 400, 100 * sc, "b", 1, .3, 6);
    text(300, base - 150, [["antigas: R$ 100", "b", 1]], 32, { anchor: "middle" });
    box(500, base - pr * sc, 200, pr * sc, "a", 1, .3, 6);
    text(600, base - 150, [["novas", "a", 1]], 32, { anchor: "middle" });
    text(600, base - 105, [[r$(pr), "a", 1]], 32, { anchor: "middle" });
    line(80, base - 100 * sc, 720, base - 100 * sc, "m", 3, 1, "10 8");
    line(80, base - vp * sc, 720, base - vp * sc, col === "f" ? "m" : col, 5);
    text(730, base - vp * sc + 10, [["VP novo", col === "f" ? "m" : col, 1]], 28);
    text(1180, 210, [["preço de emissão: "], [r$(pr), "a", 1]], 46, { anchor: "middle" });
    row(1180, 320, [["PL = 100 + 0,5 × "], [n2(pr), "a", 1], [" = "], [n2(pl) + " mi", "b", 1]], 38);
    row(1180, 410, [["VP = "], [n2(pl), "b", 1], [" ÷ 1,5 = "], [r$(vp), col, 1]], 38);
    const d = (vp / 100 - 1) * 100;
    text(1180, 520, [[(d > 0.005 ? "+" : d < -0.005 ? "−" : "") + n2(Math.abs(d)) + "%", col, 1]], 60, { anchor: "middle" });
    text(1180, 640, [["cota na bolsa a R$ 85 → P/VP 0,85", "r", 1]], 34, { anchor: "middle", op: P(t, 12.5, 13.3) });
  } },

{ title: "O rendimento enquanto o dinheiro espera", dur: 14,
  cap: [[0, "Antes: os imóveis rendem R$ 800 mil por mês ÷ 1 milhão de cotas = <b>R$ 0,80</b> por cota."],
        [4, "Os R$ 50 mi novos ficam em <b>caixa</b> rendendo R$ 300 mil. Agora são 1,5 mi cotas: 1.100 mil ÷ 1,5 mi = <b>R$ 0,733</b> (−8,3%)."],
        [9, "O gestor compra imóveis que rendem R$ 400 mil: 1.200 mil ÷ 1,5 mi = <b>R$ 0,80</b> de novo."]],
  draw(t) {
    const base = 690, k = 1 / 3, w = 240;
    const bar = (cx, a, parts, l1, l2, c2, lab) => {
      const g = P(t, a, a + 1.2);
      if (g <= 0) return;
      let y = base;
      parts.forEach(([v, c, l]) => {
        const h = v * k * g; y -= h;
        box(cx - w / 2, y, w, h, c, 1, .35, 4);
        text(cx, y + h / 2 + 11, [[l, c, 1]], 28, { anchor: "middle", op: P(t, a + 1, a + 1.5) });
      });
      text(cx, y - 60, [[l1, "m"]], 28, { anchor: "middle", op: P(t, a + 1.2, a + 1.8) });
      text(cx, y - 16, [[l2, c2, 1]], 40, { anchor: "middle", op: P(t, a + 1.2, a + 1.8) });
      text(cx, base + 44, [[lab, "f", 1]], 30, { anchor: "middle", op: g });
    };
    bar(300, 0, [[800, "b", "imóveis 800 mil"]], "800 mil ÷ 1,0 mi", "R$ 0,80", "b", "1. antes");
    bar(800, 4, [[800, "b", "imóveis 800 mil"], [300, "e", "caixa 300 mil"]], "1.100 mil ÷ 1,5 mi", "R$ 0,733", "r", "2. caixa parado");
    bar(1300, 9, [[800, "b", "imóveis 800 mil"], [400, "a", "novos 400 mil"]], "1.200 mil ÷ 1,5 mi", "R$ 0,80", "c", "3. alocado");
    line(120, base, 1480, base, "m", 3);
  } },

{ title: "O direito de preferência", dur: 13,
  cap: [[0, "Para proteger sua fatia, cada cota sua recebe um <b>direito de preferência</b>, ticker final 12."],
        [4, "O <b>fator de proporção</b> é 0,5 (500 mil novas ÷ 1 mi antigas): seus 1.000 direitos compram até 500 cotas novas."],
        [8, "Exerceu e pagou: o 12 vira <b>recibo</b> (final 13), que vira cota normal (final 11) depois da oferta."]],
  draw(t) {
    chip(260, 230, "1.000 × XPTO11", "b", 36, P(t, 0, .6));
    arrow(420, 230, 590, 230, "m", P(t, 1, 1.8));

{ title: "Subscrever, vender ou ignorar", dur: 14,
  cap: [[0, "Suas 1.000 cotas valiam <b>R$ 110.000</b>. Três escolhas:"],

// ---------- player
const HEADLESS = /HeadlessChrome/.test(navigator.userAgent);
const starts = []; let total = 0;
SCENES.forEach(s => { starts.push(total); total += s.dur; });
const terms = document.getElementById("terms");
const svg = document.getElementById("stage"), cap = document.getElementById("caption");
const DEFS = "";
let T = 0, playing = false, speed = 1, lastTs = null, lastKey = "";
const sceneAt = T => { let i = 0; while (i + 1 < SCENES.length && T >= starts[i + 1]) i++; return i; };

const tl = document.getElementById("timeline");
SCENES.forEach((s, i) => {
  const seg = document.createElement("div");
  seg.className = "seg"; seg.style.flex = s.dur; seg.title = `${i + 1}. ${s.title}`;
  seg.innerHTML = '<div class="fill"></div>';
  tl.appendChild(seg);
});
const fills = [...tl.querySelectorAll(".fill")];

function render() {
  const i = sceneAt(T), s = SCENES[i], t = Math.min(T - starts[i], s.dur);
  const key = i + ":" + t.toFixed(3);
  if (key === lastKey) return;
  lastKey = key; out = [];
  s.draw(t);
  svg.innerHTML = DEFS + out.join("");
  const c = s.cap.filter(([a]) => a <= t + 1e-6).pop();
  if (cap.innerHTML !== c[1]) cap.innerHTML = c[1];
  const tm = TERMS[i].map(k => `<b>${k}</b>: ${GLOSS[k]}`).join(" · ");
  if (terms.innerHTML !== tm) terms.innerHTML = tm;
  fills.forEach((f, k) => f.style.width = (k < i ? 100 : k > i ? 0 : 100 * (T - starts[i]) / s.dur) + "%");
  document.getElementById("where").textContent = s.title;
  document.getElementById("prev").disabled = i === 0;
  document.getElementById("next").disabled = i === SCENES.length - 1;
}
function loop(ts) {
  if (playing && lastTs !== null) {
    const end = sceneEnd(sceneAt(T));
    T += (ts - lastTs) / 1000 * speed;
    if (T >= end) { T = end; setPlaying(false); }
  }
  lastTs = ts;
  render();
  requestAnimationFrame(loop);
}
function setPlaying(v) { playing = v; document.getElementById("play").textContent = v ? "⏸" : "▶"; }
// headless (fit-check) jumps to each scene's final frame so the page settles
function go(i) {
  i = clamp(i, 0, SCENES.length - 1);
  T = HEADLESS ? sceneEnd(i) : starts[i];
  if (!HEADLESS) setPlaying(true);
  render();
}
// a scene stops on its last frame; play there starts the next one
const sceneEnd = i => starts[i] + SCENES[i].dur - 1e-3;
document.getElementById("play").onclick = () => {
  const i = sceneAt(T);
  if (playing) return setPlaying(false);
  if (T >= sceneEnd(i)) return go(i === SCENES.length - 1 ? 0 : i + 1);
  setPlaying(true);
};
document.getElementById("replay").onclick = () => go(sceneAt(T));
document.getElementById("restart").onclick = () => go(0);
document.getElementById("prev").onclick = () => go(sceneAt(T) - 1);
document.getElementById("next").onclick = () => go(sceneAt(T) + 1);
document.querySelectorAll(".spd").forEach(b => b.onclick = () => {
  speed = +b.dataset.s;
  document.querySelectorAll(".spd").forEach(x => x.classList.toggle("on", x === b));
});
function scrub(e) {
  const r = tl.getBoundingClientRect();
  T = clamp((e.clientX - r.left) / r.width) * total * 0.9999;
  setPlaying(false);
  render();
}
tl.addEventListener("pointerdown", e => { scrub(e); tl.setPointerCapture(e.pointerId); tl.onpointermove = scrub; });
tl.addEventListener("pointerup", () => tl.onpointermove = null);
const KEYS = { " ": "#play", l: "#next", ArrowRight: "#next", h: "#prev", ArrowLeft: "#prev", H: "#restart", r: "#replay",
  1: ".spd[data-s='0.5']", 2: ".spd[data-s='1']", 3: ".spd[data-s='2']" };
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.ctrlKey || e.altKey || e.metaKey || !KEYS[e.key]) return;
  e.preventDefault();
  document.querySelector(KEYS[e.key]).click();
});
if (HEADLESS) go(0);
requestAnimationFrame(loop);
</script>
